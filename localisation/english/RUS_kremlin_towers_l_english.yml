 RUS_kt_authority_tt:0 "At 100% loyalty, a bloc contributes 20% stability.\n\nSecurity services: [?RUS.RUS_kt_contributions^0|2]%\nDefence industry: [?RUS.RUS_kt_contributions^1|2]%\nTechnocrats: [?RUS.RUS_kt_contributions^2|2]%\nGeneral officer corps: [?RUS.RUS_kt_contributions^4|2]%\nOligarchs: [?RUS.RUS_kt_contributions^5|2]%\n\nStability: §Y[?RUS.RUS_kt_authority|2]%§!\n\n§YOverall situation:§!\nStability: [?RUS.RUS_kt_stability_factor|%+1]\nPolitical power gain: [?RUS.RUS_kt_political_power_factor|%+1]\n\nFive blocs contribute, excluding the administration. More influential blocs carry more weight. Loyalty and mood above 50% give a bonus, below 50% a penalty. At 50% that measure contributes zero.\n\nMood carries 70% of the weight for stability. Loyalty carries 70% for political power gain. The other measure accounts for the remaining 30% in each case. The blocs’ contributions add up to between -15% and +15% for each effect."
 RUS_kt_security_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^0|0]%§!"
 RUS_kt_defence_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^1|0]%§!"
 RUS_kt_technocrats_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^2|0]%§!"
 RUS_kt_administration_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^3|0]%§!"
