 RUS_kt_authority_tt:0 "At 100% loyalty, a bloc contributes 20% stability.\n\nSecurity services: [?RUS.RUS_kt_contributions^0|2]%\nDefence industry: [?RUS.RUS_kt_contributions^1|2]%\nTechnocrats: [?RUS.RUS_kt_contributions^2|2]%\nGeneral officer corps: [?RUS.RUS_kt_contributions^4|2]%\nOligarchs: [?RUS.RUS_kt_contributions^5|2]%\n\nStability: §Y[?RUS.RUS_kt_authority|2]%§!\n\n§YOverall situation:§!\nStability: [?RUS.RUS_kt_stability_factor|%+1]\nPolitical power gain: [?RUS.RUS_kt_political_power_factor|%+1]\n\nFive blocs contribute, excluding the administration. More influential blocs carry more weight. Loyalty and mood above 50% give a bonus, below 50% a penalty. At 50% that measure contributes zero.\n\nMood carries 70% of the weight for stability. Loyalty carries 70% for political power gain. The other measure accounts for the remaining 30% in each case. The blocs’ contributions add up to between −15% and +15% for each effect."
 RUS_kt_security_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^0|0]%§!"
 RUS_kt_defence_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^1|0]%§!"
 RUS_kt_technocrats_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^2|0]%§!"
 RUS_kt_administration_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^3|0]%§!"
 RUS_kt_generals_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^4|0]%§!"
 RUS_kt_oligarchs_mood:0 "Faction mood: §Y[?RUS.RUS_kt_mood^5|0]%§!"
 RUS_kt_patronage_label:0 "Patronage Network"
 RUS_kt_patronage_tt:0 "An informal system of personal ties, political patronage and mutual obligations linking government officials, the security services and big business. The distribution of posts, resources and privileges secures elite loyalty, allowing the president to coordinate competing groups and maintain the existing political balance."
 RUS_kt_role_tt:0 "Russia’s political elite consists of competing groups, each seeking to strengthen its position and gain access to state resources. Vladimir Putin acts as the chief arbiter of their disputes, distributing powers, posts and privileges among rival centres of power. By balancing their interests and keeping any one group from gaining too much power, the president retains the final say in political conflicts. Yet this system increasingly depends on his personal authority and his ability to manage rivalries within the elite."
 RUS_kt_influence_instrument:0 "Instrument of influence"
 RUS_kt_loyalty_tier_0:0 "§YLoyalty crisis (0–19%)§!\nThe president is losing the ability to command the group’s obedience. Its members may openly oppose decisions, seek support from rival centres of power and provoke a serious political crisis."
 RUS_kt_loyalty_tier_1:0 "§YUnreliable obedience (20–39%)§!\nThe group increasingly puts its interests ahead of the leadership’s orders. It remains formally loyal, but sabotage, internal intrigue and broken agreements grow more likely."
 RUS_kt_loyalty_tier_2:0 "§YConditional loyalty (40–59%)§!\nThe group still answers to the president but increasingly seeks autonomy. Some directives may encounter quiet resistance, delays and objections from within the bureaucracy."
 RUS_kt_loyalty_tier_3:0 "§YSteady loyalty (60–79%)§!\nThe group accepts presidential authority and generally follows the established political course. When decisions affect its core interests, it may seek concessions and additional guarantees."
 RUS_kt_loyalty_tier_4:0 "§YUnconditional obedience (80–100%)§!\nThe group accepts the president’s supremacy and carries out his decisions almost without question. Its discipline may reflect a stake in the existing order or fear of losing its position."
 RUS_kt_mood_tier_0:0 "§YExtreme discontent (0–19%)§!\nMembers consider their position unacceptable. Accumulated grievances set the stage for open institutional conflict, temporary alliances and attempts to alter the political balance."
 RUS_kt_mood_tier_1:0 "§YDeep discontent (20–39%)§!\nThe group believes its interests are routinely ignored. Frustration with the leadership and the distribution of influence intensifies institutional rivalry, making conflict and hard demands more likely."
 RUS_kt_mood_tier_2:0 "§YLatent discontent (40–59%)§!\nDissatisfaction is growing over resources, appointments or limits on the group’s powers. Its representatives press their interests more forcefully and expect concessions from the president."
 RUS_kt_mood_tier_3:0 "§YFavourable mood (60–79%)§!\nThe group is broadly satisfied with its position, although some issues remain contentious. Its members prefer to seek new advantages through negotiation and established lobbying channels."
 RUS_kt_mood_tier_4:0 "§YFull satisfaction (80–100%)§!\nMembers are satisfied with their place in the political system. They see their interests reflected in decisions and consider the distribution of powers and resources favourable. There is little cause for serious internal discontent."
 RUS_kt_security_overview_tt:0 "The security agencies are a pillar of the political order. Their broad powers, access to classified information and considerable institutional resources help them strengthen their position within the state. Despite their formal unity, individual agencies compete over jurisdiction, funding and influence with the president."
 RUS_kt_security_loyalty_tier_tt:0 "[RUS_kt_security_loyalty_tier]"
 RUS_kt_security_mood_tier_tt:0 "[RUS_kt_security_mood_tier]"
 RUS_kt_defence_overview_tt:0 "Executives of defence enterprises and state corporations wield considerable influence over industrial policy and military technology. They seek larger state orders, higher funding and continued control over production. Their reliance on the state budget gives them a strong interest in retaining the political leadership’s favour."
 RUS_kt_defence_loyalty_tier_tt:0 "[RUS_kt_defence_loyalty_tier]"
 RUS_kt_defence_mood_tier_tt:0 "[RUS_kt_defence_mood_tier]"
 RUS_kt_technocrats_overview_tt:0 "Economic officials keep the state apparatus running, maintain financial stability and implement economic policy. Drawing on their expertise and administrative experience, they seek continuity and predictability in government decisions. The political interests of other groups often limit their influence."
 RUS_kt_technocrats_loyalty_tier_tt:0 "[RUS_kt_technocrats_loyalty_tier]"
 RUS_kt_technocrats_mood_tier_tt:0 "[RUS_kt_technocrats_mood_tier]"
 RUS_kt_administration_overview_tt:0 "The presidential administration coordinates state policy and puts the president’s decisions into effect. It tracks directives, oversees appointments and manages relations with state institutions, keeping the presidential chain of command functioning. Rival patronage networks also compete within its ranks."
 RUS_kt_administration_loyalty_tier_tt:0 "[RUS_kt_administration_loyalty_tier]"
 RUS_kt_administration_mood_tier_tt:0 "[RUS_kt_administration_mood_tier]"
 RUS_kt_generals_overview_tt:0 "Senior military commanders represent the armed forces within the state. Their professional expertise and command authority give them a voice in securing funding, preserving military autonomy and shaping strategic plans. Their interests do not always coincide with those of the political leadership or defence industry."
 RUS_kt_generals_loyalty_tier_tt:0 "[RUS_kt_generals_loyalty_tier]"
 RUS_kt_generals_mood_tier_tt:0 "[RUS_kt_generals_mood_tier]"
 RUS_kt_oligarchs_overview_tt:0 "Russia’s largest business owners control substantial financial, industrial and infrastructure assets. Their position depends heavily on relations with the state, access to contracts and political patronage. To protect their property and economic interests, they must accommodate political demands while competing with other centres of influence."
 RUS_kt_oligarchs_loyalty_tier_tt:0 "[RUS_kt_oligarchs_loyalty_tier]"
 RUS_kt_oligarchs_mood_tier_tt:0 "[RUS_kt_oligarchs_mood_tier]"
 RUS_kt_towers_modifier:0 "Kremlin Towers"
