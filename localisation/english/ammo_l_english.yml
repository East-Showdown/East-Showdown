 ammunition_window_effect_hard_attack_text: "Hard attack: [?ammunition_bonus_attack|=+%1]"
 ammunition_window_effect_breakthrough_text: "Breakthrough: [?ammunition_bonus_breakthrough|=+%1]"
 ammunition_window_effect_defense_text: "Defense: [?ammunition_bonus_defense|=+%1]"
 ammunition_window_effects_tt: "§YChange of the stats of artillery, self-propelled guns, MLRS, TOS and mortars at the current supply.§! Other equipment is not affected.\nThe effect works through a national spirit, in steps of 5% supply.\nBreakthrough works only in attack, defense only in defense.\n\nAI aggressiveness: [?ammunition_effect_ai_focus_aggressive_factor|=+%0]"

