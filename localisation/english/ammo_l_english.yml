 ammunition_plant: "Ammunition Plant"
 ammunition_plant_desc: "A plant that manufactures ammunition.\nPower consumption: §R-0.075§! GW"
 ammunition_silo: "Ammunition Silo"
 ammunition_silo_desc: "A storage facility for ammunition."

 ammunition_window_title_text: "§YAmmunition Management§!"
 ammunition_window_plants_title_text: "§gAmmunition Plants: §Y[?modifier@ammunition_plants|0]§!§!"
 ammunition_window_plants_title_tt: "§YAmmunition factory capacity§!\nBefore efficiency: §Y[GET_ammunition_plans_production_base_value_disp] units/day§!\nAfter efficiency: §Y[GET_ammunition_plants_production_value_disp] units/day§!\nFactory efficiency: [GET_ammunition_plants_efficiency_factor_var]\n\nCapacity is split between producing new and refurbishing old ammunition."
 ammunition_window_plants_production_factor_text: "Production:"
 ammunition_window_plants_factor_production_value_text: "§Y[?ammunition_produce_factor|%0]§!"
 ammunition_window_plants_recovery_factor_text: "Recovery:"
 ammunition_window_plants_recovery_factor_value_text: "§Y[?ammunition_recovery_factor|%0]§!"
 ammunition_window_plants_production_tt: "§YProduction of new ammunition§!\nShare of capacity: §Y[?ammunition_produce_factor_result|%0]§!\nEfficiency: §Y[?ammunition_produce_efficiency_factor_var|%0]§!\nOutput: §G[GET_ammunition_produce_value_k_disp] units/day§!"
 ammunition_window_plants_recovery_tt: "§YRefurbishment of old ammunition§!\nShare of capacity: §Y[?ammunition_recovery_factor_result|%0]§!\nEfficiency: §Y[?ammunition_recovery_efficiency_factor_var|%0]§!\nOutput: §G[GET_ammunition_recovery_value_k_disp] units/day§!\n\nFactories refurbish no more than the old ammunition there is. Spare capacity goes to production."
 ammunition_window_plants_factor_production_button_tt: "§YAdjust the allocation of capacity between producing new and refurbishing old ammunition§!\n\n§YLMB§! - add 1% to production\n§YCTRL+LMB§! - add 10% to production\n§YSHIFT+LMB§! - add 100% to production\n\n§YRMB§! - add 1% to refurbishment\n§YCTRL+RMB§! - add 10% to refurbishment\n§YSHIFT+RMB§! - add 100% to refurbishment"
 ammunition_window_generation_text: "Generation: §G[GET_ammunition_generation_value_k_disp] units/day§!"
 ammunition_window_generation_tt: "§YGeneration§! - ammunition the factories deliver per day.\nProduction: §G[GET_ammunition_produce_value_k_disp] units/day§!\nRefurbishment: §G[GET_ammunition_recovery_value_k_disp] units/day§!"

 ammunition_window_stock_title_text: "§gAmmunition Silos: §Y[?modifier@ammunition_silos|0]§!§!"
 ammunition_window_stock_title_tt: "§YTotal capacity: [GET_ammunition_max_storage_capacity_k_disp] units§!\nFrom ammunition silos: §Y[GET_ammunition_silos_capacity_k_disp] units§!\nFrom field depots: §Y[GET_ammunition_field_storage_capacity_k_disp] units§! - [?constant:ammunition.field_storage_days|0] days of fire of all artillery"
 ammunition_window_stock_text: "Stock: §G[GET_ammunition_value_k_disp]§! / §O[GET_ammunition_max_storage_capacity_k_disp]§! ([?ammo_ratio_var|0]%)"
 ammunition_window_stock_tt: "Ready for use: §G[GET_ammunition_value_k_disp] units§!\nNeeds refurbishment: §Y[GET_ammunition_old_value_k_disp] units§!\nStorage fill level: [GET_ammunition_silos_filling_factor]"
 ammunition_window_old_stock_text: "Needs refurbishment: §Y[GET_ammunition_old_value_k_disp] units§!"
 ammunition_window_old_stock_tt: "§YOld ammunition.§! It is not used in combat until the factories refurbish it. It takes storage space; when storage overflows, it is written off first."
 ammunition_window_balance_text: "Balance: [GET_ammunition_delta_value_k]"
 ammunition_window_balance_tt: "§YDaily balance§! = generation - spent\nGeneration: §G[GET_ammunition_generation_value_k_disp] units/day§!\nSpent: §R[GET_ammunition_spent_k_disp] units/day§!"
 ammunition_window_stock_days_text: "[GET_ammunition_window_stock_days]"
 ammunition_window_stock_days_run_out: "§RAmmunition depleted§!"
 ammunition_window_stock_days_will_run_out: "Runs out in: §R[?ammo_days_to_empty|0]§! days"
 ammunition_window_stock_days_filled: "§GStorage is full§!"
 ammunition_window_stock_days_will_be_full: "Fills up in: §G[?ammo_days_to_full|0]§! days"
 ammunition_window_stock_days_stable: "§YStock is stable§!"
 ammunition_window_days_at_level_1_text: "Days at level 100%: [GET_ammunition_days_at_level_1]"
 ammunition_window_days_at_level_1_tt: "§YHow many days the ready stock lasts at supply level 100%§!\nNeed at level 100%: §R[GET_ammunition_need_reference_k_disp] units/day§![GET_ammunition_need_reference_note]\nGeneration: §G[GET_ammunition_generation_value_k_disp] units/day§!\n\nIf generation covers the need: §G1000+§!."
 ammunition_need_reference_no_combat: "\nNo combat: estimate for all the country's divisions in defense."
 ammunition_days_at_level_1_value: "§O[?ammunition_days_at_level_1|0]§!"
 ammunition_days_at_level_1_unlimited: "§G1000+§!"

 ammunition_window_consumption_title_text: "§gAmmunition Allocation§!"
 ammunition_window_supply_factor_ai_status_text: "§YAutomation:§!"
 ammunition_supply_factor_ai_disabled: "§Roff§!"
 ammunition_supply_factor_ai_enabled: "§Gon§!"
 ammunition_window_supply_factor_ai_status_tt: "§YAutomation sets the supply level every day by the same rule as the AI.§!\n\nDays of stock at level 100% with generation: §O[?ammunition_days_at_level_1|0]§!\n  From §Y[?constant:ammunition.ai_days_low|0]§! to §Y[?constant:ammunition.ai_days_high|0]§!: §Y100%§!.\n  Fewer than §Y[?constant:ammunition.ai_days_low|0]§!: the level at which the stock lasts §Y[?constant:ammunition.ai_days_low|0]§! days, but not below §Y[?constant:ammunition.ai_level_min|%0]§!.\n  More than §Y[?constant:ammunition.ai_days_high|0]§!: the level at which the stock lasts §Y[?constant:ammunition.ai_days_high|0]§! days.\n\nTarget modifiers are added to the result: §Y[?modifier@ammunition_level_target|+%0]§!.\nThe level never exceeds the cap."
 ammunition_window_level_text: "Supply level: [GET_ammunition_level]"
 ammunition_window_level_cap_text: "Supply cap: [GET_ammunition_level_cap]"
 ammunition_window_level_button_tt: "§YChange the supply level§!\n\n§YLMB§! - raise by 1%\n§YCTRL+LMB§! - raise by 10%\n§YSHIFT+LMB§! - raise by 100%\n\n§YRMB§! - lower by 1%\n§YCTRL+RMB§! - lower by 10%\n§YSHIFT+RMB§! - lower by 100%"
 ammunition_level_cap_lowered: "§Y[?ammunition_level_max|%0]§!"
 ammunition_level_cap_base: "§G[?ammunition_level_max|%0]§!"
 ammunition_level_cap_reasons_lowered: "\n\n§YThe cap is lowered§! from the base maximum §Y[?constant:ammunition.level_max_base|%0]§! to §Y[?ammunition_level_max|%0]§!.\nCap modifiers: [?modifier@ammunition_level_cap|+%0]\n[GET_ammunition_level_cap_source]"
 ammunition_level_cap_reasons_raised: "\n\n§GThe cap is raised§! from the base maximum §Y[?constant:ammunition.level_max_base|%0]§! to §G[?ammunition_level_max|%0]§!, at most §Y[?constant:ammunition.level_max_abs|%0]§!.\nCap modifiers: [?modifier@ammunition_level_cap|+%0]\n[GET_ammunition_level_cap_source]"
 ammunition_level_cap_source_RUS_genstab: "  - $ammunition_RUS_genstab_limitation$"
 ammunition_level_cap_source_war_mobilisation: "  - $ammunition_war_mobilisation$"
 ammunition_level_cap_source_other: "  - other sources"
 ammunition_level_auto_reason_low_days: "\n\n§YAutomation lowered the level:§! at 100% the stock lasts only §O[?ammunition_days_at_level_1|0]§! days, fewer than §Y[?constant:ammunition.ai_days_low|0]§!."
 ammunition_level_auto_reason_high_days: "\n\n§GAutomation raised the level:§! at 100% the stock lasts §O[?ammunition_days_at_level_1|0]§! days, more than §Y[?constant:ammunition.ai_days_high|0]§!."
 ammunition_level_auto_target: "\n\n§YAutomation shifts the level by target modifiers:§! [?modifier@ammunition_level_target|+%0]"
 ammunition_empty_text: ""
 ammunition_window_level_tt: "§YShare of the full need of the units in combat that is sent to the front.§!\n\nRange: §Y[?constant:ammunition.level_min|%0]§! - §Y[?ammunition_level_max|%0]§!\nBelow 100% the artillery gets a penalty, above 100% a bonus; consumption grows with the level.[GET_ammunition_level_cap_reasons]"
 ammunition_window_level_auto_text: "Automation target: §Y[?ammunition_level_auto|%0]§!"
 ammunition_window_level_auto_tt: "§YThe supply level that automation sets§!, with target modifiers, not above the cap.[GET_ammunition_level_auto_reason][GET_ammunition_level_auto_target]"
 ammunition_level_green: "§G[?ammunition_level|%0]§!"
 ammunition_level_yellow: "§Y[?ammunition_level|%0]§!"
 ammunition_level_red: "§R[?ammunition_level|%0]§!"
 ammunition_window_spent_text: "Spent: [GET_ammunition_window_spent]"
 ammunition_no_combat: "§Gno combat§!"
 ammunition_window_spent_normal: "§O[GET_ammunition_spent_k_disp]§! of §O[GET_ammunition_need_k_disp]/day§!"
 ammunition_window_spent_red: "§R[GET_ammunition_spent_k_disp]§! of §R[GET_ammunition_need_k_disp]/day§!"
 ammunition_window_spent_tt: "§YSpent§! - how much ammunition the front received per day of the need at the current supply level.\nThe need grows with the number of divisions in combat and with the supply level. Out of combat no ammunition is used.[GET_ammunition_cover_shortage]"
 ammunition_window_cover_text: "Cover: [GET_ammunition_cover]"
 ammunition_window_supply_text: "Supply: [GET_ammunition_supply]"
 ammunition_window_cover_tt: "§YCover§! - share of the need that the stock and the daily generation could deliver. Below 100% the front gets less than it asked for.[GET_ammunition_cover_shortage]"
 ammunition_window_supply_tt: "§YSupply§! - supply level × cover. It sets the effect on the artillery.[GET_ammunition_cover_shortage]"
 ammunition_cover_shortage: "\n\n§RShortage:§! need §R[GET_ammunition_need_k_disp] units§!, available §O[GET_ammunition_available_k_disp] units§! (stock and daily generation). Raise generation or lower the supply level."
 ammunition_cover_green: "§G[?ammunition_cover|%0]§!"
 ammunition_cover_red: "§R[?ammunition_cover|%0]§!"
 ammunition_supply_green: "§G[?ammunition_supply|%0]§!"
 ammunition_supply_yellow: "§Y[?ammunition_supply|%0]§!"
 ammunition_supply_red: "§R[?ammunition_supply|%0]§!"
 ammunition_window_divisions_text: "Divisions: §O[?ammunition_divisions|0]§! (att §O[?ammunition_divisions_off|0]§!, def §O[?ammunition_divisions_def|0]§!)"
 ammunition_window_divisions_tt: "§YDivisions in combat§!\nIn attack: §O[?ammunition_divisions_off|0]§!, consumption ×§Y[?ammunition_factor_off|2]§!\nIn defense: §O[?ammunition_divisions_def|0]§!, consumption ×§Y[?ammunition_factor_def|2]§!\nDivisions out of combat use no ammunition."

