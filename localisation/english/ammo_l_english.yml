l_english:
 ammunition_topbar_tooltip_delayed: "§HAmmunition§! is produced in Military Factories or Ammunition Plants.\n§YConsume ammunition:§! artillery, self-propelled guns, MLRS, TOS and mortars.\n§RWithout ammunition they lose attack, breakthrough and defense.§!"

 ammunition_plants: "Ammunition Plants"
 ammunition_silos: "Ammunition Silos"

 ammunition_effects: "Ammunition"
 daily_ammunition_gain: "£GFX_ammo_icon Daily nominal \nammunition production"
 ammunition_plants_efficiency_factor: "£GFX_ammo_icon Ammunition plants efficiency"
 ammunition_capacity_k: "£GFX_ammo_icon Ammunition storage capacity (K)"
 ammunition_recovery_efficiency_factor: "£GFX_ammo_icon Old ammunition recovery efficiency"
 ammunition_produce_efficiency_factor: "£GFX_ammo_icon Ammunition production efficiency"
 ammunition_consumption_offensive_factor: "£GFX_ammo_icon Base ammunition consumption in offense"
 ammunition_consumption_defensive_factor: "£GFX_ammo_icon Base ammunition consumption in defence"
