ukr_news.1.t: "Bloody Strike on Children’s Hospital Ohmatdyt"
ukr_news.1.desc: "Early today a powerful blast hit Kyiv’s largest children’s hospital, Ohmatdyt. The strike levelled the surgical wing, where dozens of operations were under way. There are dead and wounded among doctors and young patients.\n\nImages of medics carrying bloodied children from the ruins stunned the world. Kyiv called the attack a deliberate war crime, while Moscow denies targeting civilian infrastructure, claiming a Ukrainian air-defence missile destroyed the building. International bodies demand an independent investigation.\n\nWhatever the truth, the shattered children’s hospital has become a fresh symbol of the war’s rising brutality."
ukr_news.1.a: "How awful—poor children"
ukr_news.1.b: "How awful—poor children"
ukr_news.1.c: "Ukrainian AD never ceases to amaze"

ukr_news.2.t: "SBU Nabs Top FSB Mole"
ukr_news.2.desc: "The Security Service of Ukraine has detained a traitor in its own ranks working for Russian intelligence. SBU chief Vasyl Maliuk personally led the arrest.\nAccording to sources, the traitor is Colonel Dmytro Kozyura, head of the ATC Staff at the SBU. Maliuk said the service documented fourteen episodes of his criminal activity.\nMaliuk joined the investigative group himself and briefed President Zelenskyy at every stage."
ukr_news.2.a: "Great work, Mr Maliuk!"
ukr_news.2.b: "Oh wow!"
ukr_fpv.1.t: "Madyar’s FPV Unit Wrecks the Enemy"
ukr_fpv.1.d: "Fresh footage from the Ukrainian drone unit led by the pilot call-sign ‘Madyar’ has flooded social media. Their homemade FPV-kamikaze drones wiped out several armoured vehicles in the Donetsk sector in a single sortie.\n\nSeconds before impact the now-viral cry ‘Dzha-ga-dzha-ga!’ rings out, then the camera vanishes in a flash and explosion. The meme boosts Ukrainian morale while Russian crews hurriedly weld on more ‘barbecue-rack’ cages.\n\nAnalysts note: cheap FPVs in skilled hands change battles faster than either side can react with traditional deliveries. Kyiv has announced a programme-wide scale-up; Moscow dismisses the clips as ‘staged’. But on the front line, more and more Russian “yoblyks” keep getting hit."
ukr_fpv.1.a: "Dzha-ga-dzha-ga!"

ukr_fpv.2.t: "Hostri Kartuzy Slice Up the Front"
ukr_fpv.2.d: "The new Ukrainian FPV unit ‘Hostri Kartuzy’ released striking footage: a swarm of quadcopter kamikazes precisely demolishes enemy trenches.\n\nOperators punctuate each hit with jocular commentary. Russian troops respond with extra cages, yet even reinforced grills can’t guarantee safety from the Kartuzy raids."
ukr_fpv.2.a: "Slobozhanshchyna pilots at work!"

ukr_fpv.3.t: "Unit Signum"
ukr_fpv.3.d: "The Ukrainian FPV unit Signum published confirmed footage of coordinated night strikes on Russian artillery sites. Low-cost quadcopters with thermal sights and shaped-charge warheads disabled several howitzers and ammo depots."
ukr_fpv.3.a: "Keep it up!"

ukr_fpv.4.t: "Unit RUPAK"
ukr_fpv.4.d: "Verified footage shows FPV-battalion RUPAK in action. At dawn they knocked out three self-propelled guns, two ammo carriers and a mobile radar. They also intercept Orlan-type Russian UAVs."
ukr_fpv.4.a: "Keep it up!"

ukr_volunteer.1.t: "‘Stalovyi Front’ Delivers Results"
ukr_volunteer.1.d: "Metinvest’s ‘Stalovyi Front’ initiative, run with volunteer funds, is mass-supplying troops with prefab bunkers, trench armour, hedgehogs and mobile shelters. The plants turn out over 2 000 t of special steel weekly, 24/7.\n\nCommanders report the blast-proof capsules cut losses and let artillery move closer to firing lines. Engineers praise the modular design—one crane crew builds a full fighting position in under two hours.\n\nThe more convoys roll out, the clearer it is: today’s war of attrition is measured in millimetres of hardened steel."
ukr_volunteer.1.a: "Fortify every metre."

ukr_volunteer.2.t: "‘Nebesnyi Rusoriz’ Changes the Game!"
ukr_volunteer.2.d: "The civilian drive ‘Nebesnyi Rusoriz’ set a Ukrainian crowdfunding record, raising over ₴350 million in 48 hours to buy drones that will hunt Russian UAVs. Veteran foundations and drone start-ups ran the campaign.\n\nFunds will buy 3 000 FPV platforms, secure control stations and a mobile training centre due at the front within a month.\n\nObservers note the growing fusion of volunteer logistics and state procurement, blurring the line between civic solidarity and military clout. Moscow called the fundraiser ‘terrorist financing’, a claim greeted with online mockery.\n\nWhatever critics say, thousands of new drones will soon reach the front."
ukr_volunteer.2.a: "Donate to the next rusoriz!"

ukr_SMO.1.t: "Rapid Russian Advance"
ukr_SMO.1.desc: "President Putin has announced a ‘special military operation’ in Ukraine and Russian forces moved within hours. The State Border Guard Service was almost wiped out by artillery along with border units. Clearly, Russian intelligence had long mapped the AFU’s peacetime and wartime positions."
ukr_SMO.1.a: "We must stop them!"

ukr_hidden.1.t: "First Wave of Oligarchs Flee"
ukr_hidden.1.d: "Latest reports say that on Sunday 30 January, Rinat Akhmetov and Viktor Pinchuk flew out of Boryspil Airport."
ukr_hidden.1.a: "Too early"

ukr_hidden.2.t: "Second Wave of Oligarch Exits"
ukr_hidden.2.d: "On 10 February, Novynskyi, Yaroslavskyi and Abramovych left the country, according to new information."
ukr_hidden.2.a: "Do they sense something?"

ukr_hidden.3.t: "Third Wave of Oligarch Flight"
ukr_hidden.3.d: "On 13 February, Nesternenko, Stolar and Khmelnytskyi reportedly departed."
ukr_hidden.3.a: "Soon..."

ukr_hidden.4.t: "A Million Shells a Year"
ukr_hidden.4.d: "With front-line demand soaring and foreign deliveries unstable, ramping up domestic production is ever more vital. Ukraine is already scaling output, but we need not tens of thousands—millions. One million shells a year is the ambitious target. Can resources, capacity and staff meet it? The future depends not only on allies but on our own assembly lines."
ukr_hidden.4.a: "We’ll do it!"

ukr_hidden.5.t: "Goal Met—and Surpassed!"
ukr_hidden.5.d: "We set an ambitious goal and met it: over 1 000 000 shells produced in a year. This is the result of engineers, workers and logisticians working round-the-clock. Production continues—this is only the beginning."
ukr_hidden.5.a: "Let’s drink to that!"

ukr_hidden.6.t: "Did We Succeed?"
ukr_hidden.6.d: "We hit a million shells—yes. Lines never stopped, shifts ran without breaks. But now reports show dispersion issues, trajectory instability and fitting flaws. We’ll keep refining and tightening QC. A million is power; an accurate million is victory."
ukr_hidden.6.a: "This is a fiasco..."

ukr_hidden.7.t: "Bad News from the Front"
ukr_hidden.7.d: "We boasted of a million shells, yet footage shows duds, wild shots or barrels bursting. Commanders cite unstable batches. Production continues, but lessons will be learned: quantity matters, yet quality wins."
ukr_hidden.7.a: "Hmm..."

ukr_spiderweb_operation.1.t: "Operation ‘Spiderweb’"
ukr_spiderweb_operation.1.d: "Leaks reveal drone strikes on Russian airfields. Unclear whether the attack on the Crimean Bridge and strikes in Bryansk and Moscow regions are part of ‘Spiderweb’, but by day’s end: a damaged bridge pier and a new Kronstadt UAV plant hit. Airbases Olenya, Ivanovo, Dyagilevo and Belaya were all struck, with at least 12 VKS aircraft damaged—7 Tu-95, 4 Tu-22, 1 An-12 (CSIS confirms 14; AFU GS claims 41). Drones were hidden in container roofs and launched from civilian trucks.\nRussia cannot quickly replace long-range bombers. Experts foresee ‘retaliatory strikes’, but for now we await further news."
ukr_spiderweb_operation.1.a: "A daring raid"
ukr_spiderweb_operation.1.b: "Holy hell."

ukr_big_cleaning.1.t: "Poroshenko’s Fate"
ukr_big_cleaning.1.d: "President Zelenskyy faces a tough choice concerning Petro Poroshenko. Investigations are intensifying and two scenarios emerge:\n• ‘Honourable Exile’—Poroshenko leaves Ukraine in exchange for charges being dropped, avoiding internal conflict but weakening Zelenskyy before the opposition.\n• ‘Trial and Punishment’—proceed with prosecution, arrest Poroshenko and show that no one is above the law, strengthening Zelenskyy’s base but angering the West and raising instability."
ukr_big_cleaning.1.a: "Prison!"
ukr_big_cleaning.1.b: "Offer him a... trip abroad"

ukr_big_cleaning.2.t: "Tymoshenko’s Fate"
ukr_big_cleaning.2.d: "Yuliya Tymoshenko remains powerful. Two options:\n• ‘Political Exile’—let her leave the country, easing tension but fuelling accusations of authoritarianism.\n• ‘Arrest and Trial’—prosecute her for corruption, signalling resolve but risking backlash from her supporters."
ukr_big_cleaning.2.a: "Yulia and jail are synonyms!"
ukr_big_cleaning.2.b: "Perhaps let her depart?"

ukr.108.t: "Trial of ‘Redut’ Mercenaries"
ukr.108.desc: "After a brief fight on the front line, an entire detachment of Russian ‘Redut’ mercenaries was surrounded and captured. Phone footage proved their involvement in torture of civilians. They were brought to [UKR.capital.GetName] and given 11-year sentences for war crimes.\n\nThe prosecutor noted: ‘This is Ukraine’s first conviction of PMC/GU GRU personnel.’ The process publicly exposed the RF unit dubbed in media as the ‘General-Staff pseudo-PMC Redut’."
ukr.108.u: "Interesting"

ukr_missile.1.a: "Let the show begin"
ukr_missile.1.d: "A new Ersat-U missile will be obtained."
ukr_missile.1.t: "Tochka-U Modification"

ukr_petliura_content.1.t: "DIU Report"
ukr_petliura_content.1.d: "Analytical Report No. 483493\nClassification: Top Secret (Special Importance).\nSubject: Wagner Private Military Company.\nDate: [?global.date.GetDateStringNoHourLong]\nTopic: Escalation of the situation surrounding Wagner PMC.\nAccording to incoming OSINT data and information from our sources, a significant escalation has been observed in recent days between Wagner PMC and the Russian Ministry of Defense. Recently, Prigozhin has considerably intensified his public rhetoric against the Russian MoD, accusing it of incompetence, negligence, issuing deadly orders, and especially of deliberately undermining the effectiveness of Russian forces, particularly Wagner PMC.\nAs we already know, Wagner PMC is suffering from a severe ammunition shortage due to its highly bloody combat tactics that rapidly exhaust its own forces. The Russian MoD is deliberately withholding sufficient ammunition, the General Staff is in conflict with the PMC leadership, and, according to accounts from prisoners of war, distrust exists between soldiers on the battlefield.\nAccording to our current information, the situation is as follows:\n-Wagner PMC's frontline activity has significantly decreased;\n-Prigozhin and his closest associates are outside cellular network coverage;\n-sources in Wagner's private communication channels report that they are ready to “act”.\nBased on our analysis, we assume that Wagner PMC may launch a rebellion at any moment, but the consequences of such a decision could vary greatly in scale. The DIU considers three possible scenarios:\n1.Wagner PMC launches a rebellion in the rear areas of the front, seizes the city of Rostov, and begins advancing toward Moscow to capture the Russian Ministry of Defense building. (Most likely);\n2.A demonstrative seizure of the Russian MoD headquarters in Rostov and holding the city until the Russian MoD fulfills their demands. (Moderately likely);\n3.A full-scale rear-area mutiny that could escalate into open confrontation, potentially leading to the collapse of the Kremlin and the rise to power of Prigozhin's inner circle. (Least likely).\nAn open conflict between Wagner PMC and the Russian Armed Forces has the potential to bring major changes to the Russian Federation itself. Destabilization of the entire country could awaken Russia's minority peoples, increase public dissatisfaction, and weaken the central governing apparatus. The key factor is which side the elites will support. There is a slight, almost impossible chance that, if Wagner PMC succeeds, a scenario similar to that of 1918–1919 could unfold.\nThreat level to the Russian Federation: §RMaximum.§!\nRecommendations from the DIU:\n-establish contact with Western intelligence agencies;\n-intensify intelligence gathering on Wagner PMC;\n-consider opening a second front on the Russian border or conducting limited incursions by the Russian Volunteer Corps (RDK) and the Freedom of Russia Legion (LSR);\n-conduct information and psychological operations targeting Russian citizens;\n-launch an offensive to pin down the Russian Armed Forces."
ukr_petliura_content.1.a: "Acknowledged"
ukr_petliura_content.2.t: "REPORT OF THE GENERAL STAFF OF THE ARMED FORCES OF UKRAINE"
ukr_petliura_content.2.d: "Analytical Report No. 104/GS/OPER\nClassification: Top Secret (Special Importance).\nDate: [?global.date.GetDateStringNoHourLong]\nTopic: The necessity of transitioning the Armed Forces of Ukraine to a corps-based organizational structure.\nIn light of the prolonged and intensive phase of the confrontation with the regular forces of the Russian Armed Forces, as well as taking into account NATO experience and our own combat experience, the General Staff of the Armed Forces of Ukraine considers it appropriate to initiate a gradual transition from a brigade-centric to a corps-based organizational model. The arguments supporting this decision are:\n-The scale and duration of the war:\nThe brigade model, while effective in localized operations, demonstrates limitations when managing large troop formations across theaters of war spanning hundreds of thousands of square kilometers.\n-The need for flexible operational command:\nThe corps model enables the creation of permanent operational command structures with a deeper level of command, which is critically important for planning large-scale counteroffensive and defensive operations.\n-Alignment with NATO standards:\nMost NATO armies use a division-corps structure, which will facilitate the integration of the Armed Forces of Ukraine into multinational forces, standardize logistics, improve operational planning, and enhance command system interoperability.\n-Creation of a resilient defensive belt:\nThe corps system makes it possible to establish layered defensive systems assigned to clearly defined corps areas of responsibility, making enemy breakthroughs more difficult and simplifying unit rotations.\nOur implementation proposals:1. Pilot phase (within 3 months): establish the first experimental corps based on several of the most combat-capable brigades. For example, form a corps from the 3rd Assault Brigade, the 12th Azov Brigade, the 92nd Brigade, or the 72nd Brigade. Grant the corps headquarters full operational autonomy with a complete command cycle (operational planning, intelligence, logistics, and fire support). It is also advisable to re-equip it with the best domestically produced equipment or equipment supplied by NATO.\n2.Full-scale deployment (within 1 year): establish an additional 3–5 corps to implement this system across the entire front line. Preferably, one of them should be formed on the basis of our Marine Corps for better defense of the South and potential future amphibious operations, while one reserve corps should be created to serve as a rapid reaction force for the most critical sectors. We can propose the following brigades as the basis for these corps: the 36th Marine Brigade, the 10th Mountain Assault Brigade, the 17th Heavy Mechanized Brigade, the 93rd Brigade, the 24th Brigade, the 5th Assault Brigade, and the 28th Brigade. Implementing the second phase will require reforming training centers to prepare corps-level command personnel.\n3.Standardization of corps (during the following year): complete transition to the corps system while retaining brigades where appropriate. All new military formations should be organized exclusively within the corps structure."
ukr_petliura_content.2.a: "Open the second page..."
ukr_petliura_content.3.t: "REPORT OF THE GENERAL STAFF OF THE ARMED FORCES OF UKRAINE"
ukr_petliura_content.3.d: "The General Staff expects the following results:\n-Improved command and control of large military formations.\n-Enhanced logistics and faster decision-making.\n-Reduced workload on the Operational Commands and the General Staff.\n-Increased morale and organizational credibility of the Armed Forces of Ukraine in the eyes of international partners and Ukrainian citizens.\nThe transition to a corps-based structure is a logical and necessary step toward bringing the Armed Forces of Ukraine to the level of a modern allied-style military capable of effectively confronting the regular forces of the aggressor state over a prolonged period.\nSigned:\nCommander-in-Chief of the Armed Forces of Ukraine\nGeneral Staff of the Armed Forces of Ukraine, Strategic Analysis Sector."
ukr_petliura_content.3.a: "Acknowledged"
ukr_petliura_content.4.t: "DIU Report"
ukr_petliura_content.4.d: "Analytical Report No. 597329\nClassification: Top Secret (Special Importance).\nSubject: Armed Forces of the Russian Federation.\nDate: [?global.date.GetDateStringNoHourLong]\nTopic: A new wave of mobilization in the Russian Federation, its possible scenarios, consequences for Ukraine, and proposed response measures.\nAs a result of systematic monitoring of open sources, human intelligence, and technical reconnaissance, the DIU has identified a steady decline in the combat effectiveness of regular Russian Armed Forces units. The main indicators include:\n-heavy losses among regular army units,\n-a slowdown in offensive operations despite artillery superiority,\n-confirmed rotations involving conscripts in combat zones (previously consisting exclusively of contract soldiers, mercenaries, or mobilized personnel),\n-mass appeals to Russian military commissariats requesting discharge or deferments.\nBased on this, the DIU considers it likely that Russia is preparing for a new wave of mobilization by the end of 2022 or the beginning of 2023. This depends on bureaucratic processes and on how necessary the Russian General Staff considers such a measure. It is also possible that some generals are underreporting personnel losses to avoid repercussions.\nPossible mobilization scenarios in the Russian Federation:\n1. Full mobilization (a large-scale model but unlikely): conscription of up to 1,000,000 personnel into the armed forces. It cannot be ruled out that such mobilization could become coercive or forced. On this scale, Russia would be able to fully replace the losses of its currently deployed brigades and form up to 150 new brigades. Such mobilization would be carried out in stages: the first one or two hundred thousand would be sent to the front immediately, while the rest would undergo training for one to three months depending on the brigade's classification. However, such a decision could lead to numerous domestic problems and an escalation of internal tensions within Russia.\n2. Declaration of partial mobilization (acceptable for the Russian General Staff and the most likely scenario): conscription of approximately 300,000–400,000 personnel. This scenario would most likely involve first- and second-line reservists, conscripts, and military-age citizens from regions with high unemployment.\n3. Forced mobilization in the temporarily occupied territories and the LPR/DPR (moderately likely): such a campaign could recruit approximately 200,000–500,000 personnel depending on its intensity. This option is politically advantageous for Russian society because it would have minimal impact on the Russian population itself, but it suffers from issues related to the effectiveness, motivation, and health of those conscripted."
ukr_petliura_content.4.a: "Open the second page...."
ukr_petliura_content.5.t: "DIU Report"
ukr_petliura_content.5.d: "Additional options that could be combined to improve effectiveness (these may be implemented after the primary mobilization):\n1. “Silent” mobilization or a hybrid model (this option is more of an addition to the three scenarios above): strengthening compulsory recruitment through military commissariats without issuing an official decree.\n2. Expanding the practice of “voluntary-compulsory” contracts by offering enormous financial incentives according to Russian estimates. Ideologically motivated fighters may be running out, but there is certainly no shortage of people seeking quick money. Like the previous option, this would serve as an additional mobilization measure.\n3. Intensifying the mobilization of prisoners and homeless citizens. This is a logical option, as the use of units such as “Storm Z,” which are composed almost entirely of convicted criminals, has already been confirmed. However, such units receive almost no proper training or equipment, resulting in extremely high casualty rates.\nPotential impact on Ukraine's defense capabilities:\n-In the medium term (3–5 months): Russia may partially compensate for its current personnel losses through numbers, increasing pressure along the front, particularly in the eastern operational areas.\n-In the long term: the overall quality of mobilized personnel is likely to improve, increasing the threat of sustained mass offensives.\n-Risk of overburdening the Armed Forces of Ukraine, particularly given limited rotation opportunities and the depletion of reserves.\nProposed actions for Ukraine:\n-Conduct targeted mobilization within Ukraine. Form new defense and reserve brigades (with the ability to deploy adaptively to critical sectors).\n-Strengthen training centers and reduce the duration of basic training to 6–8 weeks.\n-Prioritize the mobilization of specialists: artillery personnel, UAV operators, air defense personnel, and IT specialists.\n-Introduce mandatory rotation and rest mechanisms for active military personnel.\n-Launch a public communication campaign explaining the purpose and necessity of mobilization, emphasizing that Russia is preparing a new mobilization wave as a threat and challenge to the entire country.\nConsequences if no mobilization response is undertaken:\n-Depletion of combat units within the Armed Forces of Ukraine.\n-Declining morale due to the lack of troop rotations.\n-Reduced defensive capability under simultaneous Russian pressure.\n-Increased risk of defensive breakthroughs leading to operational freedom of maneuver for the enemy and territorial losses.\nGeneral recommendations from the DIU:\n-Immediately assess the country's mobilization potential and prepare for another wave of mobilization.\n-Provide financial and social incentives for individuals liable for military service.\n-Create a digital mobilization platform with personal accounts for reservists (for example, by creating a military service account within Diia).\n-Monitor internal discontent within Russia for use in information and psychological operations (PSYOP)."
ukr_petliura_content.5.a: "Acknowledged"
ukr_petliura_content.6.t: "DIU Report"
ukr_petliura_content.6.d: "Classification: Top Secret (Special Importance).\nSubject: Russian Missile Attack Early Warning System (MAEWS) station in Armavir.\nDate: [?global.date.GetDateStringNoHourLong]\nTopic: Potential scenarios for neutralizing the facility and their strategic consequences.\nThe radar complex in Armavir (Krasnodar Krai, Russian Federation) is a critically important element of the Russian Federation's Missile Attack Early Warning System (MAEWS). The facility consists of two Voronezh-DM radar stations, providing early detection of ballistic missile launches from Southern Europe, the Middle East, and the Mediterranean Sea.\nGiven the tensions between the Russian Federation and NATO countries, in the event of a large-scale military conflict, the destruction or disabling of the Armavir MAEWS facility could be considered one of the key elements of an operation to blind the enemy's strategic early warning channels.\nTechnical description of the facility:\n-Coordinates: 45.0034° N, 41.1198° E\n-Radar type: Voronezh-DM (UHF band)\n-Operational range: up to 6,000 km\n-Purpose: detection of ICBM and cruise missile launches, monitoring of the aerospace domain\nVulnerabilities:\n-open above-ground infrastructure;\n-dependence on power infrastructure;\n-limited air defense assets in the immediate vicinity.\nThe DIU is considering the following possible scenarios:\nOption A. A precision strike using high-precision weapons, for example, a precision-guided ballistic missile equipped with GPS.\nAssets: Storm Shadow, ATACMS, SCALP missiles.\nObjective: destruction of antennas, command posts, and power infrastructure.\nResult: disabling key radar components for a period ranging from several weeks to several months.\nChallenge: these missiles would need to be obtained from NATO countries.\nOption B. A sabotage operation on Russian territory (extremely high risk).\nAssets: use of agent networks, individuals willing to carry out such an operation, or mercenaries.\nObjective: targeted explosions or arson attacks against power facilities and antenna structures.\nLimitations: heavy security presence and geographic challenges.\nOption C. A long-range loitering munition UAV attack against the facility.\nAssets: domestically produced loitering munition UAVs. Examples: Liutyi, UJ-22, Beaver, Rubaka.\nObjective: destruction of antennas, command posts, and power infrastructure.\nResult: disabling key radar components for a period ranging from several weeks to several months."
ukr_petliura_content.6.a: "Open the second page...."
ukr_petliura_content.7.t: "DIU Report"
ukr_petliura_content.7.d: "Challenge: possible interception by Russian air defense systems.\nStrategic consequences:\n1. Loss of the ability to promptly detect missile launches from the southern direction. This would significantly reduce the effectiveness of Russia's Missile Attack Early Warning System, increasing the duration of the «blind window» to 5–8 minutes—a critical reaction window for Russia's strategic forces.\n2. Disruption of nuclear deterrence and counterforce/countervalue strike coordination. Without Armavir, Russia loses coordination between the southern direction and other radar stations (for example, Kaliningrad and Olenegorsk), complicating information exchange with the National Defense Management Center.\n3. Political and psychological impact. A successful strike against the MAEWS facility would damage the reputation of the Russian Armed Forces as «invulnerable». It would demonstrate the vulnerability of critical strategic infrastructure even deep inside Russian territory.\nPossible risks and consequences:\n-Russian response: possible use of strategic threats and an increased readiness level of nuclear deterrence forces.\n-International repercussions: coordination with allies would be required to prevent escalation into a nuclear exchange.\n-Countermeasures: Russia may attempt to compensate for the loss by deploying mobile MAEWS assets, satellites, and redeploying air defense systems.\nConclusion:\nA strike against the Armavir MAEWS facility could play a decisive role in the event of a NATO-Russia conflict by disrupting the enemy's strategic stability and weakening its nuclear deterrence. However, such an operation would have to be carefully planned and approved at the highest level in coordination with international partners."
ukr_petliura_content.7.a: "Acknowledged"
ukr_petliura_content.8.t: "DIU Report"
ukr_petliura_content.8.d: "Analytical Report No. 321454\nClassification: Top Secret (Special Importance).\nSubject: Oil refineries on the territory of the Russian Federation.\nDate: [?global.date.GetDateStringNoHourLong]\nTopic: The potential use of Ukrainian loitering munition UAVs against Russia's oil refining infrastructure.\nAgainst the backdrop of our defense against the Russian Armed Forces, one of the most effective strategies of asymmetric deterrence is conducting strikes against key Russian infrastructure. In particular, oil refineries play a critical role in logistics, the economy, and military support. Thanks to the development of domestically produced medium- and long-range loitering munition UAVs, we now have a real opportunity to apply precise and sustained pressure on Russia's energy infrastructure deep in the rear.\nObjectives of these operations:\n-Undermine the economic potential of the Russian Federation (fuel exports and domestic consumption). Undermine Russia's “petro-dollar.”\n-Disrupt the logistics of fuel supplies for the enemy's armed forces.\n-Create internal pressure within Russia's rear through socio-economic effects.\n-Divert air defense and military logistics resources deep into the rear.\n-Create shortages of aviation fuel and diesel fuel.\n-Reduce the mobility of Russian forces and the pace of offensive operations.\nStrike assets:\n1. UJ-22 — range up to 800 km, payload of up to 20 kg of explosives.\n2. \"Beaver\" — range up to 800 km, low-observable profile, infrared protection, payload of up to 20 kg of explosives.\n3. Liutyi — range exceeding 1,000 km, low-observable profile, payload of up to 50 kg of explosives.\n4. Rubaka — range exceeding 500 km, payload of up to 50 kg of explosives.\nOperational use:\n-Launching in swarms (group attacks).\n-Use of decoys and electronic jamming.\n-Combined use with cyberattacks (disabling air defense and surveillance systems)."
ukr_petliura_content.8.a: "Open the second page"
ukr_petliura_content.9.t: "DIU Report"
ukr_petliura_content.9.d: "Potential targets for loitering munition UAVs:\nHigh-priority targets:\n-Tuapse Oil Refinery (Krasnodar Krai) — the largest refinery in southern Russia.\n-Ryazan Oil Refinery — the largest refinery in Central Russia.\n-Oil refineries in Yaroslavl, Ufa, Novoshakhtinsk, and Nizhny Novgorod — major fuel processing facilities and suppliers for the Russian Armed Forces.\nConsequences for the Russian Federation:\nEconomic:\n-Losses amounting to hundreds of millions of dollars for each major incident.\n-Disruption of petroleum product exports.\n-Pressure on the ruble and increased inflation.\nMilitary:\n-Reduced fuel and lubricant deliveries to the front line.\n-Disruption of logistics for army corps (especially in the southern regions).\n-Delays or failures in unit rotation and resupply.\nPsychological and political:\n-Demonstration of the vulnerability of Russia's rear areas.\n-Growing panic among the civilian population.\n-Increased pressure on the military-industrial and energy leadership.\nPossible risks and precautionary measures:\n-retaliatory large-scale missile strikes and cyberattacks;\n-Western reaction: possible diplomatic concern, but provided strikes are carried out exclusively against military or military-industrial infrastructure, the risks remain limited;\n-risk of technology leakage: requires stricter control over the UAV production technology chain."
ukr_petliura_content.9.a: "Open the second page"
ukr_petliura_content.10.t: "GENERAL STAFF OF THE ARMED FORCES OF UKRAINE"
ukr_petliura_content.10.d: "ORDER No. 041/OPS on conducting airborne operations in the enemy's rear.\nFor the purpose of destabilizing the enemy's defenses, seizing the operational initiative, and creating favorable conditions for the further advance of the Joint Forces, I HEREBY ORDER:\nMain Directorate of Special Operations of the Armed Forces of Ukraine:\n-Organize and conduct a series of airborne operations in designated areas deep behind enemy lines, with priority given to transportation hubs, logistics bases, and communications centers.\n-Ensure full coordination with the Ukrainian Air Force for operational support and personnel evacuation.\nSpecial Operations Forces Command:\n-Ensure combat readiness of units to carry out missions behind enemy lines under full autonomy for a period of 72 hours.\n-Pay special attention to concealment, radio silence, and cooperation with local resistance forces (where present).\nMain Intelligence Directorate of the Ministry of Defense of Ukraine:\n-Provide up-to-date intelligence regarding targets behind enemy lines, possible approach and withdrawal routes, enemy air defense systems, and enemy troop movements.\nExecution timeline:\n-The active phase of operations will begin upon a separate signal from the Joint Forces Operation Headquarters. Preparatory actions are to begin immediately.\n-I retain personal control over the execution of this order."
ukr_petliura_content.10.a: "Acknowledged"
ukr_petliura_content.11.t: "Happy New Year, Ukraine!"
ukr_petliura_content.11.d: "“Dear Ukrainians! In just a few minutes, the New Year will begin. Traditionally, on this evening everyone gathers around the table with their family, invites guests, watches the President's New Year's address, and presidents usually complain a little at first, then justify themselves a bit more, but overall boast about what has been accomplished.\nBut this year is special. The year marking the 30th anniversary of our independence. And that is why this year will be different. Well, I will boast as well, but a little later. No one has canceled the festive dinner—we simply cannot do without it in Ukraine—but most importantly, I will not speak about what has been done, but about those who made it happen. And not only this year. I will speak about those who have been building and creating Ukraine throughout all the years of independence. Our people. Ordinary citizens. Although no. Our extraordinary people and citizens of Ukraine!...\n...30 years. More than one hundred leaders and representatives of countries from all over the world gathered on our Independence Square. And they were no longer just Ukraine's partners. Everyone who came to share our joy became a friend of Ukraine. And everyone who saw our military parade and the Mriya flying over Khreshchatyk became a fan of Ukraine.\nBut the most important thing is who we have become. Even more in love with Ukraine. And more confident in ourselves. More mature. At last, we were united not by disaster, but by celebration. We are learning to unite. Learning to unite not against someone, but for ourselves. Learning to respect one another and ourselves. That is why we are not waiting for the world to solve our problems or for someone else to return our land for us.\nInstead, we are bringing the world together to liberate Crimea. That is why this year the words 'Crimea is Ukraine!' rang out so loudly. Spoken not only by Ukraine, but by all 46 participants of the Crimea Platform. Today we can say: we have returned Crimea to the global agenda, so that one day we may say: we have returned Crimea to Ukraine. And how important it is to bring home all prisoners. Every one of them...\n...The most important thing is that all of you, all of us, remain alive and healthy. That we continue gathering around one table with our families like this. That everyone you love is by your side, along with everything without which life simply is not worth living...\n...May our neighbors come to visit us—with aspic and a bottle, not with weapons and without knocking. And may our friends—and may they be true friends, ready to fight for you—not be only on Twitter, but by your side. And may our relatives come. And may they come more often. From Donbas, from Crimea. Not as guests, but returning to their own homes, because we are all one family. Both Donbas and Crimea. 'And as soon as we remove the line of division from our minds, it will disappear from the map as well.'\nAnd everything will be as it should be in Ukraine. Just like in the song:\nOne viburnum outside the window,\nOne family around the table,\nAnd Ukraine, because we have no other.\nThis is what I wish for all of you, dear Ukrainians. And we will do everything to make it happen.”"
ukr_petliura_content.11.a: "Happy New Year, dear Ukrainians!"
ukr_petliura_content.12.t: "The Russian-Ukrainian Conflict"
ukr_petliura_content.12.d: "Another historic turning point for Ukraine came in February 2014. At a moment of profound internal crisis, when citizens on the Maidan were defending their right to a European future and freedom was confronting dictatorship, Russia—which at that time most Ukrainians still viewed rather favorably—repaid them in blood. Seeking to pull Ukraine back into its imagined 'sphere of influence,' prevent a Maidan from emerging in Moscow itself, and driven by its own imperial ideology, the Kremlin resorted to direct aggression. First came the annexation of Crimea, carried out with the support of the Black Sea Fleet based in Sevastopol and the participation of the so-called 'little green men'—Russian soldiers without insignia, whose affiliation Vladimir Putin acknowledged only after the fact. Almost simultaneously, Russian intelligence services exploited anti-Maidan sentiment in eastern Ukraine. Initially these were demonstrations in support of Viktor Yanukovych, but they were quickly redirected toward separatism. The FSB employed an entire arsenal of propaganda techniques: nostalgic memories of a 'great past' and Eastern Ukraine's role as one of the Soviet Union's major industrial centers, the myth of the 'Triune Rus''—Ukraine, Belarus, and Russia—and fearmongering about a 'hostile West' that would supposedly turn Ukrainians into slaves.\nIn a number of regions, separatism failed to gain widespread support. In Kherson and Zaporizhzhia Oblasts, the situation remained under Kyiv's control, while in Dnipropetrovsk Oblast a decisive role was played by the firm stance of the local authorities and business elites, particularly Ihor Kolomoiskyi. In Odesa and Kharkiv Oblasts, the scenario of 'people's republics' was also prevented: in Odesa, the tragic events of May 2 became the turning point, while in Kharkiv it was the 'Metalist March' and the response of the security forces. In both cases, the intervention of Ukrainian forces restored control without large-scale combat. Donbas, however, proved to be different. Several factors converged there: a high proportion of Russian-speaking and ethnically Russian residents, close cultural and economic ties with Russia, the influence of Donetsk political clans loyal to Moscow, and deeply pro-Russian local authorities heavily infiltrated by FSB agents.\nFollowing the annexation of Crimea, events in eastern Ukraine developed rapidly. By late March 2014, pro-Russian forces intensified the seizure of government buildings and clashes with pro-Ukrainian activists. In early April, Ukraine managed to restore control over Kharkiv without bloodshed. The decisive day came on April 12, 2014, when an armed detachment led by Igor Strelkov (Girkin) seized Sloviansk, Kramatorsk, and several other settlements. The first blood was spilled. That same evening, Acting President Oleksandr Turchynov announced the beginning of the Anti-Terrorist Operation (ATO). Initially, the Ukrainian Army and volunteer battalions achieved success, regaining control of cities including Sloviansk, Mariupol, and Kramatorsk. However, in August 2014, when the DPR and LPR militants were on the verge of defeat, Russia deployed regular troops into Donbas disguised as 'militiamen.' This shattered our plans for a swift victory. The war became protracted, and the front line stabilized. The last major battle was the Battle of Debaltseve, which ended with our withdrawal."
ukr_petliura_content.12.a: "Open the second page..."
ukr_petliura_content.13.t: "The Russian-Ukrainian Conflict"
ukr_petliura_content.13.d: "The active phase of hostilities in 2014–2015 was halted under the Minsk Agreements. The documents provided for the withdrawal of forces, prisoner exchanges, reforms in Ukraine, and the fulfillment of obligations by both sides of the conflict in order to return Donbas with autonomous status. To this day, Ukraine has fulfilled nearly all of its commitments, while the LPR and DPR have shown little interest in ending the conflict and instead continue to violate the ceasefire on a regular basis. Trust between the sides is virtually nonexistent. Minsk has become a disgrace—a mere piece of paper that only postpones a war which will inevitably resume sooner or later, though no one knows in what form.\nToday, the war has taken on the character of a 'low-intensity conflict.' Every day, localized shelling occurs along the line of contact. At the same time, however, the past three years have been the quietest: civilian casualties have been extremely low, and shelling has been neither as frequent nor as intense as before. This creates the illusion among many citizens that the war is over or that it will never resume. Our diplomatic initiatives, such as the 'Crimea Platform,' demonstrate that we have not accepted the loss of our territories and will never abandon what is rightfully ours. The day will come when those responsible for this war are held accountable and our country regains what it has lost."
ukr_petliura_content.13.a: "It is not in the Kremlin's interest to end the war in Donbas!"
ukr_petliura_content.14.t: "Eight Years Since the Turning Point"
ukr_petliura_content.14.d: "The eighth year after the great upheavals—the Euromaidan, the annexation of Crimea, and the war in Donbas that began in 2014—remains 'frozen,' yet far from safe: the front lines have stabilized, daily shelling continues, and no political solution to end the conflict has been achieved. Much has changed since then, and Ukraine has not stood still either.\nThe years 2014–2015 were also marked by other upheavals, particularly in the economy: the depletion of the gold reserves under Yanukovych, the loss of Crimea and part of Donbas, the severing of traditional economic ties with Russia, the decline in industrial production, and currency shocks—all of this led to a significant contraction of GDP and a long, costly recovery and reform program. Those years also opened the public's eyes to the true state of our armed forces: a massive shortage of equipment, supplies, and even uniforms. Even the equipment that did exist was often of questionable serviceability.\nFollowing the election of the new president, Petro Poroshenko, the first attempts to improve the situation began. The end of the hottest phase of the war made it possible to begin reforming the country's entire system. The Cabinet of Ministers and the 'Gray Hetman' became known for and carried out the following measures: launching a comprehensive reform of the Armed Forces of Ukraine; reforms in education and healthcare; dismantling monopolies, particularly Ihor Kolomoiskyi's influence in the PrivatBank case; revising legislation on land sales; launching construction projects at every level, from the 'Wall' project to nationwide infrastructure initiatives; revitalizing the defense industry through the modernization of domestic military equipment; signing agreements with the European Union, especially the visa-free travel regime, and enshrining Ukraine's aspiration to join NATO and the EU in the Constitution.\nThe years 2016–2019 were filled with reforms and gave hope that this nightmare was truly behind us and that all we had left to do was pursue our dream. While Petro Poroshenko continued implementing his policies, previously adopted urban development initiatives began to bear fruit: cities became greener, downtown areas revived, and this was true not only for regional capitals but also for smaller district centers. Kharkiv flourished in particular; what journalists called the 'Showcase of Ukrainian Donbas' emerged, as the government-controlled territories of Donetsk and Luhansk Oblasts were modernized with new residential developments, attractive parks, and modern business centers.\nPolitically and civilizationally, Ukraine fundamentally changed its course: the state embarked on the path of European integration, the population as a whole strengthened its pro-European outlook and desire to be part of Europe, and foreign policy became clearly oriented toward the European Union and NATO. With Donald Trump's election as President of the United States, the American arms market became accessible to us, albeit not completely. At the same time, joint military exercises between the Armed Forces of Ukraine and allied armies gradually became a common practice."
ukr_petliura_content.14.a: "Open the second page..."
ukr_petliura_content.15.t: "Eight Years Since the Turning Point"
ukr_petliura_content.15.d: "In 2019, Ukraine held spectacular and highly contentious presidential elections. Petro Poroshenko faced the young, energetic, and still politically inexperienced Volodymyr Zelenskyy, who until recently had been a businessman in the television industry. At that moment, it became clear why the television series 'Servant of the People' had been produced. The election ended with the former suffering a crushing defeat at the stadium debate.\nVolodymyr Zelenskyy came to office as a president of peace. His main promises were to end the war in Donbas, return Crimea, reach an agreement with Vladimir Putin, fight corruption—especially by prosecuting Petro Poroshenko—and continue integration with the European Union and NATO. Indeed, new attempts were made to restart negotiations with Russia, including the initiative to convene a Normandy Format summit. Investigations were launched against several high-profile corruption figures, and Ukraine continued along its established foreign policy course.\nDuring 2019–2021, domestic policy continued many of the reforms initiated by the previous head of state, while also launching ambitious projects to create a 'state in a smartphone,' which would later become the Diia application, as well as the 'Great Construction' infrastructure program aimed at building modern infrastructure and providing high-quality mobile coverage across the country. Over time, the Office of the President became increasingly influential, drawing criticism from opponents who accused it of authoritarian tendencies and bypassing the country's highest decision-making institutions.\n\nMilitary reform and the transformation of the defense forces became one of the most significant outcomes of eight years of war. Ukraine fundamentally overhauled the personnel, operational, and logistical structure of its armed forces, strengthened training and cooperation with Western partners, received extensive practical assistance and training from NATO and individual partner countries, while simultaneously modernizing its arsenal and procuring modern weapon systems, including unmanned aerial systems from foreign manufacturers. These changes made the Armed Forces of Ukraine significantly more capable than they had been in 2014. To mark the 30th anniversary of Independence, the country held its largest military parade ever, intending to demonstrate Ukraine's military strength not only to its citizens but also as a signal to other nations.\nSociety changed no less profoundly. National consensus regarding sovereignty grew stronger, volunteer and civic initiatives supporting the armed forces and war victims became more active, and the role of non-governmental organizations and public oversight mechanisms increased. At the same time, the war left deep psychological, demographic, and economic scars that will require decades to fully overcome.\nBy the end of 2021, Ukraine had become a nation hardened by war, with renewed armed forces, a clearer foreign policy orientation, and a society prepared to defend its independence. However, the conflict remained unresolved: the line of contact was maintained only through extraordinary efforts, ceasefire agreements were regularly violated, and no peaceful political settlement had been achieved. The country continues preparing for future challenges while relying on international support and its own efforts toward reform and recovery."
ukr_petliura_content.15.a: "We are ready to defend ourselves and the future of our country and our children!"
ukr_petliura_content.16.t: "Escalation"
ukr_petliura_content.16.d: "With the election of Volodymyr Zelenskyy in 2019, many Ukrainians pinned their hopes on revitalizing the peace process and bringing an end to the eight-year war in Donbas. The new president declared his willingness to engage in dialogue, met with the leaders of the Normandy Format, and proposed concrete steps toward implementing the Minsk Agreements, including prisoner exchanges, troop disengagement in selected sectors, and new socio-economic initiatives for residents of the occupied territories.\nHowever, Russia continued to systematically undermine the peace process by failing to fulfill its key obligations—above all, implementing a ceasefire and withdrawing its armed formations. Provocative shelling, sniper fire, and the deaths of Ukrainian soldiers and civilians continued, while the front line remained an area of constant danger.\nThe situation deteriorated further toward the end of 2021. Russia began an unprecedented military buildup along Ukraine's borders—both in the occupied territories and along the eastern and northern frontiers. Satellite imagery, intelligence provided by Western partners, and Ukrainian intelligence services documented the appearance of new military camps, heavy equipment, air defense systems, and offensive weapons. At the same time, information attacks intensified, with Moscow accusing Ukraine of 'provocations' in an attempt to shift responsibility for its own aggression.\nOn the diplomatic front, the Kremlin issued an ultimatum to NATO, demanding that it abandon any further enlargement and effectively recognize Russia's spheres of influence. These demands were fundamentally unacceptable to both Ukraine and NATO, as they violated the basic principles of sovereignty and every nation's right to determine its own path of development.\nWe have no choice but to prepare for a possible new phase of aggression. We continue strengthening our defenses, conducting joint exercises with our partners, deepening cooperation with NATO, and preparing both our armed forces and society. Ukrainian citizens continue to demonstrate unity: volunteer organizations, businesses, and ordinary people are all supporting the military.\nThe current escalation is a direct consequence of Russia's strategy of coercion, whose objective is to break our independence and impose a foreign policy dictated by Moscow. But eight years of war have made us stronger. We have made our position unmistakably clear: we will defend our sovereignty by every available means and with the support of the international community, and any attempt at blackmail or coercion into surrender is destined to fail."
ukr_petliura_content.16.a: "We did not start this, but it is up to us to finish it"
ukr_advisors_events.1.t: "The Brovary Tragedy"
ukr_advisors_events.1.d: "This morning, an aviation accident occurred in Brovary, Kyiv Oblast, resulting in the death of Ukraine's Minister of Internal Affairs, Denys Monastyrskyi. The helicopter carrying the Ministry's leadership crashed near a kindergarten. A fire broke out at the crash site.\nAccording to preliminary reports, at least 14 people were killed in the tragedy, including children and kindergarten staff. Dozens of others were injured. The Ministry of Internal Affairs will temporarily be headed by the First Deputy Minister. Rescue workers and investigators continue to work at the crash site."
ukr_advisors_events.1.a: "Rest in peace, Denys..."

ukr_advisors_events.2.t: "A New Minister of Internal Affairs"
ukr_advisors_events.2.d: "The death of Minister of Internal Affairs Denys Monastyrskyi has been a severe blow to the government and the entire country. The President now faces a difficult choice: who should be entrusted with leading the Ministry of Internal Affairs during such a challenging time?\nOn one hand stands Ihor Klymenko, the experienced Chief of the National Police, who promises to preserve order and discipline. On the other is General Serhii Deineko, Head of the State Border Guard Service, known for his decisive actions along the front line and at the border."
ukr_advisors_events.2.a: "Ihor Klymenko can take his place"
ukr_advisors_events.2.b: "In wartime, Serhii Deineko is the obvious choice"

ukr_advisors_events.3.t: "The Good-Natured Mayor"
ukr_advisors_events.3.d: "The war has turned Kharkiv into one of the country's hottest hotspots. From the very first days of the full-scale invasion, Ihor Terekhov remained in the city, coordinating municipal services, civilian evacuations, and repairs to damaged infrastructure. His calm confidence and constant presence on the ground have made him a trusted figure among Kharkiv's residents. Under his leadership, Kharkiv has gradually been restoring its infrastructure despite daily shelling. More and more residents see Terekhov as the continuation of former mayor Kernes' legacy, but in a wartime context—less political, yet more focused on effective administration."
ukr_advisors_events.3.a: "Ihor Terekhov, a respected figure for every Ukrainian!"

ukr_advisors_events.4.t: "Change of Foreign Minister"
ukr_advisors_events.4.d: "After a prolonged period of intensive diplomatic activity, Dmytro Kuleba announced his resignation as Minister of Foreign Affairs. Officially, the reason given was 'extreme fatigue and the need to reorganize the foreign policy team.' Unofficially, however, analysts point to growing disagreements between him and the Office of the President regarding the pace of European integration and approaches to cooperation with the West.\n\nThe Cabinet of Ministers has already approved the nomination of a new representative to head the Ministry of Foreign Affairs—experienced diplomat and former Deputy Head of the Office of the President, Andrii Sybiha, who is regarded as one of the officials most loyal to the presidential administration."
ukr_advisors_events.4.a: "Let's welcome the new Foreign Minister!"

ukr_advisors_events.5.t: "Appointment of a New Prime Minister"
ukr_advisors_events.5.desc: "Following consultations with Parliament and the country's leadership, the President announced a Cabinet reshuffle: the current Prime Minister is stepping down. Officially, it is described as 'part of a planned government renewal aimed at strengthening coordination between the military and economic sectors.'\n\nA new Head of Government has been confirmed for the position—a candidate supported by key political groups and regarded as an expert in crisis management. His appointment is expected to accelerate decision-making and stabilize the state bureaucracy."
ukr_advisors_events.5.a: "Svyrydenko will not let us down"
ukr_advisors_events.5.b: "Fedorov is capable of great change"
ukr_advisors_events.5.c: "Budanov has his own vision"
ukr_advisors_events.5.d: "Zaluzhnyi can unite everyone"

ukr_advisors_events.6.t: "Calm as the Black Sea"
ukr_advisors_events.6.desc: "After a month of war and constant daily pressure, Vitalii Kim, Head of the Mykolaiv Regional Military Administration, has become a symbol of resilience and optimism for many Ukrainians. His calm speaking style, short video messages free of unnecessary pathos, and genuine sense of humor have turned Kim into a true national favorite.\n\nDespite the constant shelling of Mykolaiv, he has managed to maintain control over the region, organize its defense, and sustain the morale of the civilian population. Opinion polls show a rapid increase in public trust toward him—not only among local residents, but throughout the entire country."
ukr_advisors_events.6.a: "Kim is the new symbol of our resilience"

ukr_advisors_events.7.t: "Rinat Akhmetov Foundation"
ukr_advisors_events.7.desc: "From the very first days of the full-scale war, the Rinat Akhmetov Foundation has worked tirelessly to assist civilians, the military, and communities across Ukraine. Every day, its volunteers and partners deliver tons of food, medicine, generators, and equipment for restoring infrastructure. Despite losing a significant portion of his business in the occupied territories, Akhmetov publicly declared that 'everyone must now do what they can for Ukraine.' Rinat Akhmetov is an oligarch who did not abandon his homeland and continues to help us through these difficult times."
ukr_advisors_events.7.a: "The last representative of the Donetsk clan stands with us to the very end."

ukr_advisors_events.8.t: "Vasyl Maliuk Appointed as the New Head of the SBU"
ukr_advisors_events.8.desc: "The unstable situation at the front, along with the growing risk of sabotage and information leaks, forced the President to make personnel changes within the Security Service of Ukraine. Following a series of internal inspections and unsuccessful operations, Ivan Bakanov was dismissed due to insufficient effectiveness and weak managerial discipline.\n\nVasyl Maliuk has been appointed as his successor—an experienced counterintelligence officer who has already proven himself in combating agent networks in southern and eastern Ukraine. The new leadership promises to 'cleanse the system' and return to methodical, uncompromising work."
ukr_advisors_events.8.a: "The SBU is in safe hands!"
ukr_advisors_events.9.t: "Maliuk Steps Down"
ukr_advisors_events.9.desc: "After several years of active service and reforming the Security Service of Ukraine, Vasyl Maliuk has submitted his resignation. During his tenure, the SBU underwent a series of internal purges, fought collaboration, and modernized its security systems.\n\nThe President has signed a decree appointing the new Head of the SBU—Yevhen Khmara, a representative of a new generation of intelligence officers known for his technocratic background and focus on cybersecurity and data analytics. His appointment has been met with optimism among younger officers, although service veterans view the decision with caution. The government expects Khmara to combine the experience of his predecessors with modern approaches to combating hybrid threats."
ukr_advisors_events.9.a: "Let's bid farewell to Maliuk and welcome Khmara"

ukr_advisors_events.10.t: "Zaluzhnyi Appointed Ambassador to Britain"
ukr_advisors_events.10.desc: "Following the President's recent decree dismissing General Valerii Zaluzhnyi as Commander-in-Chief of the Armed Forces of Ukraine, it has been announced that he will receive a new appointment—as the Extraordinary and Plenipotentiary Ambassador of Ukraine to the United Kingdom.\n\nHis military leadership became a symbol of Ukrainian resistance, and news of his dismissal sparked mixed reactions across society—from respect and gratitude to concerns about the stability of the military command."
ukr_advisors_events.10.a: "We wish him success in Britain!"

ukr_advisors_events.11.t: "Fedorov Considered a Potential Minister"
ukr_advisors_events.11.desc: "Young reformer and Deputy Prime Minister for Digital Transformation Mykhailo Fedorov has recently attracted increasing attention from Ukraine's political and business circles. His Diia project and the large-scale digitalization of public services have become symbols of the technocratic approach that many believe should serve as a model for the future government.\n\nAgainst the backdrop of possible personnel changes within the Cabinet of Ministers, Fedorov is increasingly being mentioned as a candidate for a key ministerial position—either in the economic sector or in the field of defense technologies. His supporters see him as a representative of a new generation of public administrators capable of rebooting the state system. Skeptics, however, fear an excessive concentration of power in the hands of the 'digital elite.'"
ukr_advisors_events.11.a: "He has proven his expertise"

ukr_advisors_events.12.t: "Change of Defense Minister"
ukr_advisors_events.12.desc: "After more than a year and a half of full-scale war, Defense Minister Oleksii Reznikov submits his resignation. The President states that the Ministry of Defense needs 'new approaches and different formats of interaction with the military and society' and officially announces the decision to appoint a new head of the defense ministry. Meanwhile, the media is already consumed by the scandal surrounding the procurement of the so-called 'Golden Eggs.' The Ministry of Defense had purchased food supplies for the army at prices several times higher than market value.\n\nRustem Umerov, Head of the State Property Fund, is nominated as his successor. Since the first days of the invasion, he has been involved in confidential negotiations with international partners, participated in prisoner exchange talks, and worked on international agreements. The Verkhovna Rada approves Reznikov's resignation and confirms Umerov as the new Minister of Defense, making it one of the most significant personnel changes of the wartime period."
ukr_advisors_events.12.a: "Umerov will set things right"

ukr_advisors_events.13.t: "Umerov Resigns"
ukr_advisors_events.13.desc: "Following a series of scandals surrounding defense procurement and declining public confidence in the current Minister of Defense, the authorities decide to reshuffle the leadership of the defense ministry. Officially, the changes are presented as a 'planned strengthening of security sector management,' but in political circles they are widely seen as an attempt to ease tensions among both the public and the military.\n\nThree potential successors are under consideration. A technocratic reformer with experience in the digital transformation of the state, who could bring the same approach to defense technologies. Shmyhal, capable of firmly integrating defense into the state's overall governance system. And finally, a manager from the defense-industrial sector with extensive firsthand knowledge of military technology and production."
ukr_advisors_events.13.a: "Fedorov is the nation's hope"
ukr_advisors_events.13.b: "Shmyhal can handle this as well"
ukr_advisors_events.13.c: "Smatanin knows the defense industry from the inside"

ukr_advisors_events.14.t: "A New Head of the GUR?"
ukr_advisors_events.14.desc: "Following Kyrylo Budanov's transition into politics, the position of Head of Ukraine's Main Intelligence Directorate has become vacant. The President must make a difficult decision: who can simultaneously ensure the effectiveness of military intelligence, maintain its political neutrality, and preserve the confidence of international partners? Two leading candidates are currently being discussed.\n\nVasyl Maliuk—the current Head of the SBU, an experienced counterintelligence officer with the reputation of a loyal institutional professional dedicated to the executive chain of command.\n\nViktor Ivashchenko—a General Staff officer and old-school military intelligence analyst respected among career intelligence officers and advocates of a more independent course."
ukr_advisors_events.14.a: "In his new position, Vasyl Maliuk will be even more effective at striking the enemy"
ukr_advisors_events.14.b: "Viktor Ivashchenko is an intelligence officer proven by time"

ukr_advisors_events.15.t: "Budanov Enters Politics"
ukr_advisors_events.15.desc: "After several years of leading military intelligence, Major General Kyrylo Budanov has announced his transition into politics. His name has become one of the most prominent within Ukraine's national security establishment, and the activities of the GUR under his leadership are often described as outstanding. Officially, he is leaving military service 'to continue serving Ukraine in a new capacity.' Behind the scenes, it is said that the decision was coordinated with the Presidential Administration, which sees Budanov as a future coordinator between the security services and the executive branch.\n\nThe media has described this as 'a new era of political realism'—one in which intelligence officials are entering the political arena. Part of the public has welcomed the news with confidence, while others view it with caution."
ukr_advisors_events.15.a: "How do you like the new suit, General?"

ukr_advisors_events.16.t: "Zaluzhnyi Agrees to Return to Ukraine"
ukr_advisors_events.16.desc: "After spending some time serving in the United Kingdom, the Ukrainian authorities officially appealed to General Valerii Zaluzhnyi to return to the country. The reason given was the need for experienced and respected figures capable of uniting society during a difficult period of war and military reform.\n\nZaluzhnyi accepted the invitation, stating that 'our struggle is not over yet, and everyone must serve where they can be most useful to Ukraine.' His return caused a major public reaction and a wave of support across the country. Experts are already discussing the possibility of a new political course based on the authority of the armed forces and the demand for justice."
ukr_advisors_events.16.a: "Welcome back, General"

ukr_advisors_events.17.t: "Zaluzhnyi Declines to Return to Ukraine"
ukr_advisors_events.17.desc: "The Ukrainian authorities invited General Valerii Zaluzhnyi to return to his homeland and take part in leading defense reforms or broader public initiatives. However, the General politely declined, noting that he could currently be of greater service to Ukraine as its representative in the United Kingdom. Officially, he thanked the government for its confidence but emphasized: 'I remain loyal to Ukraine, wherever I may be.'"
ukr_advisors_events.17.a: "A pity, but we'll be back"

ukr_advisors_events.18.t: "Change in the Leadership of the Ministry of Economy"
ukr_advisors_events.18.desc: "Against the backdrop of a prolonged war, budget deficits, and growing public dissatisfaction with the pace of reforms, the government has announced a change in the leadership of the Ministry of Economy. Officially, the decision is explained by the 'need to strengthen the economic bloc' and to 'adapt to new challenges,' although careful observers recognize it as part of a broader political reshuffle within the Cabinet of Ministers.\n\nThe outgoing minister resigns while retaining the possibility of taking another government position or serving as an advisor. The new minister is presented as someone capable of combining wartime economic management, infrastructure reconstruction, and the attraction of international investment. This choice will determine whether the country follows the path of a strict mobilization economy, technocratic reforms, or stronger political control over key sectors."
ukr_advisors_events.18.a: "Sobolev represents a new generation of bureaucrats"
ukr_advisors_events.18.b: "Fedorov can change the system"
ukr_advisors_events.18.c: "Natalukha is an experienced lawyer from the State Property sector"
ukr_advisors_events.18.d: "Let's reach out to businessman Koretskyi"

ukr_advisors_events.19.t: "Minister of Energy"
ukr_advisors_events.19.desc: "Following a corruption scandal and a prolonged period under an acting minister, the Ministry of Energy is in need of permanent leadership. The country is enduring its most difficult heating seasons, the energy system continues to come under constant attack, and effective management of the sector has become directly linked to national security.\n\nThe government is considering several candidates. It could retain Acting Minister Nekrasov, the technocrat who has already kept the system functioning under crisis conditions. It could appoint Shmyhal, strengthening political oversight of the sector. Another option is to bring Naftogaz CEO Serhii Koretskyi into the government, as he has earned a reputation as an effective manager in the oil and gas industry. Alternatively, the position could be entrusted to economist Oleksii Sobolev, known for his experience in digitalization, transparent auctions, and state enterprise reform."
ukr_advisors_events.19.a: "Let Nekrasov continue his work"
ukr_advisors_events.19.b: "Shmyhal will give it a try here as well"
ukr_advisors_events.19.c: "Offer the position to Koretskyi"
ukr_advisors_events.19.d: "Sobolev moves to the energy sector"

ukr_advisors_events.20.t: "General Zaluzhnyi Heads to the United Kingdom"
ukr_advisors_events.20.desc: "After many years of service in the General Staff, General Valerii Zaluzhnyi has resigned from his military post. His military career is inseparably linked with the most difficult battles of the war. By government decision, Zaluzhnyi has been entrusted with a new diplomatic mission. He is being sent to the United Kingdom as a representative of the General Staff to deepen cooperation in defense technologies and the training of Ukrainian officers. His experience is regarded as an important bridge between the front line and Ukraine's international partners.\n\nThe move appears pragmatic, yet politically sensitive at the same time: many in society perceive it as an 'honorable exile' for an officer who had become too popular."
ukr_advisors_events.20.a: "Let's wish Zaluzhnyi the best of luck!"
ukr_nabu_skandal.1.t: "NABU Is Looking for Something..."
ukr_nabu_skandal.1.desc: "For several months, the National Anti-Corruption Bureau of Ukraine has been quietly preparing a large-scale covert operation. Detectives are gathering evidence, wiretapping conversations, tracking financial flows, and meticulously documenting the activities of high-ranking officials and the businesses connected to them.\n\nOfficially, nothing has been announced, but rumors are already spreading in political circles about an upcoming 'major blow' against corruption in strategic sectors. NABU's leadership assures a small circle of partners that the operation will be exemplary and will have a systemic impact."
ukr_nabu_skandal.1.a: "Keep an eye on them"

ukr_nabu_skandal.2.t: "Law No. 4555 Has Been Passed"
ukr_nabu_skandal.2.desc: "After heated debates in Parliament, the President signs Law No. 4555, which significantly changes the rules governing the work of anti-corruption agencies. Officially, the document is presented as an 'optimization of powers' and 'strengthened coordination between law enforcement agencies,' but civil society organizations and experts see it as a serious threat to the independence of investigations.\n\nBehind the scenes, people say the law could become a shield for high-ranking officials involved in corruption schemes within strategic sectors, particularly the energy industry. Activists begin gathering in the streets, while international partners closely monitor the situation, hinting at possible political consequences."
ukr_nabu_skandal.2.a: "Problem solved!"

ukr_nabu_skandal.3.t: "Protests Against Law No. 4555 Begin"
ukr_nabu_skandal.3.desc: "Following the signing of Law No. 4555, thousands of people begin gathering in the center of the capital. Anti-corruption activists, veterans, students, and volunteers take to the streets demanding the repeal of provisions that weaken the independence of investigative bodies.\n\nThe square in front of Parliament becomes a permanent protest site: tents are erected, stages for speeches are set up, and slogans appear condemning the 'counter-reform' during wartime. The government is forced to take public opinion into account, as the debate surrounding Law No. 4555 begins evolving into a broader demand for justice."
ukr_nabu_skandal.3.a: "They'll shout for a while and go home"

ukr_nabu_skandal.4.t: "The President Signs Law No. 13533"
ukr_nabu_skandal.4.desc: "After lengthy debates in Parliament and pressure from both civil society and international partners, the President signs Law No. 13533. The document is presented as an 'adjustment of the state's anti-corruption framework' and an attempt to strike a balance between the independence of investigative agencies and the political accountability of the government.\n\nFor part of society, this law signals that the authorities are willing to respond to criticism and correct previous mistakes. At the same time, opponents warn that even the revised provisions may still allow hidden influence over cases involving high-ranking officials."
ukr_nabu_skandal.4.a: "We underestimated the public"

ukr_nabu_skandal.5.t: "Arakhamia Could Not Be Removed"
ukr_nabu_skandal.5.desc: "At a closed meeting between deputies of the presidential faction and the head of state, fewer than 10% of Servant of the People members supported the proposal to dismiss party leader Arakhamia. Instead, around 90% of those present presented the President with an ultimatum: either he dismisses the Head of the Presidential Office and his closest associates, or a significant portion of the faction will reconsider its support for the President's team.\n\nThe split within the party can no longer be ignored: the core of the faction has united not against its formal leader, but against the influence of the Presidential Office. At stake are the preservation of the parliamentary majority and control over the government in the midst of a corruption scandal and wartime."
ukr_nabu_skandal.5.a: "We underestimated the public"

ukr_nabu_skandal.6.t: "Operation \"Midas\" Begins"
ukr_nabu_skandal.6.desc: "After months of covert work, NABU enters the active phase of Operation 'Midas.' The first batch of files appears in the media and among several members of Parliament: fragments of wiretaps, financial flow charts, draft spreadsheets listing kickbacks and the names of intermediaries.\n\nAlthough no one officially confirms their origin, it is clear that these materials are part of a major anti-corruption investigation in the energy sector. Public outrage grows over the possible scale of corruption, while political elites react nervously to the leak—everyone understands that this is only the first release of files, and much more may still be coming."
ukr_nabu_skandal.6.a: "How did we allow such a leak?"

ukr_nabu_skandal.7.t: "Mindichgate"
ukr_nabu_skandal.7.desc: "Following the beginning of the active phase of Operation 'Midas,' one of the key figures in the energy-sector corruption scheme, the well-known businessman Mindich, suddenly disappears from public view. He left his home just a few hours before NABU officers arrived. Soon afterward, reports emerged that he had left the territory of Ukraine despite formal restrictions and the attention of anti-corruption authorities. The media has already begun referring to the scandal as 'Mindichgate,' in reference to Watergate.\n\nHis escape has dealt a serious blow to the reputation of the law enforcement system. The public is asking how a man linked to multimillion-dollar corruption schemes managed to leave the country so easily. The opposition accuses the authorities of orchestrating a 'controlled escape,' while international partners demand explanations and insist on his extradition."
ukr_nabu_skandal.7.a: "The rat has abandoned the sinking ship"

ukr_nabu_skandal.8.t: "Operation \"Midas\" Continues"
ukr_nabu_skandal.8.desc: "Following the initial file leaks and the publicity surrounding Operation 'Midas,' NABU moves into its second, public phase. Confidential materials are transformed into procedural actions: simultaneous searches are carried out in several cities at business offices, state-owned companies, and the homes of individuals implicated in the case.\n\nThe public learns about the scale of corruption within the energy sector: tens of millions of dollars, kickback percentages, shadow influence centers, and 'back offices' through which the money flowed. As a result, public trust in the anti-corruption agencies rises, while certain representatives of the political elite begin to show open signs of nervousness."
ukr_nabu_skandal.8.a: "When will this finally end?"
ukr_nabu_skandal.9.t: "The First HACC Rulings"
ukr_nabu_skandal.9.desc: "On November 12, 2025, the High Anti-Corruption Court issued a series of rulings in the case that became the centerpiece of Operation 'Midas.' Former Energy Ministry official Ihor Myroniuk was placed in pre-trial detention until January 8 with bail set at UAH 126 million. Energoatom Executive Director for Security Dmytro Basov was remanded in custody for 60 days with bail set at UAH 40 million.\n\nIhor Fursenko, whom investigators consider the accountant of Energoatom's 'back office,' was detained until January 8, 2026, with bail set at UAH 95 million; NABU's case files include his complaint that it had been difficult for him to fit 1.6 million—presumably U.S. dollars—into a single box. Suspect Lesia Ustymenko was placed under arrest with bail set at UAH 25 million. In 2023, she became the owner of a parking space in an ordinary residential building in central Kyiv where the 'back office' was located, while her husband is a Russian citizen who traveled to Russia until 2015 and obtained Ukrainian citizenship that same year.\n\nOn November 13, the HACC ordered Liudmyla Zorina into custody with bail set at UAH 12 million; according to investigators, she managed records for affiliated companies, prepared documentation, and participated in money laundering. At the same time, Minister Hrynchuk submitted her resignation, while the President signed an NSDC decision imposing sanctions on Timur Mindich and Oleksandr Tsukerman. Shortly afterward, the mysterious company 'Vangar,' with a registered capital of only UAH 1,000, posted bail of UAH 25 million and UAH 12 million for Ustymenko and Zorina, respectively. On November 14, the President removed Halushchenko and Hrynchuk from the National Security and Defense Council, NABU and SAPO filed a motion requesting pre-trial measures against Oleksii Chernyshov, and SAPO Deputy Head Andrii Syniuk unexpectedly resigned from his position."
ukr_nabu_skandal.9.a: "The HACC is doing its job!"

ukr_nabu_skandal.10.t: "Acting Minister of Energy"
ukr_nabu_skandal.10.desc: "Following the resignation of the previous leadership, the government decides to temporarily assign the duties of Minister of Energy to First Deputy Minister Artem Leonidovych Nekrasov. For him, this marks a sudden transition from the role of a technocrat to becoming the political figure responsible for the country's entire energy system.\n\nThe appointment comes during the most challenging heating season in Ukraine's history, amid massive attacks on energy infrastructure and high public expectations. Nekrasov publicly states that he fully understands the responsibility placed upon him and identifies the stable operation of the energy system, transparency, restoring public trust, and active cooperation with international partners as his top priorities."
ukr_nabu_skandal.10.a: "Prepare the candidates!"

ukr_nabu_skandal.11.t: "Revolt Against the President's Inner Circle"
ukr_nabu_skandal.11.desc: "Amid the corruption scandal surrounding the Mindich case and Operation 'Midas,' a crisis erupts within the ruling team. In Kyiv, senior government officials, including representatives of the security sector, begin working toward forcing the Head of the Presidential Office to resign. At the same time, up to 80% of the President's party faction reaches the conclusion that if the Head of the Presidential Office remains in office, they are prepared to leave the team—effectively leading to the collapse of the single-party parliamentary majority.\n\nThe Head of the Presidential Office himself insists to the President that the 'Mindich case' is being orchestrated by both foreign and domestic opponents and demands a 'firm response' against NABU. The President convenes meetings with both officials from the Presidential Office's circle and its critics; public visits by the Prime Minister, the Deputy Prime Minister for Digital Transformation, and influential representatives of the security sector have all been reported. Meanwhile, within the Servant of the People party, a 'Group of the Determined' emerges under the informal leadership of Arakhamia and Hetmantsev, openly lobbying for the dismissal of the Head of the Presidential Office and threatening to leave the parliamentary faction."
ukr_nabu_skandal.11.a: "Yermak or the party?"

ukr_nabu_skandal.12.t: "Yermak Resigns"
ukr_nabu_skandal.12.desc: "Amid a prolonged political crisis, corruption scandals, and growing tensions within the ruling party, the Head of the Presidential Office submits his resignation. Officially, the move is explained as being 'of his own accord' and due to the 'need to renew the team under wartime conditions,' but it is obvious to everyone that the decision resulted from pressure exerted by the parliamentary faction and key government officials.\n\nThe President publicly announces a reboot of the Presidential Office, promises to improve transparency in decision-making, and pledges to appoint individuals with impeccable reputations to senior positions. Society perceives this both as a sign of the weakness of the previous governing arrangement and as an opportunity for political renewal."
ukr_nabu_skandal.12.a: "This will be better for the country"
