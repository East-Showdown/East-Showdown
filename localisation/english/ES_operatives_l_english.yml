 operation_ES_political_pressure_1: "Political pressure"
 operation_ES_political_pressure_1_desc: "§LCompromising material and information leaks weaken the enemy government. Requires a level I information network.§!"
 operation_ES_political_pressure_2: "Large-scale political pressure"
 operation_ES_political_pressure_2_desc: "§LA coordinated campaign in the enemy media. Requires a level II information network.§!"
