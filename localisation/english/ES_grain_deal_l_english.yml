l_english:
 es_grain_deal.1.t: "Russia Announces Withdrawal from the Grain Deal"
 es_grain_deal.1.d: "On 17 July, Russia announced its withdrawal from the grain deal. Brokered by the United Nations and Türkiye in the summer of 2022, the agreement had allowed food exports from Ukrainian ports to resume.\n\nCiting unfulfilled commitments regarding Russian exports, Moscow refused to renew its participation and withdrew its guarantees for the safety of shipping. Ukrainian maritime trade is once again under threat, while the UN has warned of the consequences for global food security."
 es_grain_deal.1.ukr: "They have proved that peace does not interest them."
 es_grain_deal.1.rus: "What was the point of the agreement?"
 es_grain_deal.1.nato: "It was a good attempt..."
 es_grain_deal.1.other: "Another blow to global trade."
 UKR_partial_port_blockade: "Partial Port Blockade"
 UKR_partial_port_blockade_desc: "Following the end of the grain deal, the safety of maritime exports is no longer guaranteed. Restricted port operations reduce foreign trade and force the government to devote additional resources to supplying the domestic market."
