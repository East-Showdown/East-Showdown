l_english:
 raid_category_ammo_depot_strikes: "Field Depot Strike"
 raid_category_header_ammo_depot_strikes: "Field Depot Strikes"
 tooltip_raid_category_ammo_depot_strikes: "§HField Depot Strikes§!\nA missile strike on the enemy's field ammunition depots in a state where its ammunition consuming sub-units stand."
 raid_category_fluff_text_ammo_depot_strikes: "§LMissile Troops and Artillery§!"
 raid_type_ammo_depot_strike: "Field Depot Strike"
 raid_type_ammo_depot_strike_desc: "A missile strike on the field ammunition depots in a state. The losses depend on the number of enemy artillery sub-units in the state and on how full its depots are. Enemy divisions in the state get a penalty to attack, defense and breakthrough. The strike uses 4 missiles."
 success_modifier_ammo_depot_countermeasures: "enemy §Hdepot protection§!"
 success_modifier_ammo_depot_countermeasures_counterplay: "- Take the field depot protection decisions"
 success_modifier_ammo_depot_counter_battery: "enemy §Hlauncher hunt§!"
 success_modifier_ammo_depot_counter_battery_counterplay: "- Take the launcher hunt decisions"
 ammo_depot_strike_missiles_tt: "Uses §Y4§! missiles."
 ammo_depot_strike_counter_battery_tt: "The enemy hit the rocket site: §Y4§! missiles are used and the wing loses another §R25%§! of its missiles."
 ammo_depot_strike_victim_tt: "Part of the field ammunition depots in the state is destroyed. Divisions in the state get a penalty to attack, defense and breakthrough."
 ammo_depot_strike_1: "Field depot strike: level 1"
 ammo_depot_strike_2: "Field depot strike: level 2"
 ammo_depot_strike_3: "Field depot strike: level 3"
 ammo_depot_strike_4: "Field depot strike: level 4"
 ammo_depot_strike_5: "Field depot strike: level 5"
 ammo_depot.1.t: "Strikes on Field Depots"
 ammo_depot.1.d: "The enemy launches missile strikes on our field ammunition depots. The strikes disrupt logistics and destroy the stocks at the front. The command must take measures to reduce the damage from future strikes."
 ammo_depot.1.a: "Take measures"
 ammo_depot_protection_category: "Field Depot Protection"
 ammo_depot_protection_category_desc: "Measures against missile strikes on field ammunition depots.\n\nDepot resistance: §G[?ammo_depot_strike_resist|%0]§! (strike losses and penalty are reduced by this share)\nReduction of enemy strike success chance: §G[?ammo_depot_strike_chance_malus|%0]§!\nChance of a counter-strike on enemy rocket sites: §G[?ammo_depot_counter_chance|%0]§!"
 ammo_depot_protection_mission: "Protect the Field Depots"
 ammo_depot_protection_mission_desc: "Take at least §Y7§! field depot protection decisions. Otherwise the army gets penalties for §Y90§! days."
 ammo_depot_dispersal: "Disperse the Field Depots"
 ammo_depot_dispersal_desc: "Many small depots instead of large ones: one strike destroys less."
 ammo_depot_relocation: "Move the Depots Away from the Front"
 ammo_depot_relocation_desc: "Depots out of rocket artillery range. Delivery to the front takes longer."
 ammo_depot_wheeled_delivery: "Delivery from the Wheels"
 ammo_depot_wheeled_delivery_desc: "Ammunition goes straight to the positions without large depots. Deliveries are more frequent."
 ammo_depot_bunkers: "Underground Storage and Revetments"
 ammo_depot_bunkers_desc: "Engineering protection of the depots. Engineer units are busy, construction slows down."
 ammo_depot_separate_storage: "Separate Storage"
 ammo_depot_separate_storage_desc: "Charges are stored apart from shells: detonation does not spread."
 ammo_depot_fire_protection: "Depot Fire Protection"
 ammo_depot_fire_protection_desc: "Fire crews and berms against detonation."
 ammo_depot_camouflage: "Camouflage and Decoy Depots"
 ammo_depot_camouflage_desc: "The enemy spends missiles on decoys."
 ammo_depot_air_defense: "Air Defense for the Depots"
 ammo_depot_air_defense_desc: "Air defense covers the depots against missiles."
 ammo_depot_electronic_warfare: "Electronic Warfare against Satellite Navigation"
 ammo_depot_electronic_warfare_desc: "Jamming the satellite navigation of guided missiles."
 ammo_depot_counterintelligence: "Counterintelligence and Signal Discipline"
 ammo_depot_counterintelligence_desc: "Hunting spotters and banning mobile phones in the units."
 ammo_depot_restricted_zone: "Restricted Front Zone"
 ammo_depot_restricted_zone_desc: "Evacuating residents and controlling access near the depots."
 ammo_depot_launcher_hunt: "Launcher Hunt"
 ammo_depot_launcher_hunt_desc: "Counter-battery fire and air strikes on launch areas."
 ammo_depot_drone_recon: "Drone Reconnaissance of Launchers"
 ammo_depot_drone_recon_desc: "Reconnaissance drones search for enemy launchers."
 ammo_depot_logistics_protection: "Unified Rear Logistics Protection"
 ammo_depot_logistics_protection_desc: "The field depot protection measures are joined into one system."
 ammo_depot_logistics_failure_1: "Vulnerable Field Depots"
 ammo_depot_logistics_failure_1_desc: "The army did not protect the field depots from missile strikes in time."
 ammo_depot_logistics_failure_2: "Broken Front Logistics"
 ammo_depot_logistics_failure_2_desc: "$ammo_depot_logistics_failure_1_desc$"
 ammo_depot_logistics_failure_3: "Shell Hunger"
 ammo_depot_logistics_failure_3_desc: "$ammo_depot_logistics_failure_1_desc$"
