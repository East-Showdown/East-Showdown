 raid_category_header_ammo_depot_strikes: "Field Depot Strikes"
 tooltip_raid_category_ammo_depot_strikes: "§HField Depot Strikes§!\nA missile or drone strike on the enemy's field ammunition depots in a state where its ammunition consuming sub-units stand."
 raid_category_fluff_text_ammo_depot_strikes: "§LMissile Troops and Artillery§!"
 raid_type_ammo_depot_strike_rc: "Launch cruise missile strike at field depots"
 raid_type_ammo_depot_strike_rc_desc: "A strike on the field ammunition depots in a state. The losses depend on the number of enemy artillery sub-units in the state and on how full its depots are. Enemy divisions in the state get a penalty to attack and defense. The whole wing is expended."
