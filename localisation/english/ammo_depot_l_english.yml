 ammo_depot.1.t: "Strikes on Field Depots"
 ammo_depot.1.d: "The enemy launches missile strikes on our field ammunition depots. The strikes disrupt logistics and destroy the stocks at the front. The command must take measures to reduce the damage from future strikes."
 ammo_depot.1.a: "Take measures"
 ammo_depot.2.t: "Field Depots Left Unprotected"
 ammo_depot.2.d: "The time given to protect the field depots has run out. Measures taken: [?ammo_depot_decisions_taken|0] of 7. Enemy strikes keep wrecking our frontline logistics, and the army pays for the delay."
 ammo_depot.2.a: "We will fight with what we have"
 ammo_depot.3.t: "Unified Rear Logistics Protection"
 ammo_depot.3.d: "All field depot protection measures are taken and combined into one system. Dispersed and sheltered depots, air defense, electronic warfare and the hunt for launchers make enemy strikes on our logistics far less effective."
 ammo_depot.3.a: "Excellent"
 ammo_depot_protection_category: "Field Depot Attack and Defense"
