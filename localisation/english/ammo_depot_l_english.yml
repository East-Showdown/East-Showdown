 ammo_depot_protection_mission: "Protect the Field Depots"
 ammo_depot_protection_mission_desc: "Take at least §Y7§! field depot protection decisions. Otherwise the army gets penalties for §Y90§! days."
 ammo_depot_dispersal: "Disperse the Field Depots"
 ammo_depot_dispersal_desc: "Many small depots instead of large ones: one strike destroys less."
 ammo_depot_relocation: "Move the Depots Away from the Front"
 ammo_depot_relocation_desc: "Depots out of rocket artillery range. Delivery to the front takes longer."
 ammo_depot_wheeled_delivery: "Delivery from the Wheels"
 ammo_depot_wheeled_delivery_desc: "Ammunition goes straight to the positions without large depots. Deliveries are more frequent."
 ammo_depot_bunkers: "Underground Storage and Revetments"
 ammo_depot_bunkers_desc: "Engineering protection of the depots. Engineer units are busy, construction slows down."
 ammo_depot_separate_storage: "Separate Storage"
 ammo_depot_separate_storage_desc: "Charges are stored apart from shells: detonation does not spread."
 ammo_depot_fire_protection: "Depot Fire Protection"
 ammo_depot_fire_protection_desc: "Fire crews and berms against detonation."
 ammo_depot_camouflage: "Camouflage and Decoy Depots"
 ammo_depot_camouflage_desc: "The enemy spends missiles on decoys."
 ammo_depot_air_defense: "Air Defense for the Depots"
 ammo_depot_air_defense_desc: "Air defense covers the depots against missiles."
 ammo_depot_electronic_warfare: "Electronic Warfare against Satellite Navigation"
 ammo_depot_electronic_warfare_desc: "Jamming the satellite navigation of guided missiles."
 ammo_depot_counterintelligence: "Counterintelligence and Signal Discipline"
 ammo_depot_counterintelligence_desc: "Hunting spotters and banning mobile phones in the units."
 ammo_depot_restricted_zone: "Restricted Front Zone"
 ammo_depot_restricted_zone_desc: "Evacuating residents and controlling access near the depots."
 ammo_depot_launcher_hunt: "Launcher Hunt"
 ammo_depot_launcher_hunt_desc: "Counter-battery fire and air strikes on launch areas."
 ammo_depot_drone_recon: "Drone Reconnaissance of Launchers"
 ammo_depot_drone_recon_desc: "Reconnaissance drones search for enemy launchers."
 ammo_depot_logistics_protection: "Unified Rear Logistics Protection"
