l_english:
 es_fq_open_label:0 "Focus queue"
 es_fq_open_tt:0 "Open or close the focus queue."
 es_fq_title:0 "Focus queue"
 es_fq_description:0 "When no focus is running, the first queued focus whose requirements are met starts automatically. Entries that cannot start yet are skipped and stay in the queue."
 es_fq_instruction:0 "§GClick the plus on a focus to queue it.§! Click a row, then its new place, to reorder."
 es_fq_queue_title:0 "Queue: [?es_fq_queue^num|0] / 100"
 es_fq_pause:0 "[es_fq_pause_label]"
 es_fq_pause_on:0 "§RPaused: resume§!"
 es_fq_pause_off:0 "§GRunning: pause§!"
 es_fq_pause_tt:0 "Pause or resume the queue. Pausing does not cancel the focus in progress."
 es_fq_buttons:0 "[es_fq_buttons_label]"
 es_fq_buttons_on:0 "Hide"
 es_fq_buttons_off:0 "Show"
 es_fq_buttons_tt:0 "Show or hide the queue buttons on the focus tree."
 es_fq_clear:0 "Clear"
 es_fq_clear_tt:0 "Remove every focus from the queue."
 es_fq_status_ready:0 "Queue active. Checked once a day while no focus is running."
 es_fq_status_empty:0 "The queue is empty."
 es_fq_status_paused:0 "Queue paused. The current focus continues."
 es_fq_status_blocked:0 "§YSome focuses are waiting for their requirements (red buttons). They are skipped until available.§!"
 es_fq_status_moving:0 "Click the destination row, or the selected row again to cancel."
 es_fq_remove_tt:0 "Remove from the queue. Does not cancel a focus in progress."
 es_fq_move_tt:0 "Click a row, then its destination. Click the selected row again to cancel."
 es_fq_toggle_tt:0 "Add to / remove from the focus queue.\n§Yyellow§! – queued, §Ggreen§! – started by the queue, §Rred§! – waiting for requirements."
 es_fq_unknown:0 "Unknown focus"
