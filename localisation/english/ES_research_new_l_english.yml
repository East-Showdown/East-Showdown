 tech_ARV: "Armored Recovery Vehicle Technology"
 reb_1: "Narrowband Electronic Warfare Systems"
 reb_1_desc: "Improvised single-band jammers fitted to vehicles from late 2022, tuned to the 2.4 and 5.8 GHz links of commercial FPV drones. Cheap and quick to install, but useless as soon as the enemy changes frequency."
 reb_2: "Extended Frequency Suppression Systems"
 reb_2_desc: "Purpose-built vehicle jammers such as the Russian «Volnorez» (shown in 2023, roughly 0.9–2 GHz) or the Ukrainian Piranha «Dome 360»: magnet-mounted antennas give 360° cover of the main FPV control bands and cut the link a few hundred metres out."
 reb_3: "Broadband Suppression Cascades"
 reb_3_desc: "From 2024 field workshops stacked several jammers on turret roofs and cages, each covering its own band, as on the captured T-72B3M «EW tank». Wide coverage, but heavy, power-hungry and easy to spot."
 reb_4: "Standard EW System «Tetrahedron»"
 reb_4_desc: "Factory-fitted EW suites wired into the vehicle electronics and fed by the auxiliary power unit, so the jammer keeps working with the engine off. Uralvagonzavod reported standard counter-drone EW kits on new tanks in 2024."
 antidrone_1: "Field Anti-Drone Cages"
 antidrone_1_desc: "Welded 'cope cages', logs and mats over the turret and engine deck: crude, but they stop many FPV drones before the warhead reaches the armour."
 antidrone_2: "Factory Screens and Nets"
 antidrone_2_desc: "Standardised screens, nets and roof grilles fitted at depots and factories, covering the whole vehicle without blocking hatches or optics."
 antidrone_3: "Integrated Anti-Drone Suites"
 antidrone_3_desc: "Full-coverage screening combined with drone detection and remote weapon stations or shotguns that engage drones before they hit."
 antidrone_4: "Full-Coverage Sheds"
 antidrone_4_desc: "Field-built 'turtle' sheds that enclose the whole vehicle. Nearly drone-proof from above, but the gun can barely traverse and the crew is half blind."
