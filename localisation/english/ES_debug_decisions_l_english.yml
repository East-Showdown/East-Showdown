l_english:
 UKR_debug_toggle_donbas_chapter_flag: "Chapter flag: Battle for Donbas"
 UKR_debug_toggle_donbas_chapter_flag_desc: "Enables the §YUKR_start_battle_for_donbas§! flag or clears it if already enabled. Hides the opening chapter and moves the Donbas chapter into its place. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_autumn_chapter_flag: "Chapter flag: Autumn Storm"
 UKR_debug_toggle_autumn_chapter_flag_desc: "Enables the §YUKR_autumn_storm_focus_completed§! flag or clears it if already enabled. Hides the Donbas chapter and moves the autumn chapter into its place. Enable the Donbas chapter flag first for the correct layout. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_final_push_preparation_flag: "Chapter flag: Preparation for the Final Push"
 UKR_debug_toggle_final_push_preparation_flag_desc: "Enables the §YUKR_prepare_for_final_push_focus_completed§! flag or clears it if already enabled. Hides the autumn chapter and reveals offensive preparations. Enable both previous chapter flags first for the correct layout. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_take_back_ours_flag: "Chapter flag: Time to Take Back What Is Ours"
 UKR_debug_toggle_take_back_ours_flag_desc: "Enables the §YUKR_time_to_take_back_ours_focus_completed§! flag or clears it if already enabled. Hides the preparation chapter and reveals the focuses after Time to Take Back What Is Ours. Enable all three previous chapter flags first for the correct layout. Changes only this flag and immediately refreshes the focus tree."
 UKR_unlock_energy_nightmare_decision: "Branch flag: Energy"
 UKR_unlock_energy_nightmare_decision_desc: "Enables the §YUKR_EnergyNightmare§! flag or clears it if already enabled. Shows or hides the energy restoration and construction branch to the left of the main chapter. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_commander_change_flag: "Branch flag: Commander-in-chief change"
 UKR_debug_toggle_commander_change_flag_desc: "Enables the §YCIS_Changed§! flag or clears it if already enabled. Hides the early Zaluzhny Plan and enables the selected commander branch. Also enable one of the five commander flags to display a branch. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_zaluzhny_branch_flag: "Commander flag: Zaluzhny"
 UKR_debug_toggle_zaluzhny_branch_flag_desc: "Enables the §YCIS_Zalyuzhny§! flag or clears it if already enabled. Shows Zaluzhny's branch when CIS_Changed is enabled. Disable the other commander flags to view one branch at a time. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_sirskyy_branch_flag: "Commander flag: Syrskyi"
 UKR_debug_toggle_sirskyy_branch_flag_desc: "Enables the §YCIS_Sirskyy§! flag or clears it if already enabled. Shows Syrskyi's branch when CIS_Changed is enabled. Disable the other commander flags to view one branch at a time. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_biletsky_branch_flag: "Commander flag: Biletsky"
 UKR_debug_toggle_biletsky_branch_flag_desc: "Enables the §YCIS_Biletsky§! flag or clears it if already enabled. Shows Biletsky's branch when CIS_Changed is enabled. Disable the other commander flags to view one branch at a time. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_prokopenko_branch_flag: "Commander flag: Prokopenko"
 UKR_debug_toggle_prokopenko_branch_flag_desc: "Enables the §YCIS_Prokopenko§! flag or clears it if already enabled. Shows Prokopenko's branch when CIS_Changed is enabled. Disable the other commander flags to view one branch at a time. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_drapatiy_branch_flag: "Commander flag: Drapatyi"
 UKR_debug_toggle_drapatiy_branch_flag_desc: "Enables the §YCIS_Drapatiy§! flag or clears it if already enabled. Shows Drapatyi's branch when CIS_Changed is enabled. Disable the other commander flags to view one branch at a time. Changes only this flag and immediately refreshes the focus tree."
 UKR_debug_toggle_new_focus_tree_flag: "Global flag: Alternate focus tree opening"
 UKR_debug_toggle_new_focus_tree_flag_desc: "Enables the §YUKR_NEW_FOCUS_TREE§! flag or clears it if already enabled. Switches the visibility of the alternate opening focus and the early Eastern Crisis branch, including the Zaluzhny Plan. Changes only this flag and immediately refreshes the focus tree."
 UKR_nto_help_new_brigades_category_unlock_decision: "[make_decision_category_visible] «§Y$UKR_nto_help_new_brigades_category$§!»"
 UKR_nto_help_new_brigades_category_unlock_decision_desc: "[console_commands_help_test_decisions]"
