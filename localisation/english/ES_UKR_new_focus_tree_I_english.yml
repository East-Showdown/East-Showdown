 UKR_time_to_take_back_ours: "Time to Take Back What Is Ours"
 UKR_time_to_take_back_ours_desc: ""
 UKR_zaluzhny_branch_start: "Zaluzhnyi Remains Commander-in-Chief"
 UKR_zaluzhny_branch_start_desc: "Valerii Zaluzhnyi retains his post as Commander-in-Chief of the Armed Forces of Ukraine. Instead of carrying out sweeping personnel changes, the country's leadership confirms his authority and continues the previously chosen course of army development. Keeping Zaluzhnyi in command affects not only the military, but also the political balance within the country. The military leadership retains considerable influence over defense and strategic planning, while the civilian authorities continue to exercise political and administrative control over the state. This balance helps avoid an open confrontation between the political leadership and the armed forces, but at the same time strengthens the role of the military command in domestic politics. Stability at the highest level of command preserves accumulated experience and allows ongoing military reforms to continue. Particular attention is given to improving coordination between headquarters, refining the command system, and further developing the armed forces. Extending his tenure also reinforces stability within the senior military leadership and allows it to focus on further army reform, improving command effectiveness, and preparing for new offensive operations."
 UKR_zaluzhny_gsh_reorganization: "Reorganize the General Staff"
 UKR_zaluzhny_gsh_reorganization_desc: "Keeping Zaluzhnyi as Commander-in-Chief opens the way for further restructuring of the General Staff. The country's leadership seeks to adapt the military command system to new political and military conditions. The reform revises the powers of individual structures, the distribution of responsibilities, and interaction between the General Staff, operational commands, and the civilian leadership. The main objective is to create a clearer decision-making system without excessive concentration of authority in any single link of the chain. The reorganization is intended to improve command effectiveness, reduce internal contradictions, and establish a new balance between the military and civilian authorities."
 UKR_zaluzhny_lessons_of_past_campaigns: "Lessons of Past Campaigns"
 UKR_zaluzhny_lessons_of_past_campaigns_desc: "The military leadership conducts an in-depth analysis of previous campaigns, examining them not only as individual operations but also in the context of the overall strategy of the war. Particular attention is paid to key stages of the fighting where decisions were made that influenced the course of the conflict as a whole. The central task is to preserve operational initiative and find opportunities to break through the established front line. The command views maneuver, the concentration of forces on selected axes, and rapid adaptation to changing conditions as ways to prevent the war from gradually turning into a static confrontation. Special attention is also given to developing capabilities that can disrupt the stability of enemy defenses and to increasing the mobility of our own forces."
 UKR_zaluzhny_corps_division_brigade_model: "Corps–Division–Brigade Model"
 UKR_zaluzhny_corps_division_brigade_model_desc: "The military leadership begins restructuring the army's organization, moving toward a clearer system of interaction between corps, divisions, and brigades. The main goal is to create a stable chain of command capable of effectively controlling large groupings of forces. The corps becomes the principal operational echelon, uniting several divisions and coordinating their actions along a particular axis. Divisions become an intermediate command level, grouping brigades and allowing forces and assets to be distributed more effectively. Brigades retain their role as the main tactical formations, but gain a clearer place within the overall structure. This model should simplify the command of large formations, improve coordination, and ensure more efficient use of reserves."
 UKR_zaluzhny_automated_troop_command: "Automate Troop Command"
 UKR_zaluzhny_automated_troop_command_desc: "The military leadership begins large-scale implementation of digital command-and-control systems. The main objective is to reduce the time between detecting a target, making a decision, and transmitting an order directly to the units. Intelligence data, information from frontline formations, operational maps, and reports on the condition of troops are gradually integrated into a unified system. This gives headquarters a more complete picture of events and allows them to react faster to changes. Automation is also applied to operational planning, reserve management, logistics, and coordination between different formations. Commanders gain the ability to exchange information faster and make decisions based on up-to-date data."
 UKR_zaluzhny_technological_exit_from_positional_deadlock: "A Technological Way Out of the Positional Deadlock"
 UKR_zaluzhny_technological_exit_from_positional_deadlock_desc: "The military leadership concludes that simply increasing troop numbers will not be enough to overcome the prolonged positional nature of the war. Restoring maneuver requires technological changes capable of disrupting the stability of the existing defensive system. The main emphasis is placed on the widespread use of unmanned systems, modern reconnaissance assets, precision weapons, and automated command systems. Their integration should make it possible to identify vulnerable sectors faster, concentrate forces more effectively, and create conditions for further advances."
 UKR_zaluzhny_unmanned_assets_of_maneuver_warfare: "Unmanned Systems for Maneuver Warfare"
 UKR_zaluzhny_unmanned_assets_of_maneuver_warfare_desc: "Unmanned systems are introduced on a massive scale as one of the key elements of maneuver warfare. Drones must not only provide reconnaissance, but also expand the troops' capabilities in observation, communications, coordination, and operational support. Particular attention is paid to creating a unified system linking unmanned assets, reconnaissance units, and headquarters. The data they provide makes it possible to detect changes in the situation faster and pass information to commanders without delay. The development of unmanned technologies also reduces the burden on personnel and improves the effectiveness of available forces. Integrating unmanned systems becomes an important part of the army's technological course. Their widespread use should accelerate decision-making, improve command awareness, and create additional opportunities for maneuver warfare."
 UKR_zaluzhny_final_rejection_of_static_defense: "Final Rejection of Static Defense"
 UKR_zaluzhny_final_rejection_of_static_defense_desc: "The military leadership revises its approach to defense, rejecting a strategy based primarily on the prolonged holding of previously prepared lines. The new concept is built around preserving the initiative and maintaining constant readiness to change the disposition of forces. Defense is now treated as a dynamic process combining the holding of key positions, maneuver by reserves, and active operations on the most important axes. This approach becomes the logical culmination of the effort to avoid a positional deadlock. Instead of passively waiting for enemy action, the army seeks to constantly find opportunities to alter the situation and regain the initiative."
 UKR_zaluzhny_main_effort_concentration: "Concentrate Forces on the Main Axes of Attack"
 UKR_zaluzhny_main_effort_concentration_desc: "The military leadership revises the principles for distributing troops, abandoning the idea of holding the entire front line evenly. The main emphasis shifts toward concentrating the most combat-capable formations and reserves on axes that are decisive for the development of an operation. On selected axes, the necessary density of troops, equipment, and support assets is created, while secondary sectors retain only the minimum forces required. Particular attention is paid to reserve mobility. Forces must be able to move quickly between axes as the situation changes, preventing the enemy from identifying in advance where the main effort will be concentrated. This system avoids dispersing resources and allows local superiority to be exploited to develop maneuver. Concentration of forces becomes one of the central principles of the new strategy aimed at breaking the positional deadlock."
 UKR_zaluzhny_operational_maneuver_doctrine: "Operational Maneuver Doctrine"
 UKR_zaluzhny_operational_maneuver_doctrine_desc: "The military leadership restructures the army's organization, moving toward a clearer system of interaction between corps, divisions, and brigades. The army must seek not merely to hold the front line, but to create conditions for changing it through maneuver, concentration of forces, and rapid response. The doctrine is based on combining formation mobility, flexible use of reserves, and concentration of effort on axes where the greatest results can be achieved. When the situation changes, the command must be able to shift its main effort quickly to another sector. Special importance is placed on cooperation between reconnaissance, headquarters, and maneuver groups. Information must be turned rapidly into decisions that exploit enemy vulnerabilities before the opponent has time to reorganize the defense. The doctrine also rejects prolonged fighting on a single axis when there is no realistic prospect of changing the situation. If the enemy manages to stabilize the front, the command must seek new opportunities for maneuver."
 UKR_zaluzhny_maneuver_group_hq: "Maneuver Group Headquarters"
 UKR_zaluzhny_maneuver_group_hq_desc: "To implement the new strategy, a specialized Maneuver Group Headquarters is created to coordinate mobile formations and prepare operations capable of disrupting the stability of the front. The headquarters focuses on planning rapid regroupings, coordinating different units, and ensuring the timely employment of reserves. Using information from intelligence and field commands, it must quickly identify axes where the situation can be changed to our advantage."
 UKR_zaluzhny_main_effort_concentration: "Concentrate Forces on the Main Axis of Attack"
 UKR_zaluzhny_main_effort_concentration_desc: "An even distribution of reserves across the entire front deprives the army of the ability to achieve decisive superiority. The General Staff must learn to concentrate forces on a selected axis and strike where the enemy is least prepared to withstand the blow."
 UKR_zaluzhny_heavy_mechanized_strike_formations: "Heavy Mechanized Strike Formations"
 UKR_zaluzhny_heavy_mechanized_strike_formations_desc: "The military leadership begins forming heavy mechanized strike formations capable of concentrating substantial combat power on key axes. Their core consists of heavy mechanized units reinforced with a strong armored component, expanded artillery establishments, and advanced reconnaissance assets. Their primary task is to give the army the ability to conduct large-scale maneuver operations and create local superiority on selected sectors of the front."
 UKR_zaluzhny_engineering_breakthrough_vehicles: "Breakthrough Engineering Vehicles"
 UKR_zaluzhny_engineering_breakthrough_vehicles_desc: "To improve the army's ability to overcome prepared defensive lines, specialized engineering formations begin to be developed. Their main task is to reduce the impact of engineering obstacles and difficult terrain on the pace of an offensive. Developing engineering capabilities becomes an important part of the shift toward maneuver warfare, increasing the army's ability to breach fortified positions and avoid prolonged positional confrontation."
 UKR_zaluzhny_mobile_repair_evacuation_groups: "Mobile Repair and Recovery Groups"
 UKR_zaluzhny_mobile_repair_evacuation_groups_desc: "The task of mobile repair and recovery groups is to return damaged equipment to service as quickly as possible and evacuate vehicles that cannot be restored directly near the front. These groups are able to operate in combat areas and move alongside maneuver formations. Their creation reduces equipment losses caused by delayed recovery and eases the burden on stationary repair bases."
 UKR_zaluzhny_final_rejection_of_static_defense: "Final Rejection of Static Defense"
 UKR_zaluzhny_final_rejection_of_static_defense_desc: "The military leadership revises its approach to defense, rejecting a strategy based primarily on the prolonged holding of previously prepared lines. The new concept is built around preserving the initiative and maintaining constant readiness to change the disposition of forces. Defense is now treated as a dynamic process combining the holding of key positions, maneuver by reserves, and active operations on the most important axes. This approach becomes the logical culmination of the effort to avoid a positional deadlock. Instead of passively waiting for enemy action, the army seeks to constantly find opportunities to alter the situation and regain the initiative."
 UKR_zaluzhny_operational_maneuver_doctrine: "Operational Maneuver Doctrine"
 UKR_zaluzhny_operational_maneuver_doctrine_desc: "The military leadership restructures the army's organization, moving toward a clearer system of interaction between corps, divisions, and brigades. The army must seek not merely to hold the front line, but to create conditions for changing it through maneuver, concentration of forces, and rapid response. The doctrine is based on combining formation mobility, flexible use of reserves, and concentration of effort on axes where the greatest results can be achieved. When the situation changes, the command must be able to shift its main effort quickly to another sector. Special importance is placed on cooperation between reconnaissance, headquarters, and maneuver groups. Information must be turned rapidly into decisions that exploit enemy vulnerabilities before the opponent has time to reorganize the defense. The doctrine also rejects prolonged fighting on a single axis when there is no realistic prospect of changing the situation. If the enemy manages to stabilize the front, the command must seek new opportunities for maneuver."
 UKR_sirskyy_branch_start: "Syrskyi Appointed Commander-in-Chief"
 UKR_sirskyy_branch_start_desc: "Commander-in-Chief of the Armed Forces of Ukraine Oleksandr Syrskyi is an experienced commander whose combat record and leadership experience have been inseparably linked to the defense of the state since the first battles of the Anti-Terrorist Operation. His command style is based on a concept of hard, dynamic warfare. Syrskyi is a principled opponent of passive, rigid defense. Rather than merely holding lines, his strategy calls for decisive counterattacks against enemy positions, methodically disrupting the occupiers' offensive plans and disorganizing their advance. Command under Syrskyi is characterized by exceptional tactical flexibility. Moving away from a rigid and cumbersome hierarchy, the Commander-in-Chief practices direct operational control on critical axes. This is reflected in rapid decision-making: dynamically reassigning battalions, shifting forces between brigades, and creating composite tactical groups. Such close personal control of the operational situation allows the command to react immediately to any changes at the front. Assault formations form the striking core of Syrskyi's doctrine and receive unconditional priority in supplies and reinforcements. The rapid commitment of mobile operational reserves to the hardest sectors, careful distribution of forces, and constant tactical pressure on the enemy allow the Ukrainian army to seize and retain the initiative even in the harsh realities of positional warfare."
 UKR_sirskyy_gsh_reorganization: "Reorganize the General Staff"
 UKR_sirskyy_gsh_reorganization_desc: "Under Commander-in-Chief Oleksandr Syrskyi, the architecture of the General Staff undergoes a deep transformation. The goal of the reform is to turn the command from a cumbersome bureaucracy into a dynamic center of operational response. Reducing headquarters staff and transferring experienced officers to combat brigades narrows the gap between planning and frontline reality. Reliance on disciplined, unconventional commanders makes it possible to direct battle on the move. The General Staff's task is now not only to design large operations, but also to exercise adaptive control of the front: precisely allocating reserves, rapidly containing crises on difficult axes, and maintaining the combat resilience of brigades. Direct, continuous communication between the trenches and the high command ensures that every round is sent where it can inflict the greatest damage on the enemy."
 UKR_sirskyy_lessons_of_past_campaigns: "Lessons of Past Campaigns"
 UKR_sirskyy_lessons_of_past_campaigns_desc: "Analysis of previous campaigns reveals a hard truth: the outcome of this war will be decided not by ambitious breakthroughs alone, but by tactical endurance and adaptability. Large offensives have repeatedly run into shortages of resources, exhaustion of personnel, and failures of local command. This harsh experience must become the foundation for further reform of the army. The key to victory is the ability to hold the front and rapidly contain any enemy breakthrough. On a transparent battlefield dominated by strike drones and continuous reconnaissance, pragmatism sets the rules. Surgical, localized assault operations are far more justified than attempts to smash through many kilometers of Russian fortifications across a broad front. Today, victory belongs to the side that distributes its forces intelligently, minimizes losses, and delivers precise but deadly blows."
 UKR_sirskyy_corps_brigade_vertical: "Corps–Brigade Command Structure"
 UKR_sirskyy_corps_brigade_vertical_desc: "The unprecedented length of the front demands a profound transformation of command. The General Staff initiates a transition to a fundamentally new structure: a corps–brigade chain of command. Attempts to direct dozens of brigades straight from the Commander-in-Chief's headquarters overload senior command, paralyze logistics, and deprive the troops of mobility. In modern warfare, hours lost to coordination are paid for in blood. The formation of corps transfers operational initiative closer to the battlefield, turning them into powerful regional command hubs. This allows local crises to be addressed immediately, neighboring units to coordinate seamlessly, and a coherent defense to be built. The logistics chain changes as well: the General Staff allocates reserves at the corps level, while corps commands, with a detailed understanding of the tactical situation, direct support to where it is critically needed. Against the enemy's tactic of small assault groups, this command architecture provides the flexibility, resilience, and preservation of manpower that we need."
 UKR_sirskyy_assault_training_centers: "Establish Assault Training Centers"
 UKR_sirskyy_assault_training_centers_desc: "As part of Commander-in-Chief Oleksandr Syrskyi's new doctrine, a large-scale network of specialized assault training centers is established. A modern assault is not simple line-infantry work, but an extremely complex set of tactical actions requiring an entirely different level of training. The realities of modern war create an urgent need for dedicated hubs where personnel can be prepared for precise, lethal operations against fortified positions. In an era of pervasive, multi-layered reconnaissance, the assault soldier becomes a universal battlefield operator. Training is built around seamless cooperation with strike drones, various armored vehicles, artillery, and combat engineers. The foundation of the new tactics is rapid infiltration by very small groups. This makes it possible to penetrate enemy defenses while minimizing visual signature and preserving the lives of personnel. Even if assault units are not formally separated into an independent branch of service, they have de facto become the main instrument of breakthrough. A pragmatic approach to command places real combat effectiveness above paperwork and formalities."
 UKR_sirskyy_form_assault_troops: "Form Assault Troops"
 UKR_sirskyy_form_assault_troops_desc: "The formation of assault troops under Oleksandr Syrskyi is a response to the challenges of modern high-intensity warfare. Placing these formations under the direct operational control of the Commander-in-Chief turns them into a powerful high-command reserve capable of changing the situation on the battlefield. Removing bureaucratic chains allows assault troops to be redeployed immediately to the most critical axes. Assault units become a universal tool wherever ordinary brigades cannot contain a threat in time. They are used for rapid counterattacks, clearing fortified enemy strongpoints, stabilizing collapsing flanks, and carrying out localized breakthroughs. The actions of these elite units not only disrupt enemy offensive plans, but also give regular mechanized formations time to rotate and strengthen their defenses."
 UKR_sirskyy_assault_afv_support: "Integrate AFVs into Assault Groups"
 UKR_sirskyy_assault_afv_support_desc: "On a densely contested front under constant observation by enemy UAVs, the classic deep breakthrough by armored columns has become a thing of the past. This does not make armored vehicles irrelevant; instead, the philosophy of their employment changes. Armored fighting vehicles become an integral part of Ukrainian assault tactics. Their main task in modern conditions is to carry assault groups to a critically close distance from enemy fortifications, provide continuous fire support, and help them consolidate captured positions. Compared with heavier armored vehicles that often operate from greater distances, AFVs offer high maneuver speed, protection from fragments and small-arms fire, and greater cost efficiency. During an attack, they deliver infantry directly to enemy trenches and support the troops with close-range fire, preventing the enemy from raising its head."
 UKR_sirskyy_recon_fire_assault_loop: "The “Reconnaissance–Fire–Assault” Loop"
 UKR_sirskyy_recon_fire_assault_loop_desc: "All of Oleksandr Syrskyi's reforms—from the introduction of the corps system to the creation of specialized reconnaissance-strike UAV groups—come together as a single coherent concept. Training, equipping, and arming an assault soldier only to send him on a one-way mission would be reckless and incompetent, and has no place in our army. To maximize effectiveness, the “reconnaissance–fire–assault” loop is introduced. The concept follows a strict sequence: assault groups never operate blind. Reconnaissance drones first identify enemy positions in detail. Tube artillery, working together with strike drones, then delivers concentrated fire to suppress the enemy as thoroughly as possible. Only after that does the assault infantry move on the fortifications to clear the positions and eliminate the remaining pockets of resistance. This combat loop functions as a coordinated organism, minimizing personnel losses while maximizing the effectiveness of the mission."
 UKR_sirskyy_fpv_saturation_assault_brigades: "Prioritize FPV Drone Saturation of Assault Brigades"
 UKR_sirskyy_fpv_saturation_assault_brigades_desc: "Assault units are frequently sent to the bloodiest sectors of the front. As the nature of the war changes rapidly, supply priorities must change with it. FPV drones have become one of the deadliest weapons of the current war. To minimize losses among our soldiers during assault operations, classical artillery preparation alone is not enough; enemy manpower must also be actively destroyed by unmanned systems. The fewer enemy troops remain in their positions before direct contact, the easier it will be for our forces to advance. It is an old logic of warfare, with FPV drones serving as an innovative means of achieving a fundamental objective."
 UKR_sirskyy_fortress_cities_tactics: "Continue the Fortress-City Tactics"
 UKR_sirskyy_fortress_cities_tactics_desc: "In our strategic situation, cities become key defensive nodes. They are not merely masses of concrete and steel, but vital logistics hubs, shelters for UAV operator bases, and relatively secure rear areas that can become formidable fortresses as the front approaches. Holding them is a bloody but highly effective way to pin down and exhaust the enemy. Fighting for the territory around cities is often no less intense. The enemy methodically seeks to envelop a settlement, while our task is to secure the flanks as firmly as possible and, in a critical situation, reverse the course of the battle with a counterattack that cuts off enemy assault groups from their main forces. The Commander-in-Chief must make difficult decisions, at times leaving garrisons to fight under operational encirclement. This is dictated by the harsh arithmetic of survival: a hasty withdrawal under crossfire may cause far greater losses than a stubborn defense that grinds down the attackers. War is no place for illusions. It is a brutal battlefield where victory comes from pragmatic, flexible, and severe decisions rather than abandoning every settlement without exacting a price."
 UKR_sirskyy_war_of_attrition: "War of Attrition"
 UKR_sirskyy_war_of_attrition_desc: "Attempts to inflict a decisive defeat on the enemy during the maneuver phase of the war have given way to the harsh reality of positional confrontation. With the war in strategic deadlock and diplomacy failing, the Armed Forces of Ukraine have no choice but to continue resisting and methodically exhaust the enemy. The heavy reliance on aerial and ground unmanned systems highlights Ukraine's central vulnerabilities: shortages of personnel and equipment. Nevertheless, our army is capable of sustaining a prolonged resistance, using asymmetric methods to destroy the enemy before he reaches our positions. Even when a lack of resources prevents the enemy from being defeated at long range, the struggle does not end. It turns into a bloody contest until the brutal logic of war takes hold again and the cycle repeats. Oleksandr Syrskyi has taken on an exceptionally heavy burden: conducting a war of attrition against an enemy that surpasses us in most parameters. Yet the very fact that Ukraine continues to absorb the blows and remain resilient demonstrates the military leadership's ability to adapt. Without illusions, the Commander-in-Chief does everything possible to raise the cost of continued aggression and exhaust enemy resources. The illusions are gone; only the hard determination to stand to the end remains."
 UKR_sirskyy_standardize_uav_experience: "Standardize UAV Combat Experience"
 UKR_sirskyy_standardize_uav_experience_desc: "The experience of a prolonged campaign has brought a harsh axiom to the forefront: amid manpower shortages and demographic challenges, technological superiority becomes one of the main keys to victory. The creation of the Unmanned Systems Forces is a historic step that moves UAV employment from volunteer initiatives into a standardized state doctrine. From now on, unmanned systems are not merely an auxiliary tool, but a full-fledged and independent branch of the armed forces. Commander-in-Chief Oleksandr Syrskyi's doctrine calls for the complete integration of drones into the army's unified combat system. This ecosystem covers the entire spectrum of missions, from precision work by assault FPV drones and tactical reconnaissance at the forward edge to strategic strikes by heavy unmanned aircraft against military factories and arsenals deep in the Russian rear. The asymmetric destruction of the aggressor's military potential from the air makes it possible to wear down the enemy while preserving the irreplaceable lives of Ukrainian soldiers. This is a new stage in the art of war, with the Unmanned Systems Forces becoming a decisive factor of superiority that permanently changes the rules of the battlefield."
 UKR_sirskyy_recon_strike_uav_operator_groups: "Reconnaissance-Strike UAV Operator Groups"
 UKR_sirskyy_recon_strike_uav_operator_groups_desc: "While the broader architecture of the Unmanned Systems Forces carries out strategic missions up to the systematic destruction of the aggressor's military-industrial potential, another highly effective mechanism operates at the forward edge: advanced reconnaissance-strike groups. These are specialized units whose tactics are based on a unified fire loop in which a target is struck in the same minute it is detected. Optical and thermal reconnaissance drones provide continuous real-time monitoring of the battlefield. They precisely reveal the movement of enemy infantry, armored-vehicle staging areas, concealed command posts, and logistics hubs. Immediately after a target is identified, the strike chain closes: swarms of assault FPV drones and heavy night bombers such as the “Baba Yaga” deliver devastating fire. Today, this strict specialization increasingly defines battlefield success. Properly distributing operators and equipment among specialized strike groups provides maximum lethality and flexibility, leaving behind the cumbersome concept of universal units whose dispersed capabilities inevitably reduce combat effectiveness."
 UKR_sirskyy_hold_front_at_any_cost: "Hold the Front at Any Cost"
 UKR_sirskyy_hold_front_at_any_cost_desc: "Under different circumstances, Oleksandr Syrskyi's reforms could provide an ideal foundation for the rapid liberation of Ukrainian territory. But the harsh logic of numbers dictates otherwise: the enemy surpasses us quantitatively, on some axes qualitatively, and possesses a vastly greater margin for absorbing mistakes. Its tolerance for losses is far higher than ours. Unmanned systems, elite assault units, and unified fire loops are therefore, above all, instruments of containment in our present situation. Under critical pressure on the defensive line, assault troops acting as firefighters are committed every day, often without the luxury of rest or rotation. As the army closes one breach in the front, threats inevitably arise elsewhere. Every kilometer of home territory lost and every soldier killed or severely wounded is a painful blow to society and creates immense pressure on the country's leadership. But Commander-in-Chief Oleksandr Syrskyi is not a politician. His military task is absolutely clear and uncompromising: hold the front. By applying severe and uncompromisingly pragmatic methods, he carries out that mission."
