 EAST_SHOWDOWN_2023_06_01_NAME: "Летняя кампания"
 EAST_SHOWDOWN_2023_06_01_DESC: "1 июня 2023 года — Летняя кампания\n\nПосле тяжёлой зимы обе стороны готовятся к новым боям. На юге и востоке Украины противостоящие армии занимают позиции вдоль протяжённой линии фронта.\n\nЛето станет следующим испытанием для войск, снабжения и резервов."
 ES_2023_06_01_COUNTRY_DESC: "1 июня 2023 года. Начинается новая летняя кампания."
