l_russian:
 raid_category_ammo_depot_strikes: "Удар по полевым складам"
 raid_category_header_ammo_depot_strikes: "Удары по полевым складам"
 tooltip_raid_category_ammo_depot_strikes: "§HУдары по полевым складам§!\nРакетный удар по полевым складам боеприпасов противника в области, где стоят его расходующие боеприпасы субюниты."
 raid_category_fluff_text_ammo_depot_strikes: "§LРакетные войска и артиллерия§!"
 raid_type_ammo_depot_strike: "Удар по полевым складам"
 raid_type_ammo_depot_strike_desc: "Ракетный удар по полевым складам боеприпасов в области. Потери зависят от числа артиллерийских субюнитов противника в области и заполненности его складов. Дивизии противника в области получают штраф к атаке, защите и прорыву. Удар тратит 4 ракеты."
 success_modifier_ammo_depot_countermeasures: "§Hмеры защиты складов§! противника"
 success_modifier_ammo_depot_countermeasures_counterplay: "- Принять решения защиты полевых складов"
 success_modifier_ammo_depot_counter_battery: "§Hохота за пусковыми установками§! противника"
 success_modifier_ammo_depot_counter_battery_counterplay: "- Принять решения охоты за пусковыми установками"
 ammo_depot_strike_missiles_tt: "Тратится §Y4§! ракеты."
 ammo_depot_strike_counter_battery_tt: "Противник накрыл ракетную площадку: тратится §Y4§! ракеты, крыло теряет ещё §R25%§! ракет."
 ammo_depot_strike_victim_tt: "Уничтожена часть полевых складов боеприпасов в области. Дивизии в области получают штраф к атаке, защите и прорыву."
 ammo_depot_strike_1: "Удар по полевым складам: 1 ступень"
 ammo_depot_strike_2: "Удар по полевым складам: 2 ступень"
 ammo_depot_strike_3: "Удар по полевым складам: 3 ступень"
 ammo_depot_strike_4: "Удар по полевым складам: 4 ступень"
 ammo_depot_strike_5: "Удар по полевым складам: 5 ступень"
 ammo_depot.1.t: "Удары по полевым складам"
 ammo_depot.1.d: "Противник наносит ракетные удары по нашим полевым складам боеприпасов. Удары нарушают логистику и уничтожают запасы на передовой. Командование должно принять меры, чтобы снизить ущерб от будущих ударов."
 ammo_depot.1.a: "Принять меры"
 ammo_depot_protection_category: "Защита полевых складов"
 ammo_depot_protection_category_desc: "Меры против ракетных ударов по полевым складам боеприпасов.\n\nСтойкость складов: §G[?ammo_depot_strike_resist|%0]§! (потери и штраф от удара снижены на эту долю)\nСнижение шанса успеха ударов противника: §G[?ammo_depot_strike_chance_malus|%0]§!\nШанс ответного удара по ракетным площадкам противника: §G[?ammo_depot_counter_chance|%0]§!"
 ammo_depot_protection_mission: "Защитить полевые склады"
 ammo_depot_protection_mission_desc: "Примите не меньше §Y7§! решений защиты полевых складов. Иначе армия получит штрафы на §Y90§! дней."
 ammo_depot_dispersal: "Рассредоточение полевых складов"
 ammo_depot_dispersal_desc: "Много малых складов вместо крупных: один удар уничтожает меньше."
 ammo_depot_relocation: "Относ складов от линии фронта"
 ammo_depot_relocation_desc: "Склады за пределами досягаемости ракет РСЗО. Подвоз к фронту становится длиннее."
 ammo_depot_wheeled_delivery: "Подвоз «с колёс»"
 ammo_depot_wheeled_delivery_desc: "Боеприпасы доставляются сразу на позиции, без крупных складов. Подвозить приходится чаще."
 ammo_depot_bunkers: "Заглублённые хранилища и капониры"
 ammo_depot_bunkers_desc: "Инженерная защита складов. Инженерные части заняты, строительство идёт медленнее."
 ammo_depot_separate_storage: "Раздельное хранение"
 ammo_depot_separate_storage_desc: "Заряды хранятся отдельно от снарядов: детонация не идёт цепочкой."
 ammo_depot_fire_protection: "Противопожарная защита складов"
 ammo_depot_fire_protection_desc: "Пожарные расчёты и валы против детонации."
 ammo_depot_camouflage: "Маскировка и ложные склады"
 ammo_depot_camouflage_desc: "Противник тратит ракеты на пустышки."
 ammo_depot_air_defense: "Прикрытие складов ПВО"
 ammo_depot_air_defense_desc: "Средства ПВО прикрывают склады от ракет."
 ammo_depot_electronic_warfare: "РЭБ против спутниковой навигации"
 ammo_depot_electronic_warfare_desc: "Подавление спутниковой навигации управляемых ракет."
 ammo_depot_counterintelligence: "Контрразведка и режим связи"
 ammo_depot_counterintelligence_desc: "Поиск наводчиков и запрет мобильных телефонов в частях."
 ammo_depot_restricted_zone: "Ограничение доступа в прифронтовую зону"
 ammo_depot_restricted_zone_desc: "Эвакуация жителей и пропускной режим у складов."
 ammo_depot_launcher_hunt: "Охота за пусковыми установками"
 ammo_depot_launcher_hunt_desc: "Контрбатарейная борьба и удары авиации по районам пуска."
 ammo_depot_drone_recon: "Беспилотная разведка пусковых"
 ammo_depot_drone_recon_desc: "Разведывательные БПЛА ищут пусковые установки противника."
 ammo_depot_logistics_protection: "Единая система защиты тыловой логистики"
 ammo_depot_logistics_protection_desc: "Меры защиты полевых складов сведены в единую систему."
 ammo_depot_logistics_failure_1: "Уязвимые полевые склады"
 ammo_depot_logistics_failure_1_desc: "Армия не успела защитить полевые склады от ракетных ударов."
 ammo_depot_logistics_failure_2: "Разрушенная фронтовая логистика"
 ammo_depot_logistics_failure_2_desc: "$ammo_depot_logistics_failure_1_desc$"
 ammo_depot_logistics_failure_3: "Снарядный голод"
 ammo_depot_logistics_failure_3_desc: "$ammo_depot_logistics_failure_1_desc$"
 ammo_depot_cost_xp_25: "£army_experience §Y25§!"
 ammo_depot_cost_xp_50: "£army_experience §Y50§!"
