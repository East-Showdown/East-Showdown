l_russian:
 raid_category_ammo_depot_strikes: "Удар по полевым складам"
 raid_category_header_ammo_depot_strikes: "Удары по полевым складам"
 tooltip_raid_category_ammo_depot_strikes: "§HУдары по полевым складам§!\nУдар ракетами или БПЛА по полевым складам боеприпасов противника в области, где стоят его расходующие боеприпасы субюниты."
 raid_category_fluff_text_ammo_depot_strikes: "§LРакетные войска и артиллерия§!"
 raid_type_ammo_depot_strike_rc: "Нанести удар крылатыми ракетами по полевым складам"
 raid_type_ammo_depot_strike_rc_desc: "Удар по полевым складам боеприпасов в области. Потери зависят от числа артиллерийских субюнитов противника в области и заполненности его складов. Дивизии противника в области получают штраф к атаке и защите. Крыло тратится полностью."
 raid_type_ammo_depot_strike_bl: "Нанести удар баллистическими ракетами по полевым складам"
 raid_type_ammo_depot_strike_bl_desc: "Удар по полевым складам боеприпасов в области. Потери зависят от числа артиллерийских субюнитов противника в области и заполненности его складов. Дивизии противника в области получают штраф к атаке и защите. Крыло тратится полностью."
 raid_type_ammo_depot_strike_drone: "Нанести удар c помощью БПЛА по полевым складам"
 raid_type_ammo_depot_strike_drone_desc: "Удар по полевым складам боеприпасов в области. Потери зависят от числа артиллерийских субюнитов противника в области и заполненности его складов. Дивизии противника в области получают штраф к атаке и защите. Крыло тратится полностью."
 success_modifier_ammo_depot_countermeasures: "§Hмеры защиты складов§! противника"
 success_modifier_ammo_depot_countermeasures_counterplay: "- Принять решения защиты полевых складов"
 success_modifier_ammo_depot_countermeasures_source: "$VAL|H%0$ от мер защиты складов противника"
 success_modifier_ammo_depot_counter_battery: "§Hохота за пусковыми установками§! противника"
 success_modifier_ammo_depot_counter_battery_counterplay: "- Принять решения охоты за пусковыми установками"
 success_modifier_ammo_depot_counter_battery_source: "$VAL|H%0$ от охоты противника за пусковыми установками"
 ammo_depot_strike_1: "Удар по полевым складам: 1 ступень"
 ammo_depot_strike_2: "Удар по полевым складам: 2 ступень"
 ammo_depot_strike_3: "Удар по полевым складам: 3 ступень"
 ammo_depot_strike_4: "Удар по полевым складам: 4 ступень"
 ammo_depot_strike_5: "Удар по полевым складам: 5 ступень"
 ammo_depot.1.t: "Удары по полевым складам"
 ammo_depot.1.d: "Противник наносит ракетные удары по нашим полевым складам боеприпасов. Удары нарушают логистику и уничтожают запасы на передовой. Командование должно принять меры, чтобы снизить ущерб от будущих ударов."
 ammo_depot.1.a: "Принять меры"
 ammo_depot.2.t: "Полевые склады не защищены"
 ammo_depot.2.d: "Срок, отведённый на защиту полевых складов, истёк. Принято решений: [?ammo_depot_decisions_taken|0] из 7. Удары противника продолжают разрушать фронтовую логистику, и армия расплачивается за промедление."
 ammo_depot.2.a: "Придётся воевать с тем, что есть"
 ammo_depot.3.t: "Единая система защиты тыловой логистики"
 ammo_depot.3.d: "Все меры защиты полевых складов приняты и сведены в единую систему. Рассредоточенные и укрытые склады, ПВО, РЭБ и охота за пусковыми установками делают удары противника по нашей логистике куда менее действенными."
 ammo_depot.3.a: "Отлично"
 ammo_depot_protection_category: "Атака и защита полевых складов"
 ammo_depot_protection_category_desc: "Стойкость наших складов: §G[?ammo_depot_strike_resist|%0]§! (снижение потерь и штрафов от ударов)\nШанс успеха ударов по нашим складам: [GET_ammo_depot_chance_malus]\nШанс срыва ударов противника по нашим складам: §G[?ammo_depot_counter_chance|%0]§!\n\n§HОтчёт по последним ударам противника:§!\n  За всё время: §R[?ammo_depot_in_hits|0]§! [GET_ammo_depot_in_hits_word] (§R[GET_ammo_depot_in_loss_total]§! ед); §G[?ammo_depot_in_misses|0]§! [GET_ammo_depot_in_misses_word]\n[GET_ammo_depot_in_report]\n\n§HОтчёт по нашим последним ударам:§!\n  За всё время: §G[?ammo_depot_out_hits|0]§! [GET_ammo_depot_out_hits_word] (§G[GET_ammo_depot_out_loss_total]§! ед); §R[?ammo_depot_out_misses|0]§! [GET_ammo_depot_out_misses_word]\n[GET_ammo_depot_out_report]\n\nПредпринятые меры по защите складов: [GET_ammo_depot_measures]"
