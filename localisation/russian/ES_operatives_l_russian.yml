l_russian:
 OPERATION_TOKEN_INFILTRATED_DRG: "Внедрена наша ДРГ"
 OPERATION_TOKEN_INFILTRATED_DRG_DESC: "ДРГ = \"диверсионно-разведывательная группа\" С её помощью мы можем нанести удары по стратегической инфраструктуре противника и подорвать добычу ресурсов. В большинстве случаев после выполнения операции, ДРГ возвращается на свою территорию."
 lar_operative_event.1.t: "Агент захвачен"
 lar_operative_event.1.desc: "Находясь за линией фронта, [This.GetName] был(а) задержан(а) контрразведкой [From.From.GetAdjective]. По данным из других источников, [This.GetSheHe] содержится в удалённом месте для допроса. Хотя мы верим, что [This.GetSheHe] будет сопротивляться допросу как можно дольше, вероятно, что враг в конечном счёте получит полезную информацию, если [This.GetSheHe] не будет спасён(а) или убит(а) до того, как сломается."
 lar_operative_event.1.a: "Мы должны организовать спасательную операцию!"
 lar_operative_event.2.t: "Агент вынужден скрываться"
 lar_operative_event.2.desc: "Во время выполнения задания в [From.From.GetNameDef] [This.GetName] был(а), очевидно, обнаружен(а) контрразведкой [From.From.GetAdjective]. В последнем сообщении [This.GetSheHe] говорил(а), что заметил(а) слежку и намерен(а) действовать по процедуре уклонения и побега.\n\nКак часть этих процедур, [This.GetName] прервёт контакт со своими кураторами, чтобы не скомпрометировать их.\n\nЕсли всё пройдёт успешно, [This.GetName] свяжется с нами через несколько недель."
 lar_operative_event.2.a: "Нам остаётся лишь ждать и надеяться."
 lar_operative_event.3.t: "Агент убит"
 lar_operative_event.3.desc: "Похоже, что [This.GetName], один из наших агентов в [From.From.GetNameDef], принёс высшую жертву и погиб при исполнении долга. Данных из источников [From.From.GetAdjective] мало, но, судя по всему, [This.GetSheHe] находился(ась) под наблюдением контрразведки [From.From.GetAdjective]. Вероятно, [This.GetSheHe] предстояло быть захваченным(ой), и [This.GetSheHe] либо выбрал(а) смерть, чтобы не выдать важную информацию на допросе, либо был(а) убит(а) агентами [From.From.GetAdjective] при сопротивлении аресту."
 lar_operative_event.3.a: "Герой, призванный к последнему упокоению."
 lar_operative_event.4.t: "Агент ранен"
 lar_operative_event.4.desc: "После опасной встречи с контрразведкой [From.From.GetAdjective] [This.GetName] сообщил(а), что выйдет из строя на некоторое время, чтобы залечить ранения, полученные [This.GetHerHis] в борьбе с попыткой задержания.\n\nСейчас [This.GetName] находится в безопасном месте и будет недоступен(на) несколько недель, пока [This.GetSheHe] восстанавливается."
 lar_operative_event.4.a: "[This.GetSheHe] скоро вернётся в строй."
 lar_operative_event.5.t: "Вражеский агент перевербован"
 lar_operative_event.5.desc: "Наша контрразведка добилась крупного успеха: после длительного допроса и разъяснения вероятной судьбы в случае обвинения в шпионаже, захваченный агент [From.From.GetAdjective] [This.GetName] согласился сотрудничать с нами в обмен на полную амнистию.\n\nБлагодаря глубокому знанию внутренней работы разведслужб [From.From.GetAdjective], [This.GetSheHe], без сомнения, внедрится в [From.From.GetNameDef] гораздо легче и не будет обнаружен(а) контрразведкой [From.From.GetAdjective]."
 lar_operative_event.5.a: "Но мы ожидали, что [This.GetSheHe] умрёт?"
 lar_operative_event.6.t: "Захвачен агент [From.GetAdjective]!"
 lar_operative_event.6.desc: "[This.GetName] был(а) пойман(а) при попытке внедриться в нашу администрацию и утечь информацию своему руководству. Под допросом [This.GetSheHe] признал(а) себя иностранным агентом разведки [From.GetAgency], действующим на территории [From.From.GetAdjective]. Пока неизвестно, какой интерес [From.GetAdjective] к нашей стране и какие части нашей администрации уже были раскрыты. С [This.GetName] в нашей власти мы можем лишь надеяться, что [This.GetSheHe] в конце концов раскроет всё, что нам нужно знать об операциях [From.GetAdjective] в [From.From.GetNameDef]."
 lar_operative_event.6.a: "У нас есть способы заставить вас говорить."
 lar_fake_intel_units.1.t: "Роспуск отвлекающих соединений"
 lar_fake_intel_units.1.d: "Отвлекающие соединения, созданные для введения противника в заблуждение, выполнили свою задачу и расформировываются."