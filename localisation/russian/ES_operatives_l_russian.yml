l_russian:
 OPERATION_TOKEN_INFILTRATED_DRG: "Внедрена наша ДРГ"
 OPERATION_TOKEN_INFILTRATED_DRG_DESC: "ДРГ = \"диверсионно-разведывательная группа\" С её помощью мы можем нанести удары по стратегической инфраструктуре противника и подорвать добычу ресурсов. В большинстве случаев после выполнения операции, ДРГ возвращается на свою территорию."
 lar_operative_event.1.t: "Агент захвачен"
 lar_operative_event.1.desc: "Находясь за линией фронта, [This.GetName] был(а) задержан(а) контрразведкой [From.From.GetAdjective]. По данным из других источников, [This.GetSheHe] содержится в удалённом месте для допроса. Хотя мы верим, что [This.GetSheHe] будет сопротивляться допросу как можно дольше, вероятно, что враг в конечном счёте получит полезную информацию, если [This.GetSheHe] не будет спасён(а) или убит(а) до того, как сломается."
 lar_operative_event.1.a: "Мы должны организовать спасательную операцию!"
 lar_operative_event.2.t: "Агент вынужден скрываться"
 lar_operative_event.2.desc: "Во время выполнения задания в [From.From.GetNameDef] [This.GetName] был(а), очевидно, обнаружен(а) контрразведкой [From.From.GetAdjective]. В последнем сообщении [This.GetSheHe] говорил(а), что заметил(а) слежку и намерен(а) действовать по процедуре уклонения и побега.\n\nКак часть этих процедур, [This.GetName] прервёт контакт со своими кураторами, чтобы не скомпрометировать их.\n\nЕсли всё пройдёт успешно, [This.GetName] свяжется с нами через несколько недель."
 lar_operative_event.2.a: "Нам остаётся лишь ждать и надеяться."
 lar_operative_event.3.t: "Агент убит"
 lar_operative_event.3.desc: "Похоже, что [This.GetName], один из наших агентов в [From.From.GetNameDef], принёс высшую жертву и погиб при исполнении долга. Данных из источников [From.From.GetAdjective] мало, но, судя по всему, [This.GetSheHe] находился(ась) под наблюдением контрразведки [From.From.GetAdjective]. Вероятно, [This.GetSheHe] предстояло быть захваченным(ой), и [This.GetSheHe] либо выбрал(а) смерть, чтобы не выдать важную информацию на допросе, либо был(а) убит(а) агентами [From.From.GetAdjective] при сопротивлении аресту."
 lar_operative_event.3.a: "Герой, призванный к последнему упокоению."
 lar_operative_event.4.t: "Агент ранен"
 lar_operative_event.4.desc: "После опасной встречи с контрразведкой [From.From.GetAdjective] [This.GetName] сообщил(а), что выйдет из строя на некоторое время, чтобы залечить ранения, полученные [This.GetHerHis] в борьбе с попыткой задержания.\n\nСейчас [This.GetName] находится в безопасном месте и будет недоступен(на) несколько недель, пока [This.GetSheHe] восстанавливается."
 lar_operative_event.4.a: "[This.GetSheHe] скоро вернётся в строй."
 lar_operative_event.5.t: "Вражеский агент перевербован"
 lar_operative_event.5.desc: "Наша контрразведка добилась крупного успеха: после длительного допроса и разъяснения вероятной судьбы в случае обвинения в шпионаже, захваченный агент [From.From.GetAdjective] [This.GetName] согласился сотрудничать с нами в обмен на полную амнистию.\n\nБлагодаря глубокому знанию внутренней работы разведслужб [From.From.GetAdjective], [This.GetSheHe], без сомнения, внедрится в [From.From.GetNameDef] гораздо легче и не будет обнаружен(а) контрразведкой [From.From.GetAdjective]."
 lar_operative_event.5.a: "Но мы ожидали, что [This.GetSheHe] умрёт?"
 lar_operative_event.6.t: "Захвачен агент [From.GetAdjective]!"
 lar_operative_event.6.desc: "[This.GetName] был(а) пойман(а) при попытке внедриться в нашу администрацию и утечь информацию своему руководству. Под допросом [This.GetSheHe] признал(а) себя иностранным агентом разведки [From.GetAgency], действующим на территории [From.From.GetAdjective]. Пока неизвестно, какой интерес [From.GetAdjective] к нашей стране и какие части нашей администрации уже были раскрыты. С [This.GetName] в нашей власти мы можем лишь надеяться, что [This.GetSheHe] в конце концов раскроет всё, что нам нужно знать об операциях [From.GetAdjective] в [From.From.GetNameDef]."
 lar_operative_event.6.a: "У нас есть способы заставить вас говорить."
 lar_fake_intel_units.1.t: "Роспуск отвлекающих соединений"
 lar_fake_intel_units.1.d: "Отвлекающие соединения, созданные для введения противника в заблуждение, выполнили свою задачу и расформировываются."
 OPERATION_TOKEN_ES_CIVILIAN_2: "Внедрена гражданская агентура II"
 OPERATION_TOKEN_ES_CIVILIAN_2_DESC: "Расширенная сеть в гражданской администрации противника. Открывает диверсии на энергетике."
 OPERATION_TOKEN_ES_CIVILIAN_3: "Внедрена гражданская агентура III"
 OPERATION_TOKEN_ES_CIVILIAN_3_DESC: "Глубоко законспирированная агентура в промышленных и энергетических кругах. Открывает удары по крупным объектам."
 OPERATION_TOKEN_ES_ARMY_2: "Внедрена армейская агентура II"
 OPERATION_TOKEN_ES_ARMY_2_DESC: "Дополнительные источники в штабах и частях противника."
 OPERATION_TOKEN_ES_ARMY_3: "Внедрена армейская агентура III"
 OPERATION_TOKEN_ES_ARMY_3_DESC: "Агентура в высшем командовании. Открывает операции против системы управления войсками."
 OPERATION_TOKEN_ES_AIRFORCE_2: "Внедрена авиационная агентура II"
 OPERATION_TOKEN_ES_AIRFORCE_2_DESC: "Источники на авиабазах и в ПВО противника. Открывают диверсии против РЛС."
 OPERATION_TOKEN_ES_AIRFORCE_3: "Внедрена авиационная агентура III"
 OPERATION_TOKEN_ES_AIRFORCE_3_DESC: "Глубокая агентура в военно-воздушных силах противника."
 OPERATION_TOKEN_ES_INFO: "Внедрена информационная сеть I"
 OPERATION_TOKEN_ES_INFO_DESC: "Каналы распространения информации и влияния. Открывают политическое и дипломатическое давление."
 OPERATION_TOKEN_ES_INFO_2: "Внедрена информационная сеть II"
 OPERATION_TOKEN_ES_INFO_2_DESC: "Разветвлённая сеть медиа и общественных связей. Открывает контроль торговли."
 OPERATION_TOKEN_ES_INFO_3: "Внедрена информационная сеть III"
 OPERATION_TOKEN_ES_INFO_3_DESC: "Контроль над ключевыми информационными потоками. Открывает максимальное политическое давление."
 operation_ES_infiltrate_civilian_2: "Расширить гражданскую агентуру"
 operation_ES_infiltrate_civilian_2_desc: "§LВнедрение дополнительных агентов в гражданскую администрацию противника. Требуется гражданская агентура I уровня.§!"
 operation_ES_infiltrate_civilian_3: "Создать глубокую гражданскую сеть"
 operation_ES_infiltrate_civilian_3_desc: "§LДолгосрочное внедрение в промышленные и энергетические круги противника. Требуется гражданская агентура II уровня.§!"
 operation_ES_infiltrate_army_2: "Расширить армейскую агентуру"
 operation_ES_infiltrate_army_2_desc: "§LНовые источники в штабах и частях противника. Требуется армейская агентура I уровня.§!"
 operation_ES_infiltrate_army_3: "Внедриться в командование армии"
 operation_ES_infiltrate_army_3_desc: "§LАгентура в высшем командовании противника. Требуется армейская агентура II уровня.§!"
 operation_ES_infiltrate_airforce_2: "Расширить авиационную агентуру"
 operation_ES_infiltrate_airforce_2_desc: "§LИсточники на авиабазах и в ПВО противника. Требуется авиационная агентура I уровня.§!"
 operation_ES_infiltrate_airforce_3: "Внедриться в штаб ВВС"
 operation_ES_infiltrate_airforce_3_desc: "§LГлубокая агентура в военно-воздушных силах противника. Требуется авиационная агентура II уровня.§!"
 operation_ES_infiltrate_info_1: "Создать информационную сеть"
 operation_ES_infiltrate_info_1_desc: "§LВербовка журналистов, чиновников и общественных деятелей противника. Требуется гражданская агентура I уровня.§!"
 operation_ES_infiltrate_info_2: "Расширить информационную сеть"
 operation_ES_infiltrate_info_2_desc: "§LРазветвлённая сеть медиа и связей с общественностью. Требуется информационная сеть I уровня.§!"
 operation_ES_infiltrate_info_3: "Установить контроль над информацией"
 operation_ES_infiltrate_info_3_desc: "§LКонтроль над ключевыми информационными потоками противника. Требуется информационная сеть II уровня.§!"
 operation_ES_infiltrate_info_1_iw_tt: "Наше информационное влияние возрастёт на §Y3%§!."
 operation_ES_infiltrate_info_2_iw_tt: "Наше информационное влияние возрастёт на §Y5%§!."
 operation_ES_infiltrate_info_3_iw_tt: "Наше информационное влияние возрастёт на §Y8%§!."
 operation_ES_sabotage_transformer: "Диверсия: трансформаторная подстанция"
 operation_ES_sabotage_transformer_desc: "§LПодрыв малой трансформаторной подстанции противника. Требуется гражданская агентура II уровня и состояние войны.§!"
 operation_ES_sabotage_powerplant: "Диверсия: электростанция"
 operation_ES_sabotage_powerplant_desc: "§LУдар по крупной электростанции противника. Требуется гражданская агентура III уровня и состояние войны.§!"
 operation_ES_sabotage_radar: "Диверсия: РЛС"
 operation_ES_sabotage_radar_desc: "§LВывод из строя радиолокационной станции противника в выбранном регионе. Требуется авиационная агентура II уровня и состояние войны.§!"
 operation_ES_strike_command: "Удар по системе управления"
 operation_ES_strike_command_desc: "§LАтака на штабы и систему управления войсками противника. Требуется армейская агентура III уровня и состояние войны.§!"
 operation_ES_political_pressure_1: "Политическое давление"
 operation_ES_political_pressure_1_desc: "§LКомпрометирующие материалы и информационные вбросы ослабляют власть противника. Требуется информационная сеть I уровня.§!"
 operation_ES_political_pressure_2: "Масштабное политическое давление"
 operation_ES_political_pressure_2_desc: "§LСкоординированная кампания в медиа противника. Требуется информационная сеть II уровня.§!"
 operation_ES_political_pressure_3: "Тотальное политическое давление"
 operation_ES_political_pressure_3_desc: "§LПолномасштабная информационная операция против руководства противника. Требуется информационная сеть III уровня.§!"
 operation_ES_diplomatic_pressure: "Дипломатическое давление"
 operation_ES_diplomatic_pressure_desc: "§LАгенты влияния оказывают давление на противника, нанося потери его сети разведки. Требуется информационная сеть I уровня.§!"
 operation_ES_trade_control: "Контроль торговли"
 operation_ES_trade_control_desc: "§LПерехват скрытых связей и дезорганизация сети разведки противника. Требуется информационная сеть II уровня.§!"
 operation_ES_sabotage_transformer_tt: "Подстанция [From.From.GetName] выведена из строя, снабжение и производство нарушены."
 operation_ES_sabotage_transformer_2_tt: "Подстанция [From.From.GetName] уничтожена, промышленность несёт тяжёлые потери."
 operation_ES_sabotage_powerplant_tt: "Электростанция [From.From.GetName] повреждена, регион испытывает перебои с энергией."
 operation_ES_sabotage_powerplant_2_tt: "Электростанция [From.From.GetName] разрушена, промышленность региона парализована."
 operation_ES_sabotage_radar_tt: "РЛС противника в регионе [From.From.GetName] выведена из строя, его воздушное наблюдение ослаблено."
 operation_ES_sabotage_radar_2_tt: "РЛС противника в регионе [From.From.GetName] уничтожена, воздушное наблюдение серьёзно нарушено."
 operation_ES_strike_command_tt: "Удар дезорганизует взаимодействие [From.GetName], нанося тяжёлые потери его сети разведки."
 operation_ES_strike_command_2_tt: "Непрерывные удары ввергают командование [From.GetName] в хаос и парализуют его сеть разведки."
 operation_ES_political_pressure_1_tt: "[From.GetName] теряет политическую власть."
 operation_ES_political_pressure_1_2_tt: "Политический кризис в [From.GetName] углубляется."
 operation_ES_political_pressure_2_tt: "Политическое влияние [From.GetName] серьёзно подорвано."
 operation_ES_political_pressure_2_2_tt: "Власть [From.GetName] теряет контроль над ситуацией."
 operation_ES_political_pressure_3_tt: "Политическая система [From.GetName] на грани кризиса."
 operation_ES_political_pressure_3_2_tt: "[From.GetName] охвачен глубоким политическим кризисом."
 operation_ES_diplomatic_pressure_tt: "Кампания наносит тяжёлые потери сети разведки [From.GetName]."
 operation_ES_diplomatic_pressure_2_tt: "Кампания усиливается, нанося серьёзный урон сети разведки [From.GetName]."
 operation_ES_trade_control_tt: "Операция нарушает скрытые связи [From.GetName], нанося потери его сети разведки."
 operation_ES_trade_control_2_tt: "Операция серьёзно подрывает скрытую инфраструктуру [From.GetName] и парализует его сеть разведки."
 ES_sabotaged_transformer: "Повреждённая подстанция"
 ES_sabotaged_transformer_desc: "Диверсия на трансформаторной подстанции снижает добычу ресурсов и скорость строительства в регионе."
 ES_sabotaged_powerplant: "Разрушенная электростанция"
 ES_sabotaged_powerplant_desc: "Уничтоженная электростанция серьёзно снижает производство и добычу в регионе."
 ES_sabotaged_radar: "Выведенная из строя РЛС"
 ES_sabotaged_radar_desc: "Диверсия против радиолокационной станции ослабляет воздушное обнаружение."
 ES_sabotaged_command: "Дезорганизованное командование"
 ES_sabotaged_command_desc: "Удары по штабам снижают организацию, оборону и планирование войск."
 ES_political_instability: "Политическая нестабильность"
 ES_political_instability_desc: "Информационные операции ослабляют стабильность и прирост политической власти."
 ES_diplomatic_isolation: "Дипломатическая изоляция"
 ES_diplomatic_isolation_desc: "Агенты влияния ухудшают отношение противника к другим странам."
 ES_trade_disruption: "Срыв торговли"
 ES_trade_disruption_desc: "Перехват торговых связей и диверсии нарушают экспорт и экономику противника."
 upgrade_ES_recruitment: "Вербовка"
 upgrade_ES_recruitment_desc: "§LСистематическая вербовка позволяет активнее привлекать вражеских агентов на свою сторону.§!"