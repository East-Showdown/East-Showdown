l_russian:
 ES_bakhmut_campaign: "Бахмутская кампания"
 ES_bakhmut_campaign_desc: "Бои за Бахмут перешли в новую фазу. Здесь будут доступны решения Бахмутской кампании."
 ES_battle_for_bakhmut: "Битва за Бахмут"
 ES_battle_for_bakhmut_desc: "В Бахмуте разворачивается новая кампания."
 bakhmut.700.t: "Начало Бахмутской кампании"
 bakhmut.700.d: "Российские войска закрепились на подступах к Бахмуту и уже неделю удерживают несколько ключевых участков. Бои за город переходят в новую фазу.\n\nУкраинскому командованию предстоит организовать оборону, сохранить пути снабжения и не допустить дальнейшего продвижения противника. Начинается Бахмутская кампания."
 bakhmut.700.a: "Удержать оборону."
 bakhmut.701.t: "Начало Бахмутской кампании"
 bakhmut.701.d: "Российские подразделения в течение недели удерживают занятые позиции на подступах к Бахмуту. Закрепление на этих участках создаёт условия для дальнейших действий на городском направлении.\n\nКомандование приступает к следующему этапу операции. Начинается Бахмутская кампания."
 bakhmut.701.a: "Подготовить дальнейшее наступление."
 bakhmut.702.t: "Начало Бахмутской кампании"
 bakhmut.702.d: "Российские войска закрепились на нескольких участках Бахмутского направления и удерживают их уже неделю. Бои приближаются к новому этапу, в котором штурмовым подразделениям предстоит действовать в плотной городской застройке.\n\nДля ЧВК «Вагнер» начинается Бахмутская кампания. Впереди — подготовка штурмов, обеспечение снабжения и координация действий."
 bakhmut.702.a: "Подготовить штурмовые группы."
 bakhmut.703.t: "Начало Бахмутской кампании"
 bakhmut.703.d: "На Бахмутском направлении российские войска уже неделю удерживают несколько занятых участков. Закрепление на этих позициях открывает новый этап боёв за город.\n\nПодразделениям Донецкой Народной Республики предстоит согласовать действия с российским командованием и подготовиться к участию в Бахмутской кампании."
 bakhmut.703.a: "Согласовать действия подразделений."
 bakhmut.704.t: "Начало Бахмутской кампании"
 bakhmut.704.d: "Российские подразделения закрепились на подступах к Бахмуту, удерживая несколько ключевых участков в течение недели. На этом направлении начинается новая кампания.\n\nКомандованию Луганской Народной Республики предстоит организовать взаимодействие с союзными силами и подготовить поддержку действий на Бахмутском направлении."
 bakhmut.704.a: "Обеспечить взаимодействие."
