l_russian:
 UKR_debug_toggle_donbas_chapter_flag: "Флаг главы: «Битва за Донбасс»"
 UKR_debug_toggle_donbas_chapter_flag_desc: "Включает флаг §YUKR_start_battle_for_donbas§! или снимает его, если он уже включён. Скрывает раннюю главу и переносит главу Донбасса на её место. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_autumn_chapter_flag: "Флаг главы: «Осенний шторм»"
 UKR_debug_toggle_autumn_chapter_flag_desc: "Включает флаг §YUKR_autumn_storm_focus_completed§! или снимает его, если он уже включён. Скрывает главу Донбасса и переносит осеннюю главу на её место. Для правильного расположения должен быть включён флаг главы Донбасса. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_final_push_preparation_flag: "Флаг главы: «Подготовка к финальному рывку»"
 UKR_debug_toggle_final_push_preparation_flag_desc: "Включает флаг §YUKR_prepare_for_final_push_focus_completed§! или снимает его, если он уже включён. Скрывает осеннюю главу и открывает подготовку к наступлению. Для правильного расположения должны быть включены оба предыдущих флага глав. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_take_back_ours_flag: "Флаг главы: «Время возвращать своё»"
 UKR_debug_toggle_take_back_ours_flag_desc: "Включает флаг §YUKR_time_to_take_back_ours_focus_completed§! или снимает его, если он уже включён. Скрывает главу подготовки и открывает фокусы после «Время возвращать своё». Для правильного расположения должны быть включены все три предыдущих флага глав. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_unlock_energy_nightmare_decision: "Флаг ветки: энергетика"
 UKR_unlock_energy_nightmare_decision_desc: "Включает флаг §YUKR_EnergyNightmare§! или снимает его, если он уже включён. Показывает или скрывает ветку восстановления и строительства энергетики слева от основной главы. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_commander_change_flag: "Флаг веток: смена главкома"
 UKR_debug_toggle_commander_change_flag_desc: "Включает флаг §YCIS_Changed§! или снимает его, если он уже включён. Скрывает ранний «План Залужного» и разрешает показ ветки выбранного главкома. Для показа ветки также включите один из пяти флагов главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_zaluzhny_branch_flag: "Флаг главкома: Залужный"
 UKR_debug_toggle_zaluzhny_branch_flag_desc: "Включает флаг §YCIS_Zalyuzhny§! или снимает его, если он уже включён. Показывает ветку Залужного при включённом CIS_Changed. Для просмотра одной ветки снимите флаги остальных главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_sirskyy_branch_flag: "Флаг главкома: Сырский"
 UKR_debug_toggle_sirskyy_branch_flag_desc: "Включает флаг §YCIS_Sirskyy§! или снимает его, если он уже включён. Показывает ветку Сырского при включённом CIS_Changed. Для просмотра одной ветки снимите флаги остальных главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_biletsky_branch_flag: "Флаг главкома: Билецкий"
 UKR_debug_toggle_biletsky_branch_flag_desc: "Включает флаг §YCIS_Biletsky§! или снимает его, если он уже включён. Показывает ветку Билецкого при включённом CIS_Changed. Для просмотра одной ветки снимите флаги остальных главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_prokopenko_branch_flag: "Флаг главкома: Прокопенко"
 UKR_debug_toggle_prokopenko_branch_flag_desc: "Включает флаг §YCIS_Prokopenko§! или снимает его, если он уже включён. Показывает ветку Прокопенко при включённом CIS_Changed. Для просмотра одной ветки снимите флаги остальных главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_drapatiy_branch_flag: "Флаг главкома: Драпатый"
 UKR_debug_toggle_drapatiy_branch_flag_desc: "Включает флаг §YCIS_Drapatiy§! или снимает его, если он уже включён. Показывает ветку Драпатого при включённом CIS_Changed. Для просмотра одной ветки снимите флаги остальных главкомов. Изменяет только этот флаг и сразу обновляет древо фокусов."
 UKR_debug_toggle_new_focus_tree_flag: "Глобальный флаг: альтернативное начало древа"
 UKR_debug_toggle_new_focus_tree_flag_desc: "Включает флаг §YUKR_NEW_FOCUS_TREE§! или снимает его, если он уже включён. Переключает видимость альтернативного начального фокуса и ранней ветки «Восточного кризиса», включая «План Залужного». Изменяет только этот флаг и сразу обновляет древо фокусов."
