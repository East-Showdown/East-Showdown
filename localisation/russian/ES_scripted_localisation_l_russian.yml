 UKR_international_defense_legion_ukraine_localization_key: "Интернациональный легион обороны Украины"
 UKR_Form_47_mekhanizovana_scripted_localisation_localization_key_0: "47-я отдельная механизированная бригада"
 UKR_Form_47_mekhanizovana_desc_scripted_localisation_localization_key_0: "\n\n£GFX_texticon_ukr_47magura\n\n\n\n\n\n47-я отдельная механизированная бригада «Magura» — механизированное подразделение Сухопутных войск, история которого начинается с 47-го отдельного стрелкового батальона, сформированного в начале полномасштабного вторжения. Позже батальон был реорганизован в 47-й штурмовой полк, а к 2023 году полк будет расширен и преобразован в отдельную механизированную бригаду. Первоначально подразделение не планировалось как механизированное, что привело к кадровым перестановкам в командовании.\n\n§YФормирование§!\nБригаде будет суждено стать одним из основных ударных соединений украинского контрнаступления. Личный состав проходил подготовку в Германии, а бригада получила боевые машины пехоты M2 Bradley и танки Leopard 2. Первоначально она должна была получить M1A1 Abrams, однако до их поступления была оснащена Leopard 2 в качестве временного решения."
 UKR_Form_47_mekhanizovana_scripted_localisation_localization_key_1: "Переоснастить танковый батальон 47-й механизированной бригады"
 UKR_Form_47_mekhanizovana_desc_scripted_localisation_localization_key_1: "\n\n£GFX_texticon_ukr_47maguram1\n\n\n\n\n\n«Magura» изначально проектировалась под оснащение техникой, поставляемой США, и не предназначалась для постоянной эксплуатации Leopard 2A6. Однако обучение заняло больше времени, чем ожидалось, а передача M1A1 Abrams не была одобрена вовремя. Немецкие танки стали временным решением.\n\n§YПереоснащение танкового батальона§!\nВременное использование Leopard 2A6 завершено. Эти танки переданы в состав 21-й механизированной бригады. Танковый батальон 47-й бригады получит M1A1 Abrams — технику, под которую соединение готовили изначально. Официальные представители бригады подтвердили поступление этих танков на вооружение."
 RUS_status_of_military_equipment_production_standards_scripted_localisation_localization_key_0: "Повысить требования для производства военной техники"
 RUS_status_of_military_equipment_production_standards_scripted_localisation_localization_key_1: "Понизить требования для производства военной техники"
 TRO_REFORMED: "ТРО реформирована"