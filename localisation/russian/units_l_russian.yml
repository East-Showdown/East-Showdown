 hq_support: "Персонал штаба"
 hq_support_desc: "Штабная рота, обеспечивающая управление и поддержку деятельности подразделения."
 hq_engineer: "Персонал инженеров"
 hq_engineer_desc: "Занимается вопросами фортификации, обеспечением мобильности войск и борьбой с мобильными группами противника."
 hq_drone_recon: "Разведывательный персонал БПЛА"
 hq_drone_recon_desc: "Собирает и анализирует разведданные, полученные при помощи дронов."
 hq_maintenance: "Персонал планового обслуживания"
 hq_maintenance_desc: "Планирует и осуществляет обслуживание и ремонт на уровне всей армии."
 hq_field_hospital: "Медицинский персонал"
 hq_field_hospital_desc: "Распределяет медикаменты, занимается эффективной эвакуацией и лечением раненных в зоне действия армии."
 hq_logistics: "Персонал логистики и обслуживания"
 hq_logistics_desc: "Перераспределяет припасы и топливо в армии, определяет приоритеты этого распределения."
 hq_signal: "Персонал сигнальщиков и разведчиков"
 hq_signal_desc: "Координирует коммуникацию между армейскими подразделениями, собирает и помогает упорядочить полученные разведданные."
 hq_air_liaison: "Передовой авиадиспетчер"
 hq_air_liaison_desc: "Группы диспетчеров и другие соединения организуют тесное сотрудничество между авиацией и поддерживаемыми наземными войсками."
 hq_sso: "Координация специальных операций"
 hq_sso_desc: "Этот персонал отвечает за планирование и координирование операций войск специального назначения."
 hq_arty: "Координация ударов артиллерии"
 hq_arty_desc: "Этот персонал отвечает за планирование и координирование артиллерийских ударов."
 hq_tank: "Координация применения танков"
 hq_tank_desc: "Этот персонал отвечает за планирование и координирование применения танков."
 hq_imv: "Пехотная охрана штаба на ББM"
 hq_imv_desc: "Небольшой пехотный батальон, отвечающий за охрану штаба. Размещается на ББM для обеспечения мобильности и возможности быстрого реагирования на угрозы."
 hq_apc: "Охрана штаба на БТР"
 hq_apc_desc: "Моторизированная пехота, ускоряющая передвижение штаба. Размещается на БТР для обеспечения мобильности и возможности быстрого реагирования на угрозы."
