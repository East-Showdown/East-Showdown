 # Module descriptions
 sov_aa_light_main_gun_9M33M2_2_desc: "Пакет из 2 ракет 9М33М2 зенитного ракетного комплекса малой дальности 9К33 «Оса» с радиокомандным наведением."
 sov_aa_light_main_gun_9M33M2_4_desc: "Пакет из 4 ракет 9М33М2 зенитного ракетного комплекса малой дальности 9К33 «Оса» с радиокомандным наведением."
 sov_aa_light_main_gun_9M33M2_6_desc: "Пакет из 6 ракет 9М33М2 зенитного ракетного комплекса малой дальности 9К33 «Оса» с радиокомандным наведением."
 sov_aa_light_main_gun_9M33M2_8_desc: "Пакет из 8 ракет 9М33М2 зенитного ракетного комплекса малой дальности 9К33 «Оса» с радиокомандным наведением."
 sov_aa_light_main_gun_9M33M2_12_desc: "Пакет из 12 ракет 9М33М2 зенитного ракетного комплекса малой дальности 9К33 «Оса» с радиокомандным наведением."
 sov_aa_light_main_gun_9M33M3_2_desc: "Пакет из 2 ракет 9М33М3 комплекса «Оса-АКМ» — улучшенная ракета с большей дальностью по низколетящим целям."
 sov_aa_light_main_gun_9M33M3_4_desc: "Пакет из 4 ракет 9М33М3 комплекса «Оса-АКМ» — улучшенная ракета с большей дальностью по низколетящим целям."
 sov_aa_light_main_gun_9M33M3_6_desc: "Пакет из 6 ракет 9М33М3 комплекса «Оса-АКМ» — улучшенная ракета с большей дальностью по низколетящим целям."
 sov_aa_light_main_gun_9M33M3_8_desc: "Пакет из 8 ракет 9М33М3 комплекса «Оса-АКМ» — улучшенная ракета с большей дальностью по низколетящим целям."
 sov_aa_light_main_gun_9M33M3_12_desc: "Пакет из 12 ракет 9М33М3 комплекса «Оса-АКМ» — улучшенная ракета с большей дальностью по низколетящим целям."
 sov_aa_light_main_gun_soldier_with_igla_desc: "Член экипажа с переносным ЗРК 9К38 «Игла» с инфракрасной головкой самонаведения."
 sov_aa_light_main_gun_soldier_with_strela_desc: "Член экипажа с ПЗРК «Стрела» — ранним советским переносным ЗРК с ИК-наведением."
 sov_aa_light_main_gun_soldier_with_verba_desc: "Член экипажа с ПЗРК 9К333 «Верба» — современным комплексом с трёхдиапазонной ГСН, устойчивой к ловушкам."
 sov_aa_medium_main_gun_9M37_desc: "Ракета 9М37 с фотоконтрастной/ИК ГСН зенитного комплекса 9К35 «Стрела-10»."
 sov_aa_medium_main_gun_9M37M_desc: "9М37М — улучшенная ракета «Стрелы-10» с более совершенной ГСН и помехоустойчивостью."
 sov_aa_medium_main_gun_9M333_desc: "Ракета 9М333 комплексов «Стрела-10М3/М4» с трёхканальной ГСН и усиленной боевой частью."
 sov_aa_medium_main_gun_9M311_desc: "Двухступенчатая ракета 9М311 зенитного пушечно-ракетного комплекса 2К22 «Тунгуска»."
 sov_aa_medium_main_gun_9M311M_desc: "9М311М — модернизированная ракета «Тунгуски-М» с увеличенной дальностью и улучшенным взрывателем."
 sov_aa_medium_main_gun_9M3111M_desc: "Ракета 9М311-1М комплекса «Тунгуска-М1» с лазерным неконтактным взрывателем для поражения малых целей."
 sov_aa_medium_main_gun_9M335_desc: "9М335 — малогабаритная ракета ближнего действия «Панциря-СМ», размещается в большом количестве против БПЛА."
 sov_aa_medium_main_gun_57E6E_desc: "Ракета 57Э6Е с радиокомандным наведением зенитного пушечно-ракетного комплекса «Панцирь-С1»."
 sov_aa_medium_main_gun_57E6ME_desc: "57Э6М-Е — улучшенная ракета «Панциря» с увеличенными дальностью и скоростью."
 sov_aa_medium_main_gun_9M331_desc: "Ракета вертикального старта 9М331 зенитного ракетного комплекса 9К331 «Тор-М1»."
 sov_aa_medium_main_gun_9M338_desc: "Ракета 9М338 комплекса «Тор-М2» — более компактная и манёвренная, что позволяет увеличить боекомплект."
