l_russian:

RUS_counter_terrorist_operation_modifier: "Контртеррористическая операция"
RUS_counter_terrorist_operation_modifier_desc: "На территории региона действует режим контртеррористической операции. Вооружённые Силы Российской Федерации, Росгвардия, МВД и ФСБ проводят комплекс мероприятий по обеспечению безопасности населения, нейтрализации диверсионных угроз и защите объектов критической инфраструктуры."

RUS_counter_terrorist_operation_kursk_modifier: "Контртеррористическая операция"
RUS_counter_terrorist_operation_kursk_modifier_desc: "На территории Курской области действует режим контртеррористической операции. Усилены меры безопасности, осуществляется охрана объектов критической инфраструктуры и проводятся мероприятия по нейтрализации диверсионных угроз."

RUS_counter_terrorist_operation_belgorod_modifier: "Контртеррористическая операция"
RUS_counter_terrorist_operation_belgorod_modifier_desc: "На территории Белгородской области действует режим контртеррористической операции. Усилена охрана государственной границы, увеличено присутствие сил правопорядка и подразделений территориальной обороны."

RUS_counter_terrorist_operation_bryansk_modifier: "Контртеррористическая операция"
RUS_counter_terrorist_operation_bryansk_modifier_desc: "На территории Брянской области действует режим контртеррористической операции. Введены дополнительные меры контроля, ограничено перемещение в отдельных районах и усилена защита стратегически важных объектов."

l_russian:

 RUS_KTO_reinforce_army_idea: "Усиление группировки КТО"

 RUS_KTO_reinforce_army_idea_desc: "В регион переброшены дополнительные подразделения Министерства обороны, Росгвардии и резервных сил. Усилена оборона и повышена эффективность действий войск."