 tech_ARV: "БРЭМ"
 reb_1: "Узкополосные комплексы РЭБ"
 reb_1_desc: "Самодельные однодиапазонные подавители, ставившиеся на технику с конца 2022 года и настроенные на частоты 2,4 и 5,8 ГГц коммерческих FPV-дронов. Дёшево и быстро, но бесполезно, как только противник меняет частоту."
 reb_2: "Расширенные системы подавления частот"
 reb_2_desc: "Специализированные бортовые подавители вроде российского «Волнореза» (показан в 2023 году, примерно 0,9–2 ГГц) или украинского Piranha «Купол 360»: антенны на магнитах дают круговое прикрытие основных диапазонов управления FPV и рвут канал за несколько сотен метров."
 reb_3: "Каскадные широкополосные подавители"
 reb_3_desc: "С 2024 года полевые мастерские ставили на крыши башен и «мангалы» сразу несколько подавителей, каждый на свой диапазон, — как на захваченном «танке РЭБ» Т-72Б3М. Широкий охват, но тяжело, прожорливо и заметно."
 reb_4: "Штатный комплекс РЭБ «Тетраэдр»"
 reb_4_desc: "Заводские комплексы РЭБ, встроенные в электронику машины и питающиеся от ВСУ, поэтому работают и при заглушённом двигателе. В 2024 году «Уралвагонзавод» сообщил о штатных средствах РЭБ против дронов на новых танках."
 antidrone_1: "Полевые противодроновые «мангалы»"
 antidrone_1_desc: "Сваренные решётки, брёвна и маты над башней и моторным отделением: грубо, но многие FPV-дроны срабатывают до брони."
 antidrone_2: "Заводские экраны и сетки"
 antidrone_2_desc: "Типовые экраны, сетки и решётки, монтируемые на базах и заводах; закрывают машину целиком, не мешая люкам и приборам."
 antidrone_3: "Комплексная противодроновая защита"
 antidrone_3_desc: "Полное экранирование вместе с обнаружением дронов и дистанционными модулями или ружьями, поражающими дроны до удара."
 antidrone_4: "Полные «черепашьи» навесы"
 antidrone_4_desc: "Самодельные навесы, закрывающие машину целиком. Почти неуязвимы для дронов сверху, но орудие почти не поворачивается, а экипаж наполовину слеп."
