RUS_KTO: "Контртеррористическая операция"

##############################
### Решения
##############################

RUS_KTO_Kursk: "Ввести режим КТО в Курской области"
RUS_KTO_Kursk_desc: "Ввести режим контртеррористической операции на территории Курской области."

RUS_KTO_Belgorod: "Ввести режим КТО в Белгородской области"
RUS_KTO_Belgorod_desc: "Ввести режим контртеррористической операции на территории Белгородской области."

RUS_KTO_Bryansk: "Ввести режим КТО в Брянской области"
RUS_KTO_Bryansk_desc: "Ввести режим контртеррористической операции на территории Брянской области."

##############################
### События — Курская область
##############################

RUS_KTO.1.t: "Контртеррористическая операция"
RUS_KTO.1.d: "В связи с вторжением украинских вооружённых формирований на территорию Курской области принято решение о введении режима контртеррористической операции. Подразделения Вооружённых Сил Российской Федерации, Росгвардии, МВД и ФСБ приступают к выполнению задач по поиску и уничтожению диверсионных групп, обеспечению безопасности населения и восстановлению полного контроля над приграничными районами."
RUS_KTO.1.a: "Приступить к выполнению задач."

RUS_KTO.2.t: "Режим КТО завершён"
RUS_KTO.2.d: "Основные задачи контртеррористической операции на территории Курской области успешно выполнены. Угроза безопасности региона существенно снижена. Режим КТО отменён, органы государственной власти возвращаются к штатному режиму работы."
RUS_KTO.2.a: "Обстановка стабилизирована."

##############################
### События — Белгородская область
##############################

RUS_KTO.3.t: "Контртеррористическая операция"
RUS_KTO.3.d: "В связи с сохраняющейся угрозой безопасности и продолжающимися атаками на территорию Белгородской области принято решение о введении режима контртеррористической операции. Силовые структуры Российской Федерации приступают к проведению комплекса специальных мероприятий по защите населения и обеспечению безопасности региона."
RUS_KTO.3.a: "Приступить к выполнению задач."

RUS_KTO.4.t: "Режим КТО завершён"
RUS_KTO.4.d: "Комплекс мероприятий по обеспечению безопасности Белгородской области завершён. Обстановка стабилизирована, режим контртеррористической операции отменён."
RUS_KTO.4.a: "Обстановка стабилизирована."

##############################
### События — Брянская область
##############################

RUS_KTO.5.t: "Контртеррористическая операция"
RUS_KTO.5.d: "В связи с активизацией диверсионной деятельности в приграничных районах Брянской области принято решение о введении режима контртеррористической операции. Подразделения силовых ведомств приступают к проведению мероприятий по выявлению и нейтрализации угроз, а также обеспечению безопасности гражданского населения."
RUS_KTO.5.a: "Приступить к выполнению задач."

RUS_KTO.6.t: "Режим КТО завершён"
RUS_KTO.6.d: "Контртеррористическая операция на территории Брянской области завершена. Органы государственной власти и силовые структуры переходят к работе в штатном режиме."
RUS_KTO.6.a: "Обстановка стабилизирована."
