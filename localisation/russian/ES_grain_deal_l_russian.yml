l_russian:
 es_grain_deal.1.t: "Россия объявила о выходе из зерновой сделки"
 es_grain_deal.1.d: "17 июля Россия объявила о выходе из зерновой сделки. Заключённое летом 2022 года при посредничестве ООН и Турции соглашение позволило возобновить вывоз продовольствия из украинских портов.\n\nМосква заявила о невыполнении договорённостей по российскому экспорту и отказалась продлевать участие, отозвав гарантии безопасности судоходства. Украинская морская торговля вновь оказалась под угрозой, а ООН предупредила о последствиях для мировой продовольственной безопасности."
 es_grain_deal.1.ukr: "Они доказали, что их не интересует мир"
 es_grain_deal.1.rus: "И какой был смысл в договоре?"
 es_grain_deal.1.nato: "Это была хорошая попытка..."
 es_grain_deal.1.other: "Новый удар по мировой торговле."
 UKR_partial_port_blockade: "Частичная блокада портов"
 UKR_partial_port_blockade_desc: "После прекращения зерновой сделки безопасность морского экспорта больше не гарантирована. Ограничение работы портов сокращает внешнюю торговлю и вынуждает государство направлять дополнительные ресурсы на обеспечение внутреннего рынка."
