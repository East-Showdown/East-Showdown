 RUS_kt_security_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^0|0]%§!"
 RUS_kt_security_authority_tt:0 "§YСиловики§!\nПри 100% лояльности блок даёт 20% устойчивости.\nПри лояльности [?RUS.RUS_kt_loyalty^0|0]% вклад в устойчивость составляет §Y[?RUS.RUS_kt_contributions^0|2]%§!."
 RUS_kt_defence_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^1|0]%§!"
 RUS_kt_defence_authority_tt:0 "§YОборонный комплекс§!\nПри 100% лояльности блок даёт 20% устойчивости.\nПри лояльности [?RUS.RUS_kt_loyalty^1|0]% вклад в устойчивость составляет §Y[?RUS.RUS_kt_contributions^1|2]%§!."
 RUS_kt_technocrats_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^2|0]%§!"
 RUS_kt_technocrats_authority_tt:0 "§YТехнократы§!\nПри 100% лояльности блок даёт 20% устойчивости.\nПри лояльности [?RUS.RUS_kt_loyalty^2|0]% вклад в устойчивость составляет §Y[?RUS.RUS_kt_contributions^2|2]%§!."
 RUS_kt_administration_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^3|0]%§!"
 RUS_kt_administration_authority_tt:0 "Администрация исключена из расчёта устойчивости."
 RUS_kt_generals_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^4|0]%§!"
 RUS_kt_generals_authority_tt:0 "§YГенеральский корпус§!\nПри 100% лояльности блок даёт 20% устойчивости.\nПри лояльности [?RUS.RUS_kt_loyalty^4|0]% вклад в устойчивость составляет §Y[?RUS.RUS_kt_contributions^4|2]%§!."
 RUS_kt_oligarchs_loyalty:0 "Лояльность: §Y[?RUS.RUS_kt_loyalty^5|0]%§!"
 RUS_kt_oligarchs_authority_tt:0 "§YОлигархи§!\nПри 100% лояльности блок даёт 20% устойчивости.\nПри лояльности [?RUS.RUS_kt_loyalty^5|0]% вклад в устойчивость составляет §Y[?RUS.RUS_kt_contributions^5|2]%§!."
 RUS_kt_authority_tt:0 "При 100% лояльности блок даёт 20% устойчивости.\n\nСиловики: [?RUS.RUS_kt_contributions^0|2]%\nОборонный комплекс: [?RUS.RUS_kt_contributions^1|2]%\nТехнократы: [?RUS.RUS_kt_contributions^2|2]%\nГенеральский корпус: [?RUS.RUS_kt_contributions^4|2]%\nОлигархи: [?RUS.RUS_kt_contributions^5|2]%\n\nУстойчивость: §Y[?RUS.RUS_kt_authority|2]%§!\n\n§YОбщая ситуация:§!\nСтабильность: [?RUS.RUS_kt_stability_factor|%+1]\nПрирост политической власти: [?RUS.RUS_kt_political_power_factor|%+1]\n\nУчитываются пять блоков без администрации. Чем выше влияние блока, тем сильнее его вклад. Лояльность и настроение выше 50% дают прибавку, ниже 50% - штраф. При 50% вклад показателя равен нулю.\n\nДля стабильности важнее настроение (70%), для прироста политической власти - лояльность (70%). Остальные 30% в каждом случае даёт второй показатель. Вклады блоков складываются, итог по каждому эффекту - от -15% до +15%."
 RUS_kt_security_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^0|0]%§!"
 RUS_kt_defence_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^1|0]%§!"
 RUS_kt_technocrats_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^2|0]%§!"
 RUS_kt_administration_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^3|0]%§!"
 RUS_kt_generals_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^4|0]%§!"
 RUS_kt_oligarchs_mood:0 "Настроение в блоке: §Y[?RUS.RUS_kt_mood^5|0]%§!"
 RUS_kt_patronage_label:0 "Патронажная сеть"
 RUS_kt_patronage_tt:0 "Система неформальных связей, личной преданности и взаимных обязательств, выстроенная вокруг Владимира Путина. Выступая верховным арбитром между конкурирующими группами влияния, президент распределяет должности, ресурсы и политическое покровительство, обеспечивая зависимость элит от собственной власти. Устойчивость патронажной сети отражает способность Путина сохранять контроль над своим окружением, сдерживать аппаратные противоречия и поддерживать стабильность сложившейся системы."
 RUS_kt_role_tt:0 "Российская политическая элита представляет собой сложную систему конкурирующих групп влияния, каждая из которых стремится укрепить собственные позиции и получить доступ к государственным ресурсам. Владимир Путин выступает главным арбитром в их противостоянии, распределяя полномочия, должности и привилегии между различными центрами силы. Поддерживая баланс интересов и не допуская чрезмерного усиления отдельных группировок, президент сохраняет за собой решающее слово в политических конфликтах. Однако подобная система становится всё более зависимой от его личного авторитета и способности контролировать соперничество элит."
 RUS_kt_influence_instrument:0 "Инструмент влияния"
 RUS_kt_loyalty_tier_0:0 "§YКризис лояльности (0-19%)§!\nПрезидентская власть утрачивает способность обеспечивать надёжное подчинение группы. Её представители могут открыто противодействовать отдельным решениям, искать поддержку конкурирующих центров силы и провоцировать серьёзный политический кризис."
 RUS_kt_loyalty_tier_1:0 "§YНенадёжное подчинение (20-39%)§!\nГруппа всё чаще ставит собственные интересы выше распоряжений политического руководства. Формальная лояльность сохраняется, однако вероятность саботажа, аппаратных интриг и нарушения достигнутых договорённостей возрастает."
 RUS_kt_loyalty_tier_2:0 "§YУсловная лояльность (40-59%)§!\nПодчинение президенту сохраняется, однако внутри группы нарастает стремление отстаивать собственную самостоятельность. Отдельные распоряжения могут встречать скрытое сопротивление, затягивание исполнения и аппаратные возражения."
 RUS_kt_loyalty_tier_3:0 "§YУстойчивая лояльность (60-79%)§!\nГруппа признаёт президентскую власть и в целом следует установленному политическому курсу. Однако при принятии решений, затрагивающих её ключевые интересы, она может добиваться уступок и дополнительных гарантий."
 RUS_kt_loyalty_tier_4:0 "§YБезусловное подчинение (80-100%)§!\nГруппа не ставит под сомнение верховенство президента и практически беспрекословно исполняет его решения. Подобная дисциплина может основываться как на заинтересованности в существующем порядке, так и на страхе потерять своё положение."
 RUS_kt_mood_tier_0:0 "§YКрайнее недовольство (0-19%)§!\nСуществующее положение воспринимается представителями группы как неприемлемое. Накопившиеся противоречия создают предпосылки для открытых аппаратных конфликтов, формирования временных союзов и попыток добиться пересмотра политического баланса."
 RUS_kt_mood_tier_1:0 "§YГлубокое недовольство (20-39%)§!\nГруппа считает, что её интересы систематически игнорируются. Недовольство руководством и существующим распределением влияния усиливает аппаратное соперничество, повышая вероятность конфликтов и жёстких требований."
 RUS_kt_mood_tier_2:0 "§YСкрытое недовольство (40-59%)§!\nВнутри группы усиливается недовольство распределением ресурсов, кадровыми решениями или ограничением полномочий. Её представители начинают настойчивее отстаивать собственные интересы, ожидая от президента уступок."
 RUS_kt_mood_tier_3:0 "§YБлагоприятное настроение (60-79%)§!\nГруппа в целом довольна своим положением, хотя отдельные вопросы продолжают вызывать разногласия. Её представители предпочитают добиваться новых преимуществ путём переговоров и привычных механизмов политического лоббирования."
 RUS_kt_mood_tier_4:0 "§YПолная удовлетворённость (80-100%)§!\nПредставители группы удовлетворены своим положением в политической системе. Их интересы учитываются, а существующее распределение полномочий и ресурсов воспринимается как благоприятное. Оснований для серьёзного аппаратного недовольства практически нет."
 RUS_kt_security_overview_tt:0 "Силовые ведомства составляют одну из опор существующего политического порядка. Обладая широкими полномочиями, доступом к закрытой информации и значительными аппаратными ресурсами, они стремятся укреплять своё положение в государственной иерархии. Несмотря на формальное единство, между отдельными ведомствами сохраняется соперничество за полномочия, финансирование и влияние на президента."
 RUS_kt_security_loyalty_tier_tt:0 "[RUS_kt_security_loyalty_tier]"
 RUS_kt_security_mood_tier_tt:0 "[RUS_kt_security_mood_tier]"
 RUS_kt_defence_overview_tt:0 "Руководители оборонных предприятий и государственных корпораций обладают значительным влиянием на промышленную и военно-техническую политику. Их интересы сосредоточены на расширении государственных заказов, увеличении финансирования и сохранении контроля над производственными ресурсами. Зависимость от государственного бюджета делает их заинтересованными в благосклонности политического руководства."
 RUS_kt_defence_loyalty_tier_tt:0 "[RUS_kt_defence_loyalty_tier]"
 RUS_kt_defence_mood_tier_tt:0 "[RUS_kt_defence_mood_tier]"
 RUS_kt_technocrats_overview_tt:0 "Министерство финансов, экономический блок, государственные управленцы и финансовые институты.\n\nПредставители экономического блока обеспечивают функционирование государственного аппарата, устойчивость финансовой системы и реализацию экономической политики. Опираясь на профессиональную компетентность и управленческий опыт, они стремятся сохранить стабильность и предсказуемость государственных решений. Однако их влияние зачастую ограничивается политическими интересами других групп."
 RUS_kt_technocrats_loyalty_tier_tt:0 "[RUS_kt_technocrats_loyalty_tier]"
 RUS_kt_technocrats_mood_tier_tt:0 "[RUS_kt_technocrats_mood_tier]"
 RUS_kt_administration_overview_tt:0 "Администрация президента выступает главным инструментом координации государственной политики и реализации решений главы государства. Контролируя прохождение поручений, кадровые назначения и взаимодействие с государственными институтами, она обеспечивает функционирование президентской вертикали. Вместе с тем её аппарат остаётся пространством соперничества различных патронажных сетей."
 RUS_kt_administration_loyalty_tier_tt:0 "[RUS_kt_administration_loyalty_tier]"
 RUS_kt_administration_mood_tier_tt:0 "[RUS_kt_administration_mood_tier]"
 RUS_kt_generals_overview_tt:0 "Высшее военное руководство представляет интересы вооружённых сил в системе государственной власти. Обладая профессиональной военной экспертизой и контролем над механизмами военного управления, генералитет стремится обеспечить необходимое финансирование, сохранить ведомственную самостоятельность и влиять на стратегическое планирование. Его интересы не всегда совпадают с интересами политического руководства и оборонной промышленности."
 RUS_kt_generals_loyalty_tier_tt:0 "[RUS_kt_generals_loyalty_tier]"
 RUS_kt_generals_mood_tier_tt:0 "[RUS_kt_generals_mood_tier]"
 RUS_kt_oligarchs_overview_tt:0 "Крупный капитал, государственные подрядчики, сырьевые компании и промышленно-финансовые группы.\n\nКрупнейшие представители российского бизнеса контролируют значительные финансовые, промышленные и инфраструктурные ресурсы. Их положение во многом зависит от отношений с государством, доступа к контрактам и политического покровительства. Стремясь защитить собственность и экономические интересы, они вынуждены учитывать требования политического руководства и конкурировать с другими центрами влияния."
 RUS_kt_oligarchs_loyalty_tier_tt:0 "[RUS_kt_oligarchs_loyalty_tier]"
 RUS_kt_oligarchs_mood_tier_tt:0 "[RUS_kt_oligarchs_mood_tier]"
