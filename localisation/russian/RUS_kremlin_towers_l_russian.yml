 RUS_kt_security_fund_bonus:0 "Увеличить финансирование спецслужб"
 RUS_kt_cost_45:0 "[RUS_kt_cost_45_display]"
 RUS_kt_cost_45_enough:0 "£pol_power §Y45§!"
 RUS_kt_cost_45_short:0 "£pol_power §R45§!"
 RUS_kt_security_fund_tt:0 "§YУвеличить финансирование спецслужб§!\nПрезидент одобряет дополнительное финансирование оперативной работы. Руководители ведомств получают средства на задачи, которые прежде приходилось откладывать до следующего бюджетного года.\nСтоимость: §Y45§! £pol_power \n\nСиловики: влияние §G+3§!\nСиловики: настроение §G+4§!\nСиловики: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YЦель сопротивления§!: §G-4%§!"
 RUS_kt_security_powers_bonus:0 "Расширить оперативные полномочия"
 RUS_kt_cost_55:0 "[RUS_kt_cost_55_display]"
 RUS_kt_cost_55_enough:0 "£pol_power §Y55§!"
 RUS_kt_cost_55_short:0 "£pol_power §R55§!"
 RUS_kt_security_powers_tt:0 "§YРасширить оперативные полномочия§!\nАдминистрация президента готовит поправки, расширяющие круг вопросов, по которым спецслужбы вправе действовать самостоятельно. Руководители ведомств получают больше свободы в организации контрразведывательной работы.\nСтоимость: §Y55§! £pol_power \n\nСиловики: влияние §G+4§!\nСиловики: настроение §G+2§!\nСиловики: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YКонтрразведка§!: §G+0,05§!"
 RUS_kt_security_border_bonus:0 "Усилить пограничную безопасность"
 RUS_kt_cost_40:0 "[RUS_kt_cost_40_display]"
 RUS_kt_cost_40_enough:0 "£pol_power §Y40§!"
 RUS_kt_cost_40_short:0 "£pol_power §R40§!"
 RUS_kt_security_border_tt:0 "§YУсилить пограничную безопасность§!\nПрезидент поручает пограничной службе и военному командованию согласовать порядок действий в приграничных районах. За каждым участком закрепляют ответственных за связь между пограничными подразделениями и армейскими частями.\nСтоимость: §Y40§! £pol_power \n\nСиловики: влияние §G+2§!\nСиловики: настроение §G+2§!\nБонус на §Y90 дней§!.\n§YЗащита дивизий на национальной территории§!: §G+3%§!"
 RUS_kt_security_coordinate_bonus:0 "Согласовать межведомственную деятельность"
 RUS_kt_cost_35:0 "[RUS_kt_cost_35_display]"
 RUS_kt_cost_35_enough:0 "£pol_power §Y35§!"
 RUS_kt_cost_35_short:0 "£pol_power §R35§!"
 RUS_kt_security_coordinate_tt:0 "§YСогласовать межведомственную деятельность§!\nАдминистрация президента созывает руководителей силовых ведомств, чтобы разобрать споры о подследственности и обмене информацией. Достигнутые договорённости закрепляются за конкретными заместителями, отвечающими за их исполнение.\nСтоимость: §Y35§! £pol_power \n\nСиловики: влияние §G+1§!\nСиловики: настроение §G+3§!\nСиловики: лояльность §G+2§!\nБонус на §Y90 дней§!.\n§YКонтрразведка§!: §G+0,03§!"
 RUS_kt_security_audit_bonus:0 "Провести проверку силовых ведомств"
 RUS_kt_cost_30:0 "[RUS_kt_cost_30_display]"
 RUS_kt_cost_30_enough:0 "£pol_power §Y30§!"
 RUS_kt_cost_30_short:0 "£pol_power §R30§!"
 RUS_kt_security_audit_tt:0 "§YПровести проверку силовых ведомств§!\nПрезидент назначает проверку силовых ведомств после жалоб директоров предприятий на затянувшиеся согласования. Руководителям служб предстоит объяснить, почему отдельные производства простаивали в ожидании ведомственных заключений.\nСтоимость: §Y30§! £pol_power \n\nСиловики: влияние §R-2§!\nСиловики: настроение §R-3§!\nСиловики: лояльность §G+2§!\nБонус на §Y30 дней§!.\n§YРост эффективности производства§!: §G+3%§!"
 RUS_kt_security_autonomy_bonus:0 "Ограничить ведомственную автономию"
 RUS_kt_cost_60:0 "[RUS_kt_cost_60_display]"
 RUS_kt_cost_60_enough:0 "£pol_power §Y60§!"
 RUS_kt_cost_60_short:0 "£pol_power §R60§!"
 RUS_kt_security_autonomy_tt:0 "§YОграничить ведомственную автономию§!\nПо поручению президента правительство пересматривает перечень согласований, которые силовые ведомства вправе требовать при строительстве промышленных объектов. Для дополнительных проверок теперь потребуется письменное обоснование.\nСтоимость: §Y60§! £pol_power \n\nСиловики: влияние §R-5§!\nСиловики: настроение §R-4§!\nСиловики: лояльность §R-2§!\nБонус на §Y90 дней§!.\n§YСкорость строительства гражданских фабрик§!: §G+3%§!"
 RUS_kt_security_campaign_bonus:0 "Контрразведывательная кампания"
 RUS_kt_cost_50:0 "[RUS_kt_cost_50_display]"
 RUS_kt_cost_50_enough:0 "£pol_power §Y50§!"
 RUS_kt_cost_50_short:0 "£pol_power §R50§!"
 RUS_kt_security_campaign_tt:0 "§YКонтрразведывательная кампания§!\nПрезидент поручает спецслужбам проверить сообщения об утечках закрытых сведений. Проверки затронут и гражданские учреждения, руководители которых опасаются задержек в работе и новых ограничений доступа к документам.\nСтоимость: §Y50§! £pol_power \n\nСиловики: влияние §G+2§!\nСиловики: настроение §R-2§!\nТехнократы: настроение §R-2§!\nБонус на §Y120 дней§!.\n§YКонтрразведка§!: §G+0,20§!\n§YОбнаружение вражеских оперативников§!: §G+10%§!\n\nТребования: влияние не ниже §Y60§!, настроение не ниже §Y65§!, лояльность не ниже §Y90§!"
 RUS_kt_security_emergency_bonus:0 "Экстренный режим государственной безопасности"
 RUS_kt_security_emergency_tt:0 "§YЭкстренный режим государственной безопасности§!\nНа время военных действий президент вводит особый порядок охраны важных объектов. Силовым ведомствам придётся отвечать за его исполнение, а владельцам крупных предприятий предстоит согласовывать с ними работу своих служб безопасности.\nСтоимость: §Y60§! £pol_power \n\nСиловики: влияние §G+3§!\nСиловики: настроение §R-4§!\nОлигархи: настроение §R-4§!\nБонус на §Y120 дней§!.\n§YЦель сопротивления§!: §G-15%§!\n§YКонтрразведка§!: §G+0,15§!\n\nТребования: влияние не ниже §Y75§!, настроение не ниже §Y60§!, лояльность не ниже §Y90§!, военное время"
 RUS_kt_unique:0 "§YУникальные§! (Перманентные)"
 RUS_kt_security_network_bonus:0 "Единый контур государственной безопасности"
 RUS_kt_security_network_tt:0 "§YЕдиный контур государственной безопасности§!\nСоздание расширенной системы взаимодействия спецслужб, позволяющей централизовать обмен разведывательной информацией.\nСтоимость: §Y55§! £pol_power \n\nСиловики: влияние §G+3§!\nСиловики: настроение §G+2§!\nТехнократы: настроение §R-2§!\n\n§YКонтрразведка§!: §G+0,15§!\n§YОбнаружение вражеских оперативников§!: §G+10%§!\n\nТребования: влияние не ниже §Y70§!, лояльность не ниже §Y100§!"
 RUS_kt_security_assets_bonus:0 "Расширение силового контроля над государственными активами"
 RUS_kt_security_assets_tt:0 "§YРасширение силового контроля над государственными активами§!\nРасширение полномочий силовых ведомств при проверках и расследованиях в отношении стратегических предприятий.\nСтоимость: §Y60§! £pol_power \n\nСиловики: влияние §G+4§!\nСиловики: настроение §G+2§!\nОлигархи: настроение §R-5§!\nОлигархи: лояльность §R-2§!\n\n§YПотребность в гарнизонах§!: §G-12%§!\n§YКонтрразведка§!: §G+0,10§!\n\nТребования: влияние не ниже §Y80§!, настроение не ниже §Y80§!"
 RUS_kt_security_oversight_bonus:0 "Реформа ведомственного надзора"
 RUS_kt_security_oversight_tt:0 "§YРеформа ведомственного надзора§!\nУсиление надзора за деятельностью силовых ведомств и пересмотр системы внутренней отчётности.\nСтоимость: §Y45§! £pol_power \n\nСиловики: влияние §R-3§!\nСиловики: настроение §R-4§!\nСиловики: лояльность §G+2§!\nОлигархи: настроение §G+2§!\n\n§YДешифровка§!: §G+10%§!\n§YКонтрразведка§!: §G+0,10§!\n\nТребования: лояльность не ниже §Y100§!, настроение не ниже §Y70§!, влияние не ниже §Y70§!"
 RUS_kt_security_strategic_bonus:0 "Централизация стратегической разведки"
 RUS_kt_security_strategic_tt:0 "§YЦентрализация стратегической разведки§!\nКонцентрация координационных полномочий в сфере безопасности и расширение возможностей разведывательного сообщества.\nСтоимость: §Y60§! £pol_power \n\nСиловики: влияние §G+5§!\nСиловики: настроение §G+3§!\nГенеральский корпус: настроение §R-3§!\n\n§YЯчейки оперативников§!: §G+1§!\n§YКонтрразведка§!: §G+0,10§!\n\nТребования: влияние не ниже §Y85§!, лояльность не ниже §Y100§!, настроение не ниже §Y85§!"
 RUS_kt_decision_active:0 "Действует"
 RUS_kt_decision_taken:0 "Выполнено"
 RUS_kt_defence_orders_bonus:0 "Расширить государственный оборонный заказ"
 RUS_kt_defence_orders_tt:0 "§YРасширить государственный оборонный заказ§!\nПрезидент поручает правительству увеличить объём закупок по уже освоенным образцам вооружения. Заводы получают дополнительные заказы, которые можно запустить на действующих линиях.\nСтоимость: §Y60§! £pol_power \n\nОПК: влияние §G+4§!\nОПК: настроение §G+4§!\nОПК: лояльность §G+1§!\nБонус на §Y30 дней§!.\n§YВыпуск военных заводов§!: §G+4%§!"
 RUS_kt_defence_modernise_bonus:0 "Модернизировать оборонные предприятия"
 RUS_kt_defence_modernise_tt:0 "§YМодернизировать оборонные предприятия§!\nПо решению президента правительство выделяет средства на замену оборудования в цехах, которые сдерживают выпуск готовой продукции. Очерёдность работ определят по заявкам главных инженеров предприятий.\nСтоимость: §Y55§! £pol_power \n\nОПК: влияние §G+2§!\nОПК: настроение §G+3§!\nБонус на §Y30 дней§!.\n§YРост эффективности производства§!: §G+5%§!"
 RUS_kt_defence_contracts_bonus:0 "Гарантировать выполнение контрактов"
 RUS_kt_defence_contracts_tt:0 "§YГарантировать выполнение контрактов§!\nАдминистрация президента собирает заказчиков и поставщиков, чтобы урегулировать задолженность по действующим контрактам. Предприятия, ожидающие оплаты, смогут заказать запчасти и вернуть простаивающее оборудование в строй.\nСтоимость: §Y35§! £pol_power \n\nОПК: влияние §G+1§!\nОПК: настроение §G+4§!\nОПК: лояльность §G+2§!\nБонус на §Y90 дней§!.\n§YСкорость ремонта фабрик§!: §G+5%§!"
 RUS_kt_defence_audit_bonus:0 "Провести аудит оборонных корпораций"
 RUS_kt_defence_audit_tt:0 "§YПровести аудит оборонных корпораций§!\nПрезидент требует проверить, почему предприятия с оплаченными заказами отстают от графика поставок. Директорам предстоит показать реальную загрузку цехов и объяснить, где именно задерживается выпуск продукции.\nСтоимость: §Y40§! £pol_power \n\nОПК: влияние §R-3§!\nОПК: настроение §R-3§!\nОПК: лояльность §G+1§!\nБонус на §Y30 дней§!.\n§YВыпуск военных заводов§!: §G+4%§!"
 RUS_kt_defence_procurement_bonus:0 "Пересмотреть приоритеты военных закупок"
 RUS_kt_defence_procurement_tt:0 "§YПересмотреть приоритеты военных закупок§!\nАдминистрация президента выносит на рассмотрение предложения Генштаба о перераспределении средств в пользу военного снабжения. Часть заказов промышленности придётся отложить, чтобы профинансировать доставку уже произведённого имущества.\nСтоимость: §Y45§! £pol_power \n\nОПК: влияние §R-2§!\nОПК: настроение §R-2§!\nГенеральский корпус: настроение §G+2§!\nБонус на §Y90 дней§!.\n§YСтроительство узлов снабжения§!: §G+3%§!"
 RUS_kt_defence_shifts_bonus:0 "Переход оборонных предприятий на усиленный режим работы"
 RUS_kt_defence_shifts_tt:0 "§YПереход оборонных предприятий на усиленный режим работы§!\nВ условиях войны президент поручает увеличить сменность на предприятиях с наиболее срочными заказами. Директорам предстоит найти людей для дополнительных смен, а финансовому блоку - средства на оплату их труда.\nСтоимость: §Y60§! £pol_power \n\nОПК: влияние §G+2§!\nОПК: настроение §R-4§!\nТехнократы: настроение §R-3§!\nБонус на §Y30 дней§!.\n§YВыпуск военных заводов§!: §G+6%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y65§!, лояльность не ниже §Y85§!, военное время"
 RUS_kt_defence_supply_bonus:0 "Приоритетное снабжение оборонной промышленности"
 RUS_kt_defence_supply_tt:0 "§YПриоритетное снабжение оборонной промышленности§!\nПравительство по поручению президента закрепляет за оборонными предприятиями первоочередные поставки материалов и комплектующих. Крупным гражданским заказчикам придётся пересмотреть сроки, о которых они уже договорились с поставщиками.\nСтоимость: §Y55§! £pol_power \n\nОПК: влияние §G+3§!\nОПК: настроение §G+2§!\nОлигархи: настроение §R-4§!\nБонус на §Y30 дней§!.\n§YРост эффективности производства§!: §G+4%§!\n\nТребования: влияние не ниже §Y65§!, настроение не ниже §Y60§!, лояльность не ниже §Y90§!"
 RUS_kt_defence_consortium_bonus:0 "Создание оборонно-промышленного консорциума"
 RUS_kt_defence_consortium_tt:0 "§YСоздание оборонно-промышленного консорциума§!\nПрезидент предлагает объединить несколько смежных предприятий в консорциум с единым производственным планом. Его руководство сможет распределять заказы между заводами и представлять их интересы на переговорах с правительством.\nСтоимость: §Y55§! £pol_power \n\nОПК: влияние §G+4§!\nОПК: настроение §G+3§!\nТехнократы: настроение §R-3§!\n\n§YВыпуск военных заводов§!: §G+6%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y75§!"
 RUS_kt_defence_tools_bonus:0 "Национальная программа станкостроения"
 RUS_kt_defence_tools_tt:0 "§YНациональная программа станкостроения§!\nПрезидент утверждает долгосрочный заказ на отечественные станки для оборонных предприятий. Производители оборудования получают гарантированный спрос, а заводы смогут заранее планировать переоснащение цехов.\nСтоимость: §Y60§! £pol_power \n\nОПК: влияние §G+2§!\nОПК: настроение §G+2§!\nОлигархи: настроение §R-2§!\n\n§YРост эффективности производства§!: §G+6%§!\n\nТребования: влияние не ниже §Y60§!, лояльность не ниже §Y95§!"
 RUS_kt_defence_clusters_bonus:0 "Военно-технические научные кластеры"
 RUS_kt_defence_clusters_tt:0 "§YВоенно-технические научные кластеры§!\nАдминистрация президента предлагает финансировать совместные проекты конструкторских бюро, технических вузов и заводских лабораторий. У каждой разработки появится предприятие, готовое изготовить и испытать опытный образец.\nСтоимость: §Y55§! £pol_power \n\nОПК: влияние §G+3§!\nОПК: настроение §G+2§!\nТехнократы: настроение §G+1§!\n\n§YСкорость исследований§!: §G+8%§!\n\nТребования: влияние не ниже §Y65§!, настроение не ниже §Y80§!"
 RUS_kt_defence_centralise_bonus:0 "Централизация управления оборонными корпорациями"
 RUS_kt_defence_centralise_tt:0 "§YЦентрализация управления оборонными корпорациями§!\nПрезидент передаёт единому координационному органу распределение дефицитных материалов между оборонными корпорациями. Военные заказчики и частные поставщики утрачивают часть возможностей договариваться с директорами заводов напрямую.\nСтоимость: §Y60§! £pol_power \n\nОПК: влияние §G+5§!\nОПК: настроение §R-3§!\nГенеральский корпус: настроение §R-3§!\nОлигархи: настроение §R-2§!\n\n§YВыпуск военных заводов§!: §G+5%§!\n§YШтраф от нехватки ресурсов§!: §G-4%§!\n\nТребования: влияние не ниже §Y75§!, лояльность не ниже §Y100§!"
 RUS_kt_limit_0:0 "Лимит §Y0/2§!"
 RUS_kt_limit_1:0 "Лимит §Y1/2§!"
 RUS_kt_limit_2:0 "Лимит §Y2/2§!"
 RUS_kt_no_faction:0 "Фракция: не выбрана"
 RUS_kt_technocrats_discipline_bonus:0 "Усилить бюджетную дисциплину"
 RUS_kt_technocrats_discipline_tt:0 "§YУсилить бюджетную дисциплину§!\nПрезидент поручает Минфину проверить расходы ведомств до утверждения новых бюджетных обязательств. Министр получает право возвращать на доработку заявки, для которых не определён источник финансирования.\nСтоимость: §Y45§! £pol_power \n\nТехнократы: влияние §G+2§!\nТехнократы: настроение §G+3§!\nБонус на §Y90 дней§!.\n§YДоля фабрик на товары народного потребления§!: §G-1%§!"
 RUS_kt_technocrats_digital_bonus:0 "Цифровизировать государственные службы"
 RUS_kt_technocrats_digital_tt:0 "§YЦифровизировать государственные службы§!\nПо поручению президента ведомства переходят к обмену сведениями из государственных реестров. При оформлении разрешений на строительство предприятиям больше не придётся повторно представлять документы, уже имеющиеся у государства.\nСтоимость: §Y50§! £pol_power \n\nТехнократы: влияние §G+2§!\nТехнократы: настроение §G+3§!\nТехнократы: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YСтроительство гражданских фабрик§!: §G+3%§!"
 RUS_kt_technocrats_reserves_bonus:0 "Сформировать антикризисные резервы"
 RUS_kt_technocrats_reserves_tt:0 "§YСформировать антикризисные резервы§!\nПрезидент поручает Минфину зарезервировать средства на восстановление предприятий после аварий и перебоев с поставками. Правительство сможет оплачивать срочный ремонт до очередного пересмотра бюджета.\nСтоимость: §Y40§! £pol_power \n\nТехнократы: влияние §G+3§!\nТехнократы: настроение §G+2§!\nБонус на §Y90 дней§!.\n§YСкорость ремонта фабрик§!: §G+5%§!"
 RUS_kt_technocrats_merit_bonus:0 "Расширить кадровую меритократию"
 RUS_kt_technocrats_merit_tt:0 "§YРасширить кадровую меритократию§!\nАдминистрация президента предлагает выдвигать на руководящие должности специалистов, уже отвечавших за завершённые проекты. Для научных программ ведомства смогут приглашать руководителей из исследовательских институтов и конструкторских бюро.\nСтоимость: §Y55§! £pol_power \n\nТехнократы: влияние §G+3§!\nТехнократы: настроение §G+2§!\nТехнократы: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YСкорость исследований§!: §G+5%§!"
 RUS_kt_technocrats_purchases_bonus:0 "Пересмотреть государственные закупки"
 RUS_kt_technocrats_purchases_tt:0 "§YПересмотреть государственные закупки§!\nПрезидент поручает экономическому блоку пересмотреть правила замены поставщика по действующему заказу. Новый подрядчик должен обеспечить совместимость деталей и оснастки, чтобы смена контракта не останавливала производственную линию.\nСтоимость: §Y35§! £pol_power \n\nТехнократы: влияние §G+1§!\nТехнократы: настроение §G+2§!\nОлигархи: настроение §R-2§!\nБонус на §Y30 дней§!.\n§YСохранение эффективности производства§!: §G+3%§!"
 RUS_kt_technocrats_transfer_bonus:0 "Передать бюджетные полномочия силовому блоку"
 RUS_kt_technocrats_transfer_tt:0 "§YПередать бюджетные полномочия силовому блоку§!\nПрезидент разрешает силовым ведомствам самостоятельно распределять часть средств по срочным заказам для армии. Минфин сохраняет обязанность учитывать эти расходы, хотя его возможности влиять на их назначение сокращаются.\nСтоимость: §Y30§! £pol_power \n\nТехнократы: влияние §R-4§!\nТехнократы: настроение §R-4§!\nТехнократы: лояльность §G+1§!\nСиловики: настроение §G+2§!\nБонус на §Y30 дней§!.\n§YВыпуск военных заводов§!: §G+3%§!"
 RUS_kt_technocrats_crisis_bonus:0 "Ввести режим антикризисного бюджетного управления"
 RUS_kt_technocrats_crisis_tt:0 "§YВвести режим антикризисного бюджетного управления§!\nПрезидент поручает Минфину пересмотреть расходы текущего года и сохранить финансирование гражданских строек, близких к завершению. Для этого придётся отложить часть платежей, на которые рассчитывали оборонные предприятия.\nСтоимость: §Y50§! £pol_power \n\nТехнократы: влияние §G+2§!\nТехнократы: настроение §R-2§!\nОПК: настроение §R-3§!\nБонус на §Y120 дней§!.\n§YДоля фабрик на товары народного потребления§!: §G-3%§!\n§YСтроительство гражданских фабрик§!: §G+5%§!\n\nТребования: влияние не ниже §Y50§!, настроение не ниже §Y50§!, лояльность не ниже §Y90§!"
 RUS_kt_technocrats_invest_bonus:0 "Развернуть программу государственных инвестиций"
 RUS_kt_technocrats_invest_tt:0 "§YРазвернуть программу государственных инвестиций§!\nПрезидент предлагает направить государственные средства в промышленные стройки и прикладные исследования с длительным сроком окупаемости. Отбор проектов переходит к экономическому блоку, что сокращает влияние частных инвесторов на распределение средств.\nСтоимость: §Y55§! £pol_power \n\nТехнократы: влияние §G+3§!\nТехнократы: настроение §G+2§!\nОлигархи: настроение §R-3§!\nБонус на §Y120 дней§!.\n§YСтроительство гражданских фабрик§!: §G+5%§!\n§YСкорость исследований§!: §G+5%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y60§!, лояльность не ниже §Y90§!"
 RUS_kt_technocrats_rule_bonus:0 "Восстановление бюджетного правила"
 RUS_kt_technocrats_rule_tt:0 "§YВосстановление бюджетного правила§!\nПрезидент поддерживает предложение Минфина закрепить порядок расходования дополнительных сырьевых доходов. Военному руководству и промышленности станет труднее добиваться новых ассигнований при каждом росте экспортной выручки.\nСтоимость: §Y55§! £pol_power \n\nТехнократы: влияние §G+3§!\nТехнократы: настроение §G+2§!\nОПК: настроение §R-3§!\nГенеральский корпус: настроение §R-2§!\n\n§YДоля фабрик на товары народного потребления§!: §G-2%§!\n\nТребования: влияние не ниже §Y55§!, лояльность не ниже §Y100§!"
 RUS_kt_technocrats_tax_bonus:0 "Цифровая трансформация налоговой системы"
 RUS_kt_technocrats_tax_tt:0 "§YЦифровая трансформация налоговой системы§!\nПрезидент поручает налоговой службе объединить сведения о расчётах предприятий с данными казначейства. Минфин сможет точнее планировать поступления и финансирование строек, а крупным компаниям придётся раскрывать больше сведений о своих операциях.\nСтоимость: §Y60§! £pol_power \n\nТехнократы: влияние §G+3§!\nТехнократы: настроение §G+3§!\nОлигархи: настроение §R-3§!\n\n§YСтроительство гражданских фабрик§!: §G+6%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y70§!"
 RUS_kt_technocrats_managers_bonus:0 "Формирование корпуса независимых управленцев"
 RUS_kt_technocrats_managers_tt:0 "§YФормирование корпуса независимых управленцев§!\nАдминистрация президента формирует кадровый резерв для ведомств и государственных программ. Кандидатов смогут выдвигать профессиональные комиссии, что ослабит влияние ведомственных покровителей на назначения.\nСтоимость: §Y55§! £pol_power \n\nТехнократы: влияние §G+4§!\nТехнократы: настроение §G+1§!\nСиловики: настроение §R-3§!\n\n§YСкорость исследований§!: §G+6%§!\n\nТребования: влияние не ниже §Y65§!, настроение не ниже §Y75§!, лояльность не ниже §Y100§!"
 RUS_kt_technocrats_stabilise_bonus:0 "Программа макроэкономической стабилизации"
 RUS_kt_technocrats_stabilise_tt:0 "§YПрограмма макроэкономической стабилизации§!\nПрезидент предлагает согласовать с правительством и крупными работодателями график финансирования промышленных проектов. Предприятия получат возможность планировать ремонт и строительство с учётом заранее объявленных сроков государственных платежей.\nСтоимость: §Y50§! £pol_power \n\nТехнократы: влияние §G+2§!\nТехнократы: настроение §G+3§!\nОлигархи: настроение §G+2§!\n\n§YСкорость ремонта фабрик§!: §G+5%§!\n§YСтроительство гражданских фабрик§!: §G+5%§!\n\nТребования: влияние не ниже §Y60§!, настроение не ниже §Y65§!"
 RUS_kt_oligarchs_concessions_bonus:0 "Расширить инфраструктурные концессии"
 RUS_kt_oligarchs_concessions_tt:0 "§YРасширить инфраструктурные концессии§!\nПрезидент поручает правительству расширить перечень объектов, которые частные инвесторы могут строить и эксплуатировать по концессионным соглашениям. Крупный бизнес получает доступ к долгосрочным проектам с заранее определёнными условиями возврата вложений.\nСтоимость: §Y45§! £pol_power \n\nОлигархи: влияние §G+3§!\nОлигархи: настроение §G+4§!\nБонус на §Y90 дней§!.\n§YСтроительство инфраструктуры§!: §G+5%§!"
 RUS_kt_oligarchs_agreements_bonus:0 "Заключить инвестиционные соглашения"
 RUS_kt_oligarchs_agreements_tt:0 "§YЗаключить инвестиционные соглашения§!\nАдминистрация президента собирает владельцев промышленных групп для согласования новых строек. Государство берёт на себя подведение инфраструктуры при условии, что инвесторы закрепят в договорах объём вложений и сроки ввода предприятий.\nСтоимость: §Y55§! £pol_power \n\nОлигархи: влияние §G+3§!\nОлигархи: настроение §G+3§!\nОлигархи: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YСтроительство гражданских фабрик§!: §G+3%§!"
 RUS_kt_oligarchs_exporters_bonus:0 "Предоставить льготы экспортёрам"
 RUS_kt_oligarchs_exporters_tt:0 "§YПредоставить льготы экспортёрам§!\nПрезидент поддерживает просьбу сырьевых компаний о временном снижении части обязательных платежей. Экспортёры смогут направить высвободившиеся средства на добычу, а Минфину придётся скорректировать прогноз доходов.\nСтоимость: §Y50§! £pol_power \n\nОлигархи: влияние §G+2§!\nОлигархи: настроение §G+4§!\nТехнократы: настроение §R-2§!\nБонус на §Y90 дней§!.\n§YЭффективность добычи ресурсов§!: §G+4%§!"
 RUS_kt_oligarchs_guarantees_bonus:0 "Предоставить государственные гарантии бизнесу"
 RUS_kt_oligarchs_guarantees_tt:0 "§YПредоставить государственные гарантии бизнесу§!\nПо поручению президента правительство предоставляет гарантии по кредитам предприятий, нуждающихся в восстановлении производственных мощностей. Банки смогут открыть финансирование под обязательства государства.\nСтоимость: §Y40§! £pol_power \n\nОлигархи: влияние §G+2§!\nОлигархи: настроение §G+3§!\nОлигархи: лояльность §G+1§!\nБонус на §Y90 дней§!.\n§YСкорость ремонта фабрик§!: §G+5%§!"
 RUS_kt_oligarchs_audit_bonus:0 "Проверить исполнение государственных контрактов"
 RUS_kt_oligarchs_audit_tt:0 "§YПроверить исполнение государственных контрактов§!\nПрезидент поручает казначейству сверить фактические поставки с авансами, перечисленными крупнейшим подрядчикам. По контрактам с необъяснёнными расхождениями следующие платежи будут зависеть от результатов проверки.\nСтоимость: §Y35§! £pol_power \n\nОлигархи: влияние §R-3§!\nОлигархи: настроение §R-4§!\nОлигархи: лояльность §R-1§!\nТехнократы: настроение §G+2§!\nБонус на §Y90 дней§!.\n§YДоля фабрик на товары народного потребления§!: §G-1%§!"
 RUS_kt_oligarchs_monopolies_bonus:0 "Ограничить влияние крупных монополий"
 RUS_kt_oligarchs_monopolies_tt:0 "§YОграничить влияние крупных монополий§!\nПрезидент поддерживает предложение антимонопольной службы открыть государственные заказы для независимых поставщиков. Предприятия получат больше возможностей выбирать комплектующие, а крупнейшие холдинги лишатся части исключительных условий.\nСтоимость: §Y60§! £pol_power \n\nОлигархи: влияние §R-5§!\nОлигархи: настроение §R-4§!\nОлигархи: лояльность §R-2§!\nТехнократы: настроение §G+3§!\nБонус на §Y30 дней§!.\n§YРост эффективности производства§!: §G+4%§!"
 RUS_kt_oligarchs_package_bonus:0 "Согласовать чрезвычайный инвестиционный пакет"
 RUS_kt_oligarchs_package_tt:0 "§YСогласовать чрезвычайный инвестиционный пакет§!\nПрезидент предлагает нескольким промышленным группам ускорить строительство новых предприятий в обмен на государственные гарантии. Финансовому блоку предстоит принять дополнительные обязательства по проектам, согласованным напрямую с собственниками.\nСтоимость: §Y55§! £pol_power \n\nОлигархи: влияние §G+2§!\nОлигархи: настроение §G+3§!\nТехнократы: настроение §R-3§!\nБонус на §Y120 дней§!.\n§YСтроительство гражданских фабрик§!: §G+6%§!\n\nТребования: влияние не ниже §Y35§!, настроение не ниже §Y55§!, лояльность не ниже §Y85§!"
 RUS_kt_oligarchs_exports_bonus:0 "Заключить привилегированные экспортные соглашения"
 RUS_kt_oligarchs_exports_tt:0 "§YЗаключить привилегированные экспортные соглашения§!\nАдминистрация президента согласует с крупнейшими экспортёрами долгосрочные условия вывоза сырья. Компании смогут расширить добычу и обновить оборудование, но оборонным заказчикам станет сложнее рассчитывать на приоритетные внутренние поставки.\nСтоимость: §Y60§! £pol_power \n\nОлигархи: влияние §G+3§!\nОлигархи: настроение §G+3§!\nОПК: настроение §R-3§!\nТехнократы: настроение §R-2§!\nБонус на §Y120 дней§!.\n§YЭффективность добычи ресурсов§!: §G+5%§!\n§YСкорость ремонта фабрик§!: §G+5%§!\n\nТребования: влияние не ниже §Y50§!, настроение не ниже §Y65§!, лояльность не ниже §Y80§!"
 RUS_kt_oligarchs_programme_bonus:0 "Федеральная программа инфраструктурных концессий"
 RUS_kt_oligarchs_programme_tt:0 "§YФедеральная программа инфраструктурных концессий§!\nПрезидент предлагает распространить концессионную модель на межрегиональные инфраструктурные проекты. Крупные подрядчики получат портфель заказов на несколько лет, а правительству придётся учитывать эти обязательства при составлении будущих бюджетов.\nСтоимость: §Y55§! £pol_power \n\nОлигархи: влияние §G+3§!\nОлигархи: настроение §G+4§!\nТехнократы: настроение §R-3§!\n\n§YСтроительство инфраструктуры§!: §G+6%§!\n\nТребования: влияние не ниже §Y45§!, настроение не ниже §Y65§!, лояльность не ниже §Y90§!"
 RUS_kt_oligarchs_ownership_bonus:0 "Предоставление гарантий стратегической собственности"
 RUS_kt_oligarchs_ownership_tt:0 "§YПредоставление гарантий стратегической собственности§!\nПрезидент предлагает закрепить условия, при которых владельцы стратегических предприятий сохраняют контроль над активами и продолжают инвестиции. Пересмотр таких гарантий потребует решения правительства, что ограничит возможности силовых ведомств добиваться смены собственника.\nСтоимость: §Y50§! £pol_power \n\nОлигархи: влияние §G+4§!\nОлигархи: настроение §G+3§!\nСиловики: настроение §R-3§!\n\n§YСтроительство гражданских фабрик§!: §G+6%§!\n\nТребования: влияние не ниже §Y50§!, настроение не ниже §Y70§!, лояльность не ниже §Y95§!"
 RUS_kt_oligarchs_alliance_bonus:0 "Формирование сырьевого инвестиционного альянса"
 RUS_kt_oligarchs_alliance_tt:0 "§YФормирование сырьевого инвестиционного альянса§!\nПо инициативе президента крупнейшие добывающие компании объединяют средства для освоения месторождений и строительства общей инфраструктуры. Участники альянса получат возможность согласовывать инвестиционные приоритеты до их рассмотрения экономическими ведомствами.\nСтоимость: §Y60§! £pol_power \n\nОлигархи: влияние §G+5§!\nОлигархи: настроение §G+2§!\nТехнократы: настроение §R-2§!\n\n§YЭффективность добычи ресурсов§!: §G+5%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y75§!, лояльность не ниже §Y95§!"
 RUS_kt_oligarchs_corporation_bonus:0 "Государственно-частная инфраструктурная корпорация"
 RUS_kt_oligarchs_corporation_tt:0 "§YГосударственно-частная инфраструктурная корпорация§!\nПрезидент предлагает учредить совместную корпорацию для строительства промышленных площадок и железнодорожных подходов к ним. Государство предоставит инфраструктурные гарантии, а частные участники получат долю в управлении проектами.\nСтоимость: §Y60§! £pol_power \n\nОлигархи: влияние §G+4§!\nОлигархи: настроение §G+3§!\nОПК: настроение §R-3§!\n\n§YСтроительство гражданских фабрик§!: §G+7%§!\n§YСтроительство железных дорог§!: §G+6%§!\n\nТребования: влияние не ниже §Y60§!, настроение не ниже §Y80§!, лояльность не ниже §Y90§!"
 RUS_kt_generals_powers_bonus:0 "Расширить генеральские полномочия"
 RUS_kt_generals_powers_tt:0 "§YРасширить генеральские полномочия§!\nПрезидент расширяет перечень командных решений, которые военное руководство вправе принимать самостоятельно. За Генштабом закрепляется право распределять обязанности между командующими без отдельного согласования каждого назначения с администрацией.\nСтоимость: §Y50§! £pol_power \n\nГенеральский корпус: влияние §G+4§!\nГенеральский корпус: настроение §G+3§!\nБонус на §Y30 дней§!.\n§YПрирост командного ресурса§!: §G+15%§!\n§YМаксимум командного ресурса§!: §G+5%§!"
 RUS_kt_generals_appointments_bonus:0 "Согласовать внеочередные военные назначения"
 RUS_kt_generals_appointments_tt:0 "§YСогласовать внеочередные военные назначения§!\nПрезидент выносит на кадровую комиссию представления офицеров, уже исполняющих обязанности на вышестоящих должностях. Генштаб сможет закрепить за ними командование до очередного планового рассмотрения назначений.\nСтоимость: §Y35§! £pol_power \n\nГенеральский корпус: влияние §G+2§!\nГенеральский корпус: настроение §G+3§!\nГенеральский корпус: лояльность §G+1§!\nБонус на §Y30 дней§!.\n§YПрирост опыта командующих§!: §G+10%§!"
 RUS_kt_generals_reserves_bonus:0 "Выделить дополнительные средства на армейские резервы"
 RUS_kt_generals_reserves_tt:0 "§YВыделить дополнительные средства на армейские резервы§!\nПрезидент поручает правительству оплатить дополнительные сборы, работу инструкторов и оснащение учебных частей. Военное командование сможет увеличить набор резервистов, а Минфину придётся найти средства в действующем бюджете.\nСтоимость: §Y45§! £pol_power \n\nГенеральский корпус: влияние §G+2§!\nГенеральский корпус: настроение §G+3§!\nТехнократы: настроение §R-2§!\nБонус на §Y30 дней§!.\n§YВремя подготовки дивизий§!: §G-15%§!"
 RUS_kt_generals_autonomy_bonus:0 "Ограничить вмешательство спецслужб в дела армии"
 RUS_kt_generals_autonomy_tt:0 "§YОграничить вмешательство спецслужб в дела армии§!\nПрезидент закрепляет за военным командованием первоочередное право представлять офицеров к повышению. Возражения силовых ведомств по кандидатурам должны быть оформлены письменно и переданы на рассмотрение кадровой комиссии.\nСтоимость: §Y50§! £pol_power \n\nГенеральский корпус: влияние §G+3§!\nГенеральский корпус: настроение §G+4§!\nСиловики: влияние §R-2§!\nСиловики: настроение §R-3§!\nБонус на §Y30 дней§!.\n§YСтоимость повышения командующих§!: §G-50%§!\n§YПрирост командного ресурса§!: §G+10%§!"
 RUS_kt_generals_accountability_bonus:0 "Возложить ответственность за военные неудачи на командование"
 RUS_kt_generals_accountability_tt:0 "§YВозложить ответственность за военные неудачи на командование§!\nНа фоне неудовлетворительных результатов военной кампании президент ограничивает самостоятельность Генштаба и требует кадровых изменений.\nСтоимость: §Y50§! £pol_power \n\nГенеральский корпус: влияние §R-5§!\nГенеральский корпус: настроение §R-5§!\nГенеральский корпус: лояльность §R-2§!\nСиловики: влияние §G+2§!\nСиловики: настроение §G+2§!\nБонус на §Y30 дней§!.\n§YПрирост политической власти§!: §G+10%§!\n\nТребования: влияние не ниже §Y50§!, настроение не выше §Y65§!, лояльность не ниже §Y80§!, военное время"
 RUS_kt_generals_freedom_bonus:0 "Предоставить Генштабу свободу действий"
 RUS_kt_generals_freedom_tt:0 "§YПредоставить Генштабу свободу действий§!\nПрезидент позволяет военному руководству самостоятельно определять приоритеты ведения боевых действий.\nСтоимость: §Y60§! £pol_power \n\nГенеральский корпус: влияние §G+4§!\nГенеральский корпус: настроение §G+4§!\nСиловики: настроение §R-3§!\nБонус на §Y30 дней§!.\n§YСкорость планирования§!: §G+10%§!\n§YПрирост командного ресурса§!: §G+10%§!\n§YПрирост политической власти§!: §R-10%§!\n\nТребования: влияние не ниже §Y60§!, настроение не ниже §Y70§!, лояльность не ниже §Y90§!, военное время"
 RUS_kt_generals_procurement_bonus:0 "Передать военным часть контроля над оборонным заказом"
 RUS_kt_generals_procurement_tt:0 "§YПередать военным часть контроля над оборонным заказом§!\nГенштаб получает дополнительные полномочия при определении приоритетов вооружения и снабжения армии.\nСтоимость: §Y60§! £pol_power \n\nГенеральский корпус: влияние §G+4§!\nГенеральский корпус: настроение §G+4§!\nОборонный комплекс: влияние §R-3§!\nОборонный комплекс: настроение §R-5§!\nТехнократы: настроение §R-2§!\n\n§YВыпуск военных заводов§!: §G+5%§!\n§YПотребление снабжения дивизиями§!: §G-8%§!\n\nТребования: влияние не ниже §Y55§!, настроение не ниже §Y70§!, лояльность не ниже §Y90§!"
