 RUS_kt_favourite_none:0 "Не выбран"
 RUS_kt_discipline_action:0 "Пресечь аппаратное неповиновение"
 RUS_kt_discipline_action_tt:0 "§YПресечь аппаратное неповиновение§!\nПрезидент требует от руководства группы исполнить ранее отложенные поручения. Администрация берёт их на контроль и временно ограничивает круг вопросов, по которым группа может действовать самостоятельно.\nСтоимость: §Y40§! £pol_power \n\nЛояльность: §G+15§!\nНастроение: §R-5§!\nВлияние: §R-3§!\n\nТребование: лояльность выбранной группы ниже §Y80%§!"
