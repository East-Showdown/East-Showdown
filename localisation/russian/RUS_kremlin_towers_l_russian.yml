 RUS_kt_patronage_oligarchs_gray_tt:0 "§YГлавный фаворит§!\n§YСтроительство гражданских фабрик§!: §G+6%§!\n\nНазначить бесплатно"
 RUS_kt_favourite_heading:0 "ПРЕЗИДЕНТСКОЕ ПОКРОВИТЕЛЬСТВО"
