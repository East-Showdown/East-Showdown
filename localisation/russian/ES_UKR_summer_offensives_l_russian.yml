 UKR_summer_assault_mission_failed_tt:0 "Одно из заданий §Y«Бронештурмы»§!, §Y«Массированное пехотное наступление»§! или §Y«Ставка на корпус морской пехоты»§! завершилось неудачей"
 UKR_mass_infantry_offensive_desc:0 "Сосредоточить силы на выбранном способе наступления. Временные изменения характеристик действуют до истечения 30 дней. При успешном выполнении задания изменения сохраняются."
 UKR_mass_infantry_offensive_mission:0 "$UKR_mass_infantry_offensive$"
 UKR_mass_infantry_offensive_mission_desc:0 "В течение §Y30 дней§! установите контроль над всеми указанными регионами. При успехе изменения характеристик сохранятся. Если срок истечёт без выполнения требований, изменения будут сняты и будет выполнен фокус §Y«Адаптировать тактику наступления»§!."
 UKR_rely_on_marine_corps_desc:0 "Сосредоточить силы на выбранном способе наступления. Временные изменения характеристик действуют до истечения 30 дней. При успешном выполнении задания изменения сохраняются."
 UKR_rely_on_marine_corps_mission:0 "$UKR_rely_on_marine_corps$"
 UKR_rely_on_marine_corps_mission_desc:0 "В течение §Y30 дней§! установите контроль над всеми указанными регионами. При успехе изменения характеристик сохранятся. Если срок истечёт без выполнения требований, изменения будут сняты и будет выполнен фокус §Y«Адаптировать тактику наступления»§!."
