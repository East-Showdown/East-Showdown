l_russian:
 upgrade_decryption_boost: "Группа радиоэлектронной разведки"
 upgrade_decryption_boost_desc: "§LПодразделение радиоэлектронной разведки: перехватывает и анализирует передачи противника, вскрывая подозрительную активность и вражескую агентуру.§!"
 upgrade_crypto_strength: "Школа криптоанализа"
 upgrade_crypto_strength_desc: "§LПодготовка аналитиков современного криптоанализа. Наши специалисты вскрывают защищённые каналы связи и извлекают сведения из зашифрованного трафика.§!"
 upgrade_crypto_strength_2: "Защищённые каналы связи"
 upgrade_crypto_strength_2_desc: "§LУсиленные, зашифрованные каналы связи защищают нашу агентуру и разведывательную работу от перехвата противником.§!"
 upgrade_invisible_ink: "Скрытая связь"
 upgrade_invisible_ink_desc: "§LЕдиная система скрытой связи: защищённый обмен данными увеличивает объём разведданных, который агентура передаёт нам.§!"
 upgrade_plastic_explosives: "Прямое действие"
 upgrade_plastic_explosives_desc: "§LСовременные группы прямого действия: агентура выводит из строя инфраструктуру противника и поддерживает местное сопротивление.§!"
 upgrade_suicide_pills: "Оперативная безопасность"
 upgrade_suicide_pills_desc: "§LПротоколы оперативной безопасности снижают риск обнаружения наших агентов и не дают им выдать сеть при захвате.§!"
