l_russian:

####################################################
### Контртеррористическая операция
####################################################

RUS_counter_terrorist_operation: "Контртеррористическая операция"
RUS_counter_terrorist_operation_desc: "После вторжения украинских вооружённых формирований на территорию Российской Федерации обеспечение безопасности приграничных регионов становится одной из важнейших государственных задач. Введение режима контртеррористической операции позволит объединить усилия Вооружённых Сил, Росгвардии, МВД и ФСБ в рамках единого правового режима, значительно повысив эффективность проведения специальных мероприятий. Координация действий различных ведомств обеспечит оперативное реагирование на возникающие угрозы, защиту гражданского населения и восстановление полного контроля над приграничными территориями."

RUS_counter_terrorist_operation_tt: "§YОткроется категория решений§! §C«Контртеррористическая операция»§!, позволяющая вводить режим КТО в приграничных регионах Российской Федерации."

####################################################
### Развернуть территориальную оборону
####################################################

RUS_deploy_territorial_defense: "Развернуть территориальную оборону"
RUS_deploy_territorial_defense_desc: "Опыт современных боевых действий показал, что безопасность приграничных субъектов Российской Федерации зависит не только от действий регулярной армии, но и от своевременного развёртывания подразделений территориальной обороны. Формирование дополнительных сил позволит обеспечить охрану объектов критически важной инфраструктуры, усилить взаимодействие с региональными органами власти и значительно повысить устойчивость обороны на потенциально опасных направлениях."

####################################################
### Операции по освобождению территорий
####################################################

RUS_operations_to_liberate_territories: "Операции по освобождению территорий"
RUS_operations_to_liberate_territories_desc: "После стабилизации обстановки на государственной границе Вооружённые Силы Российской Федерации получают возможность перейти к последовательному освобождению временно занятых территорий. Основной целью предстоящих операций станет восстановление контроля над населёнными пунктами, уничтожение вооружённых формирований противника и создание условий для дальнейшего продвижения российских войск."

####################################################
### Начать контрнаступление
####################################################

RUS_begin_counteroffensive: "Начать контрнаступление"
RUS_begin_counteroffensive_desc: "Проведённая перегруппировка войск, накопление материальных резервов и совершенствование системы управления создают необходимые условия для перехода к активным наступательным действиям. Успешное проведение контрнаступления позволит вернуть стратегическую инициативу, нарушить планы противника и создать предпосылки для полного освобождения временно занятых территорий Российской Федерации."

####################################################
### Восстановление конституционного порядка
####################################################

RUS_deukrainization_2: "Восстановление конституционного порядка"
RUS_deukrainization_2_desc: "Освобождение территорий является лишь первым этапом обеспечения их долгосрочной безопасности. Необходимо восстановить деятельность государственных институтов, обеспечить исполнение законодательства Российской Федерации, пресечь деятельность незаконных вооружённых формирований и создать условия для возвращения граждан к мирной жизни. Только комплексное восстановление системы государственного управления позволит окончательно стабилизировать ситуацию в регионе."

####################################################
### Восстановить органы государственной власти
####################################################

RUS_restore_civil_administration: "Восстановить органы государственной власти"
RUS_restore_civil_administration_desc: "Эффективное государственное управление невозможно без функционирования органов исполнительной власти, правоохранительных структур и муниципальных администраций. Формирование новой системы управления позволит обеспечить исполнение федерального законодательства, восстановить предоставление государственных услуг населению и приступить к полноценному социально-экономическому развитию освобождённых территорий."

####################################################
### Восстановление инфраструктуры
####################################################

RUS_reintegration_of_liberated_territories: "Восстановление инфраструктуры"
RUS_reintegration_of_liberated_territories_desc: "Боевые действия неизбежно наносят серьёзный ущерб транспортной, энергетической и коммунальной инфраструктуре. Государству предстоит восстановить автомобильные и железные дороги, объекты энергетики, системы связи, учреждения здравоохранения и образования. Возвращение нормального функционирования инфраструктуры станет основой для экономического развития и повышения качества жизни населения."

####################################################
### Новый референдум
####################################################

RUS_new_referendum_2026: "Новый референдум"
RUS_new_referendum_2026_desc: "После стабилизации общественно-политической обстановки, восстановления инфраструктуры и полноценного функционирования государственных институтов наступает этап, на котором жители освобождённых территорий смогут вновь выразить свою волю относительно дальнейшего государственного устройства региона. Проведение референдума должно стать завершающим этапом интеграции территорий в единое правовое и административное пространство Российской Федерации."

####################################################
### Новая система охраны государственной границы
####################################################

RUS_new_border_security_system: "Новая система охраны государственной границы"
RUS_new_border_security_system_desc: "Полученный опыт требует пересмотра подходов к обеспечению безопасности государственной границы. Создание современной многоуровневой системы охраны, усиление инженерного оборудования приграничных районов, развитие средств наблюдения и совершенствование взаимодействия между силовыми структурами позволят значительно повысить защищённость рубежей Российской Федерации и обеспечить своевременное реагирование на любые угрозы."

####################################################
### Tooltips
####################################################

RUS_counter_terrorist_operation_tt: "§YБудет открыта категория решений§! §C«Контртеррористическая операция»§!, позволяющая оперативно вводить режим КТО в приграничных субъектах Российской Федерации."

RUS_deploy_territorial_defense_tt: "§GБудет проведено масштабное развёртывание подразделений территориальной обороны и усилена защита приграничных регионов.§!"

RUS_operations_to_liberate_territories_tt: "§GВооружённые Силы Российской Федерации приступят к последовательному освобождению временно занятых территорий.§!"

RUS_begin_counteroffensive_tt: "§YРоссийские войска перейдут к широкомасштабному контрнаступлению с целью возвращения стратегической инициативы.§!"

RUS_deukrainization_2_tt: "§GНачнётся комплекс мероприятий по восстановлению конституционного порядка, государственного управления и общественной безопасности.§!"

RUS_restore_civil_administration_tt: "§YНа освобождённых территориях будет восстановлена работа органов государственной власти, правоохранительных структур и муниципальных администраций.§!"

RUS_reintegration_of_liberated_territories_tt: "§GНачнётся масштабная программа восстановления транспортной, энергетической, социальной и коммунальной инфраструктуры.§!"

RUS_new_referendum_2026_tt: "§YБудет подготовлено проведение нового референдума после завершения мероприятий по стабилизации и восстановлению региона.§!"

RUS_new_border_security_system_tt: "§GБудет реализована новая концепция охраны государственной границы Российской Федерации с использованием современных инженерных сооружений и технических средств контроля.§!"