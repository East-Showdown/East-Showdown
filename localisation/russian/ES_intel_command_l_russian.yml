 ES_intel_dir_civilian_desc: "Внедрение в гражданские структуры. Открывает диверсии на энергетике и промышленности, политическое давление."
 ES_intel_dir_army: "Военное направление"
 ES_intel_dir_army_desc: "Внедрение в армейские структуры. Открывает удары по командованию и диверсии против сухопутных войск."
 ES_intel_dir_air: "Авиационное направление"
 ES_intel_dir_air_desc: "Внедрение в ВВС противника. Открывает диверсии на радиолокационных станциях и авиационной инфраструктуре."
 ES_intel_dir_info: "Информационное направление"
 ES_intel_dir_info_desc: "Агентура влияния. Открывает политическое давление, дипломатическую изоляцию и контроль торговли."
 ES_intel_dir_drg: "Диверсионные группы (ДРГ)"
 ES_intel_dir_drg_desc: "Развёртывание ДРГ на территории противника. Открывает крупные диверсии и подрыв ресурсов."
 ES_intel_dir_civilian_tooltip: "Гражданская сеть. Развивается от скрытой агентуры до сети подрывников на объектах энергетики."
 ES_intel_dir_army_tooltip: "Армейская сеть. Продвижение от внедрённых офицеров до организации ударов по командованию."
 ES_intel_dir_air_tooltip: "Авиационная сеть. Агенты на базах ВВС подготавливают диверсии на радарах и инфраструктуре."
 ES_intel_dir_info_tooltip: "Информационная сеть. Определяет доступные операции информационной войны."
 ES_intel_dir_drg_tooltip: "ДРГ разворачиваются при готовности сети. Реализуют крупные диверсии и подрыв морали."
 ES_intel_iw_caption: "ОПЕРАЦИИ"
 ES_intel_iw_title: "ИНФОРМАЦИОННАЯ ВОЙНА"
 ES_intel_iw_hint: "Операции запускаются из штаба разведки. Уровень сети определяет силу акции."
 ES_intel_iw_political: "Политическое давление"
