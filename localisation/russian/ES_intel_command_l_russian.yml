 ES_intel_iw_specops: "Спецоперации"
 ES_intel_iw_specops_level: "Открывается развитием сетей"
 ES_intel_iw_political_tooltip: "Политическое давление. Чем выше уровень информационной сети, тем сильнее акция."
 ES_intel_iw_diplomatic_tooltip: "Дипломатическое давление. Осложняет внешние связи противника."
 ES_intel_iw_trade_tooltip: "Контроль торговли. Нарушает торговые поставки противника. Требует сеть уровня II."
 ES_intel_iw_specops_tooltip: "Диверсии, удары по командованию и РЛС. Открываются развитием сетей."
 ES_intel_iw_level1: "ДОСТУПНО (I)"
 ES_intel_iw_level2: "ДОСТУПНО (II)"
 ES_intel_iw_level3: "ДОСТУПНО (III)"
 ES_intel_iw_locked: "НЕДОСТУПНО"
 ES_intel_iw_specops_ready: "ГОТОВО"
 ES_intel_iw_summary_caption: "СВОДКА ПО ИНФОРМАЦИОННОЙ ВОЙНЕ"
 ES_intel_iw_summary_text: "Информационное направление ведёт подрывную работу против противника: давление на политику, дипломатическую изоляцию и нарушение торговых связей.\n\nСами операции запускаются в штабе разведки, раздел «Операции»."
 ES_intel_detail_title: "ОПЕРАТИВНАЯ СВОДКА"
 ES_intel_detail_hint: "Выберите направление, операцию или улучшение, чтобы увидеть подробности."
 ES_intel_detail_civilian: "Гражданское направление. Уровень 2 открывает подрыв трансформаторных подстанций, уровень 3 — подрыв электростанций. Базовая агентура служит основой для остальных направлений."
 ES_intel_detail_army: "Военное направление. Уровень 3 открывает удар по командованию и координацию диверсий против сухопутных войск."
 ES_intel_detail_air: "Авиационное направление. Уровень 2 открывает диверсии на радиолокационных станциях и авиационной инфраструктуре."
 ES_intel_detail_info: "Информационное направление. Уровень 1 открывает политическое давление и дипломатическую изоляцию, уровень 2 — контроль торговли, уровень 3 — усиленное политическое давление."
 ES_intel_detail_drg: "Диверсионно-разведывательные группы. Крупные диверсии, подрыв морали и дезинформация разведки противника."
 ES_intel_detail_pol: "Политическое давление. Подрывает политическую стабильность. Доступно при информационной сети; уровень сети определяет силу акции."
 ES_intel_detail_diplo: "Дипломатическое давление. Осложняет внешние связи противника. Доступно при информационной сети."
 ES_intel_detail_trade: "Контроль торговли. Нарушает торговые связи противника. Требует развитую информационную сеть (уровень 2)."
 ES_intel_detail_specops: "Спецоперации: подрыв трансформаторов и электростанций, диверсии на РЛС, удары по командованию, подрыв морали. Открываются по мере развития гражданской, военной и авиационной сетей."
 ES_intel_upg_tt: "Показать сведения об улучшении"
 ES_intel_upg_tt_delayed: "Открывает сводку: требования, статус и эффекты улучшения."
