 ES_intel_upg_req_crypto: "Требования: «Шифровальная школа» и технология «Вычислительные машины»"
 ES_intel_upg_eff_0: "Эффект: +25% к сбору разведданных о гражданской промышленности противника (за уровень)."
 ES_intel_upg_eff_1: "Эффект: +25% к сбору разведданных об армии противника (за уровень)."
 ES_intel_upg_eff_2: "Эффект: +25% к сбору разведданных о ВВС противника (за уровень)."
 ES_intel_upg_eff_3: "Эффект: +1,5 к защите агентства (за уровень, с убыванием)."
 ES_intel_upg_eff_4: "Эффект: +25% к эффективности борьбы с сопротивлением (за уровень)."
 ES_intel_upg_eff_5: "Эффект: +20% к разведданным от агентуры; -25% к риску операции по краже технологий."
 ES_intel_upg_eff_6: "Эффект: +25% к ущербу от диверсий; +25% к поддержке сопротивления."
 ES_intel_upg_eff_7: "Эффект: +10% к шансу гибели оперативника при захвате; -5% к шансу обнаружения своих оперативников."
 ES_intel_upg_eff_8: "Эффект: +25% к шансу вербовки вражеских оперативников; +25% к вербовке на оккупированных территориях; +1 слот оперативника; открывает местные решения по набору."
 ES_intel_upg_eff_9: "Эффект: +100% к шансу получить черту «Коммандос»."
 ES_intel_upg_eff_10: "Эффект: +100% к шансу захвата вражеского оперативника."
 ES_intel_upg_eff_11: "Эффект: +25% к миссиям контроля торговли и дипломатического давления."
 ES_intel_upg_eff_12: "Эффект: +25% к миссиям пропаганды и распространения идеологии."
 ES_intel_upg_eff_13: "Эффект: +1 к криптостойкости."
 ES_intel_upg_eff_14: "Эффект: +25 к мощности дешифровки (за уровень, с убыванием)."
