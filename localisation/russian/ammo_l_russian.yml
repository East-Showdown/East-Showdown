 ammunition_plants_efficiency_factor: "£GFX_ammo_icon Эффективность заводов боеприпасов"
 ammunition_capacity_k: "£GFX_ammo_icon Объём складов боеприпасов (K)"
 ammunition_recovery_efficiency_factor: "£GFX_ammo_icon Эффективность восстановления старых боеприпасов"
 ammunition_produce_efficiency_factor: "£GFX_ammo_icon Эффективность производства новых боеприпасов"
 ammunition_consumption_offensive_factor: "£GFX_ammo_icon Базовый расход боеприпасов в наступлении"
 ammunition_consumption_defensive_factor: "£GFX_ammo_icon Базовый расход боеприпасов в обороне"
 ammunition_level_cap: "£GFX_ammo_icon Предел уровня снабжения боеприпасами"
 ammunition_level_target: "£GFX_ammo_icon Уровень снабжения боеприпасами при автоматизации"

 ammunition_plant: "Цех по производству боеприпасов"
 ammunition_plant_desc: "Цех, производящий боеприпасы. \nПотребление электроэнергии: §R-0.075§! ГВт"
 ammunition_silo: "Склад боеприпасов"
 ammunition_silo_desc: "Склад для боеприпасов."

 ammunition_window_title_text: "§YУправление боеприпасами§!"
 ammunition_window_plants_title_text: "§gЗаводы боеприпасов: §Y[?modifier@ammunition_plants|0] шт§!§!"
 ammunition_window_plants_title_tt: "§YМощность заводов боеприпасов§!\nБез учёта эффективности: §Y[GET_ammunition_plans_production_base_value_disp] ед/день§!\nС учётом эффективности: §Y[GET_ammunition_plants_production_value_disp] ед/день§!\nЭффективность заводов: [GET_ammunition_plants_efficiency_factor_var]\n\nМощность делится между производством новых и восстановлением старых боеприпасов."
 ammunition_window_plants_production_factor_text: "Производство:"
 ammunition_window_plants_factor_production_value_text: "§Y[?ammunition_produce_factor|%0]§!"
 ammunition_window_plants_recovery_factor_text: "Восстановление:"
 ammunition_window_plants_recovery_factor_value_text: "§Y[?ammunition_recovery_factor|%0]§!"
 ammunition_window_plants_production_tt: "§YПроизводство новых боеприпасов§!\nДоля мощности: §Y[?ammunition_produce_factor_result|%0]§!\nЭффективность: §Y[?ammunition_produce_efficiency_factor_var|%0]§!\nВыпуск: §G[GET_ammunition_produce_value_k_disp] ед/день§!"
 ammunition_window_plants_recovery_tt: "§YВосстановление старых боеприпасов§!\nДоля мощности: §Y[?ammunition_recovery_factor_result|%0]§!\nЭффективность: §Y[?ammunition_recovery_efficiency_factor_var|%0]§!\nВыпуск: §G[GET_ammunition_recovery_value_k_disp] ед/день§!\n\nЗаводы восстанавливают не больше, чем есть старых боеприпасов. Свободная мощность уходит на производство."
 ammunition_window_plants_factor_production_button_tt: "§YИзменение распределения мощности на производство новых и восстановление старых боеприпасов§!\n\n§YЛКМ§! - добавить 1% на производство\n§YCTRL+ЛКМ§! - добавить 10% на производство\n§YSHIFT+ЛКМ§! - добавить 100% на производство\n\n§YПКМ§! - добавить 1% на восстановление\n§YCTRL+ПКМ§! - добавить 10% на восстановление\n§YSHIFT+ПКМ§! - добавить 100% на восстановление"
 ammunition_window_generation_text: "Выработка: §G[GET_ammunition_generation_value_k_disp] ед/день§!"
 ammunition_window_generation_tt: "§YВыработка§! - боеприпасы, которые заводы дают за день.\nПроизводство: §G[GET_ammunition_produce_value_k_disp] ед/день§!\nВосстановление: §G[GET_ammunition_recovery_value_k_disp] ед/день§!"

 ammunition_window_stock_title_text: "§gСклады боеприпасов: §Y[?modifier@ammunition_silos|0] шт§!§!"
 ammunition_window_stock_title_tt: "§YОбщая вместимость: [GET_ammunition_max_storage_capacity_k_disp] ед§!\nОт складов боеприпасов: §Y[GET_ammunition_silos_capacity_k_disp] ед§!\nОт полевых складов: §Y[GET_ammunition_field_storage_capacity_k_disp] ед§! - [?constant:ammunition.field_storage_days|0] дн. огня всей артиллерии"
 ammunition_window_stock_text: "Запас: §G[GET_ammunition_value_k_disp]§! / §O[GET_ammunition_max_storage_capacity_k_disp] ед§! ([?ammo_ratio_var|0]%)"
 ammunition_window_stock_tt: "Готово к применению: §G[GET_ammunition_value_k_disp] ед§!\nТребует восстановления: §Y[GET_ammunition_old_value_k_disp] ед§!\nЗаполненность складов: [GET_ammunition_silos_filling_factor]"
 ammunition_window_old_stock_text: "Требует восстановления: §Y[GET_ammunition_old_value_k_disp] ед§!"
 ammunition_window_old_stock_tt: "§YСтарые боеприпасы.§! В бою не расходуются, пока заводы их не восстановят. Занимают место на складах; при переполнении складов списываются первыми."
 ammunition_window_balance_text: "Баланс: [GET_ammunition_delta_value_k]"
 ammunition_window_balance_tt: "§YБаланс за день§! = выработка - расход\nВыработка: §G[GET_ammunition_generation_value_k_disp] ед/день§!\nРасход: §R[GET_ammunition_spent_k_disp] ед/день§!"
 ammunition_window_stock_days_text: "[GET_ammunition_window_stock_days]"
 ammunition_window_stock_days_run_out: "§RБоеприпасы закончились§!"
 ammunition_window_stock_days_will_run_out: "Закончится через: §R[?ammo_days_to_empty|0]§! дн."
 ammunition_window_stock_days_filled: "§GСклады заполнены§!"
 ammunition_window_stock_days_will_be_full: "Заполнится через: §G[?ammo_days_to_full|0]§! дн."
 ammunition_window_stock_days_stable: "§YЗапас не меняется§!"
 ammunition_window_days_at_level_1_text: "Дней при уровне 100%: [GET_ammunition_days_at_level_1]"
 ammunition_window_days_at_level_1_tt: "§YНа сколько дней хватит готового запаса при уровне снабжения 100%§!\nПотребность при уровне 100%: §R[GET_ammunition_need_reference_k_disp] ед/день§![GET_ammunition_need_reference_note]\nВыработка: §G[GET_ammunition_generation_value_k_disp] ед/день§!\n\nЕсли выработка покрывает потребность - §G1000+§!."
 ammunition_need_reference_no_combat: "\nБоёв нет: оценка для всех дивизий страны в обороне."
 ammunition_days_at_level_1_value: "§O[?ammunition_days_at_level_1|0]§!"
 ammunition_days_at_level_1_unlimited: "§G1000+§!"

 ammunition_window_consumption_title_text: "§gРаспределение боеприпасов§!"
 ammunition_window_supply_factor_ai_status_text: "§YАвтоматизация:§!"
 ammunition_supply_factor_ai_disabled: "§Rвыкл§!"
 ammunition_supply_factor_ai_enabled: "§Gвкл§!"
 ammunition_window_supply_factor_ai_status_tt: "§YАвтоматизация каждый день выставляет уровень снабжения по тому же правилу, что у ИИ.§!\n\nДней запаса при уровне 100% с учётом выработки: §O[?ammunition_days_at_level_1|0]§!\n  От §Y[?constant:ammunition.ai_days_low|0]§! до §Y[?constant:ammunition.ai_days_high|0]§!: §Y100%§!.\n  Меньше §Y[?constant:ammunition.ai_days_low|0]§!: уровень, при котором склада хватит на §Y[?constant:ammunition.ai_days_low|0]§! дн., но не ниже §Y[?constant:ammunition.ai_level_min|%0]§!.\n  Больше §Y[?constant:ammunition.ai_days_high|0]§!: уровень, при котором склада хватит на §Y[?constant:ammunition.ai_days_high|0]§! дн.\n\nК результату прибавляются модификаторы цели: §Y[?modifier@ammunition_level_target|+%0]§!.\nУровень не превышает предел."
 ammunition_window_level_text: "Уровень снабжения: [GET_ammunition_level]"
 ammunition_window_level_cap_text: "Предел снабжения: [GET_ammunition_level_cap]"
 ammunition_window_level_button_tt: "§YИзменение уровня снабжения§!\n\n§YЛКМ§! - повысить на 1%\n§YCTRL+ЛКМ§! - повысить на 10%\n§YSHIFT+ЛКМ§! - повысить на 100%\n\n§YПКМ§! - снизить на 1%\n§YCTRL+ПКМ§! - снизить на 10%\n§YSHIFT+ПКМ§! - снизить на 100%"
 ammunition_level_cap_lowered: "§Y[?ammunition_level_max|%0]§!"
 ammunition_level_cap_base: "§G[?ammunition_level_max|%0]§!"
 ammunition_level_cap_reasons_lowered: "\n\n§YПредел снижен§! с базового максимума §Y[?constant:ammunition.level_max_base|%0]§! до §Y[?ammunition_level_max|%0]§!.\nМодификаторы предела: [?modifier@ammunition_level_cap|+%0]\n[GET_ammunition_level_cap_source]"
 ammunition_level_cap_reasons_raised: "\n\n§GПредел повышен§! с базового максимума §Y[?constant:ammunition.level_max_base|%0]§! до §G[?ammunition_level_max|%0]§!, не выше §Y[?constant:ammunition.level_max_abs|%0]§!.\nМодификаторы предела: [?modifier@ammunition_level_cap|+%0]\n[GET_ammunition_level_cap_source]"
 ammunition_level_cap_source_RUS_genstab: "  - $ammunition_RUS_genstab_limitation$"
 ammunition_level_cap_source_war_mobilisation: "  - $ammunition_war_mobilisation$"
 ammunition_level_cap_source_other: "  - прочие источники"
 ammunition_level_auto_reason_low_days: "\n\n§YАвтоматизация снизила уровень:§! при 100% склада хватит только на §O[?ammunition_days_at_level_1|0]§! дн., меньше §Y[?constant:ammunition.ai_days_low|0]§!."
 ammunition_level_auto_reason_high_days: "\n\n§GАвтоматизация повысила уровень:§! при 100% склада хватит на §O[?ammunition_days_at_level_1|0]§! дн., больше §Y[?constant:ammunition.ai_days_high|0]§!."
 ammunition_level_auto_target: "\n\n§YАвтоматизация сдвигает уровень модификаторами цели:§! [?modifier@ammunition_level_target|+%0]"
 ammunition_empty_text: ""
 ammunition_window_level_tt: "§YДоля полной потребности воюющих частей, которая уходит на фронт.§!\n\nДиапазон: §Y[?constant:ammunition.level_min|%0]§! - §Y[?ammunition_level_max|%0]§!\nНиже 100% артиллерия получает штраф, выше 100% - бонус; расход растёт с уровнем.[GET_ammunition_level_cap_reasons]"
 ammunition_window_level_auto_text: "Цель автоматизации: §Y[?ammunition_level_auto|%0]§!"
 ammunition_window_level_auto_tt: "§YУровень снабжения, который выставляет автоматизация§!, с модификаторами цели, не выше предела.[GET_ammunition_level_auto_reason][GET_ammunition_level_auto_target]"
 ammunition_level_green: "§G[?ammunition_level|%0]§!"
 ammunition_level_yellow: "§Y[?ammunition_level|%0]§!"
 ammunition_level_red: "§R[?ammunition_level|%0]§!"
 ammunition_window_spent_text: "Расход: [GET_ammunition_window_spent]"
 ammunition_no_combat: "§Gнет боёв§!"
 ammunition_window_spent_normal: "§O[GET_ammunition_spent_k_disp]§! из §O[GET_ammunition_need_k_disp] ед/д§!"
 ammunition_window_spent_red: "§R[GET_ammunition_spent_k_disp]§! из §R[GET_ammunition_need_k_disp] ед/д§!"
 ammunition_window_spent_tt: "§YРасход§! - сколько боеприпасов фронт получил за день из потребности при текущем уровне снабжения.\nПотребность растёт с числом дивизий в боях и с уровнем снабжения. Вне боя боеприпасы не расходуются.[GET_ammunition_cover_shortage]"
 ammunition_window_cover_text: "Покрытие: [GET_ammunition_cover]"
 ammunition_window_supply_text: "Обеспеченность: [GET_ammunition_supply]"
 ammunition_window_cover_tt: "§YПокрытие§! - какую часть потребности удалось выдать со склада и из дневной выработки. Ниже 100% фронт получает меньше, чем запросил.[GET_ammunition_cover_shortage]"
 ammunition_window_supply_tt: "§YОбеспеченность§! - уровень снабжения × покрытие. От неё зависит эффект на артиллерию.[GET_ammunition_cover_shortage]"
 ammunition_cover_shortage: "\n\n§RНехватка:§! нужно §R[GET_ammunition_need_k_disp] ед§!, было доступно §O[GET_ammunition_available_k_disp] ед§! (склад и выработка дня). Поднимите выработку или снизьте уровень снабжения."
 ammunition_cover_green: "§G[?ammunition_cover|%0]§!"
 ammunition_cover_red: "§R[?ammunition_cover|%0]§!"
 ammunition_supply_green: "§G[?ammunition_supply|%0]§!"
 ammunition_supply_yellow: "§Y[?ammunition_supply|%0]§!"
 ammunition_supply_red: "§R[?ammunition_supply|%0]§!"
 ammunition_window_divisions_text: "Дивизии: §O[?ammunition_divisions|0]§! (ат. §O[?ammunition_divisions_off|0]§!, об. §O[?ammunition_divisions_def|0]§!)"
 ammunition_window_divisions_tt: "§YДивизии в боях§!\nВ наступлении: §O[?ammunition_divisions_off|0]§!, расход ×§Y[?ammunition_factor_off|2]§!\nВ обороне: §O[?ammunition_divisions_def|0]§!, расход ×§Y[?ammunition_factor_def|2]§!\nДивизии вне боя боеприпасы не расходуют."

 ammunition_window_effects_title_text: "§gЭффект обеспечения§!"
 ammunition_window_effect_soft_attack_text: "Противопехотная атака: [?ammunition_bonus_attack|=+%1]"
 ammunition_window_effect_hard_attack_text: "Противотанковая атака: [?ammunition_bonus_attack|=+%1]"
 ammunition_window_effect_breakthrough_text: "Прорыв: [?ammunition_bonus_breakthrough|=+%1]"
 ammunition_window_effect_defense_text: "Защита: [?ammunition_bonus_defense|=+%1]"
 ammunition_window_effect_supply_consumption_text: "Потребление снабжения: [?ammunition_bonus_supply_consumption|=-%1]"
 ammunition_window_effects_tt: "§YИзменение характеристик артиллерии, САУ, РСЗО, ТОС и миномётов при текущей обеспеченности.§! Другое снаряжение не затрагивается.\nЭффект действует через национальный дух, ступенями по 5% обеспеченности.\nПрорыв действует только в наступлении, защита - только в обороне.\n\nАгрессивность ИИ: [?ammunition_effect_ai_focus_aggressive_factor|=+%0]"

