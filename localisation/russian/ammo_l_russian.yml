l_russian:
 ammunition_topbar_tooltip_delayed: "§HБоеприпасы§! производятся на военных цехах или цехах по производству боеприпасов.\n§YРасходуют боеприпасы:§! артиллерия, САУ, РСЗО, ТОС и миномёты.\n§RБез боеприпасов они теряют атаку, прорыв и защиту.§!"

 ammunition_plants: "Цеха по производству боеприпасов"
 ammunition_silos: "Склады боеприпасов"

 ammunition_effects: "Боеприпасы"
