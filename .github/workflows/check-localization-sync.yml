name: Check localization sync

on:
  pull_request:

jobs:
  localization-sync:
    name: localization-sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check localization files
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }}

          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          FAILED=0

          check_pair() {
            BASE_NAME="$1"

            EN_FILE="localisation/english/${BASE_NAME}_l_english.yml"
            RU_FILE="localisation/russian/${BASE_NAME}_l_russian.yml"

            EN_CHANGED=$(echo "$CHANGED_FILES" | grep -Fx "$EN_FILE" || true)
            RU_CHANGED=$(echo "$CHANGED_FILES" | grep -Fx "$RU_FILE" || true)

            if [[ -n "$EN_CHANGED" || -n "$RU_CHANGED" ]]; then
              echo "Checking localization group: $BASE_NAME"

              if [[ -z "$EN_CHANGED" ]]; then
                echo "❌ Missing English update: $EN_FILE"
                FAILED=1
              fi

              if [[ -z "$RU_CHANGED" ]]; then
                echo "❌ Missing Russian update: $RU_FILE"
                FAILED=1
              fi
            fi
          }

          BASE_NAMES=$(echo "$CHANGED_FILES" \
            | grep -E '^localisation/(english|russian)/.*_l_(english|russian)\.yml$' \
            | sed -E 's#^localisation/(english|russian)/##' \
            | sed -E 's#_l_(english|russian)\.yml$##' \
            | sort -u)

          echo "Localization base names:"
          echo "$BASE_NAMES"

          for BASE in $BASE_NAMES; do
            check_pair "$BASE"
          done

          if [[ "$FAILED" -eq 1 ]]; then
            echo "❌ Localization sync check failed."
            exit 1
          fi

          echo "✅ Localization sync check passed."